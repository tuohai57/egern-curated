name: 凤凰新闻
description: 移除皮肤、开屏广告、信息流广告、文末广告、视频流广告、评论区广告，移除信息流订阅号文章、文末推荐阅读，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/ifengNews.png
map_locals:
- match: (?i)^https:\/\/nine\.ifeng\.com\/adPreload\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/nine\.ifeng\.com\/startUpAdPrestrainList\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/nine\.ifeng\.com\/startUpAddAd\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/config\.nine\.ifeng\.com\/news\/h5prepublish\?
  status_code: 404
  body: ''
  headers:
    Content-Type: text/plain; charset=utf-8
- match: (?i)^https:\/\/nine\.ifeng\.com\/searchhotwordsrollv\d\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/nine\.ifeng\.com\/searchvideohotwordsroll\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/nine\.ifeng\.com\/searchHotwordsReact\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/user\.iclient\.ifeng\.com\/active_task\/channel\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/nine\.ifeng\.com\/newRelatedDocs\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/nine\.ifeng\.com\/getdocbackinfo\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/user\.iclient\.ifeng\.com\/event_protal\/list_lite\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/nine\.ifeng\.com\/adVideoImmersionWindow\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - nine.ifeng.com
  - config.nine.ifeng.com
  - user.iclient.ifeng.com
  - comment.ifeng.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/config\.nine\.ifeng\.com\/news\/cow\?
    filter: (.bottomNav|=map(select(.NavId=="bottomNavNews" or .NavId=="bottomNavMine")))
      | (delpaths([["zip_url"]]))
- response_jq:
    match: (?i)^https:\/\/config\.nine\.ifeng\.com\/news\/channel\?
    filter: (.defaultChannel |= map(select(.id == "commenterch" or .id == "sy" or
      .id == "vipchannel" or .id == "rank_hot_merge" or .id == "rtnews" or .id ==
      "sp" or .id == "mil" or .id == "finance" or .id == "history" or .id == "momentsnew"
      or .id == "taihai" or .id == "focusnews" or .id == "rcmd" or .id == "tw" or
      .id == "HK" or .id == "dawanqu1"))) | (delpaths([["more"], ["youngChannel"]]))
- response_jq:
    match: (?i)^https:\/\/nine\.ifeng\.com\/headline\?
    filter: (walk(if type == "object" and has("item") and (.item | type == "array")
      then .item |= map(select(.type == "phvideo" or .type == "doc" or .type == "phreclist"))
      else . end))
- response_jq:
    match: (?i)^https:\/\/nine\.ifeng\.com\/getNewsDocs\?
    filter: (delpaths([["body", "showAdvert"], ["body", "adData"]]))
- response_jq:
    match: (?i)^https:\/\/nine\.ifeng\.com\/phoenixTvChannel\?
    filter: (map(if has("item") then .item|=map(select(.type=="columnfastmessagescroll"
      or .type=="phvideo" or .type=="videoseriesrecommendmarquee" or .type=="short"))
      else . end))
- response_jq:
    match: (?i)^https:\/\/nine\.ifeng\.com\/videoimmersionlistv\d\?
    filter: (map(if has("item") then .item|=map(select(.type=="miniVideo" or .type=="phvideo"))
      else . end))
- response_jq:
    match: (?i)^https:\/\/nine\.ifeng\.com\/shortList\?
    filter: (map(.item|=map(select(.type=="short"))))
- response_jq:
    match: (?i)^https:\/\/comment\.ifeng\.com\/v\d\/get\/commentlist\?
    filter: (del(.comments[] | select(.type == "advert")))
