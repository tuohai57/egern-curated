name: 什么值得买
description: 移除开屏广告、信息流广告、各类横幅广告、搜索页广告、文章内广告，移除活动皮肤、精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/ZhiDeMai.png
homepage: https://hub.kelee.one
rules:
- domain:
    match: adx-api.zdmimg.com
    policy: REJECT
- url_regex:
    match: ^https:\/\/h5\.smzdm\.com\/user\/coupon\/coupon_list\?
    policy: REJECT
body_rewrites:
- response_jq:
    match: ^https:\/\/app-api\.smzdm\.com\/util\/update$
    filter: '(

      (

      (

      (

      (

      (

      (

      if (getpath(["data"]) | has("silence_local_push")) then (setpath(["data","silence_local_push"];
      0)) else . end

      ) | (

      if (getpath(["data"]) | has("baichuan_redirect_switch")) then (setpath(["data","baichuan_redirect_switch"];
      0)) else . end

      )

      ) | (

      delpaths([["data","silence_local_push_msg"]])

      )

      ) | (

      delpaths([["data","video_cache_num_configs"]])

      )

      ) | (

      delpaths([["data","haojia_widget"]])

      )

      ) | (

      delpaths([["data","widget"]])

      )

      ) | (

      delpaths([["data","operation_float"]])

      )

      ) | (

      def r: if type=="object" then if has("ad_campaign_name") and (.ad_campaign_name|type=="string")
      and (.ad_campaign_name|test("\\S")) then empty else . end elif type=="array"
      then map(r) else . end; .data.operation_float |= map(map(r))

      )'
- response_jq:
    match: ^https:\/\/homepage-api\.smzdm\.com\/v3\/home\?
    filter: '   .data.component |= map(    if (.zz_content | type) == "array" then     .zz_content
      |= map(       select(         ( (.ad_campaign_id? | type == "string" and length
      > 0)// false ) or         ( (.tag? | type == "string" and length > 0)// false
      ) or         ( (.model_type? == "ads" and (type == "string"))// false )         |
      not       )     )   else . end )  | .data.component |= map(   select(.zz_type
      == "circular_banner" or .zz_type == "filter" or .zz_type == "list") )  | .data.component
      |= map(   .zz_content |= (     if type == "array" then       map(         if
      type == "object" and (.article_channel_type// "") == "questionnaire" then           empty         else           .         end       )     else       .     end   )
      )   | del(.data.theme)  | .data.component |= map(   if .zz_content | type ==
      "object" then     .zz_content |= del(.circular_banner_option)   else     .   end
      )'
- response_jq:
    match: ^https:\/\/haojia-api\.smzdm\.com\/home\/list\?
    filter: '(

      delpaths([["data","header_operation","theme"]])

      ) | (

      .data.rows |= map(select(.cell_type == "39001")) | .data.banner_v2 |= map(select(.cell_type
      == "21028"))

      )'
- response_jq:
    match: ^https:\/\/haojia\.m\.smzdm\.com\/detail_modul\/user_related_modul\?
    filter: delpaths([["data","super_coupon"]])
- response_jq:
    match: ^https:\/\/haojia\.m\.smzdm\.com\/detail_modul\/other_modul\?
    filter: delpaths([["data","banner"]])
- response_jq:
    match: ^https:\/\/user-api\.smzdm\.com\/vip$
    filter: '(

      (

      (

      (

      delpaths([["data","activity_entrance_info"]])

      ) | (

      delpaths([["data","big_banner"]])

      )

      ) | (

      delpaths([["data","top_banner"]])

      )

      ) | (

      delpaths([["data","banner_switch"]])

      )

      ) | (

      delpaths([["data","yaoqingshaiwu"]])

      )'
- response_jq:
    match: ^https:\/\/s-api\.smzdm\.com\/sou\/list_v10\?
    filter: .data.rows |= map(select(.model_type != "ads")) | .data.top_aladdin |=
      map(select(has("ad") | not))
- response_jq:
    match: ^https:\/\/s-api\.smzdm\.com\/sou\/filter\/tags\/hot_tags\?
    filter: '(

      (

      (

      delpaths([["data","search_faxian"]])

      ) | (

      delpaths([["data","tonglan"]])

      )

      ) | (

      delpaths([["data","hongbao"]])

      )

      ) | (

      .data.search_hot.home |= map(select(.article_tag.article_title != "广告")) | .data.search_hot.home
      |= map(select(has("pos")))

      )'
- response_jq:
    match: ^https:\/\/haojia-api\.smzdm\.com\/detail\/\d+\?
    filter: delpaths([["data","quan_log"]])
- response_jq:
    match: ^https:\/\/haojia-cdn\.smzdm\.com\/preload\/\d+\/fiphone\/v\d+_\d+_\d+\/wx\d+\/im\d+\/[0-9a-z]+\/[0-9a-z]+\.json$
    filter: delpaths([["data","quan_log"]])
- response_jq:
    match: ^https:\/\/post\.m\.smzdm\.com\/ajax_app\/ajax_get_footer_list\?
    filter: '(

      delpaths([["data","tuiguang_ad"]])

      ) | (

      delpaths([["data","activity_banner"]])

      )'
map_locals:
- match: ^https:\/\/app-api\.smzdm\.com\/util\/loading\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/app-api\.smzdm\.com\/mychannel\/list$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/user-api\.smzdm\.com\/vip\/bottom_card_list\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/article-api\.smzdm\.com\/publish\/get_bubble\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/s-api\.smzdm\.com\/sou\/search_default_keyword\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/s-api\.smzdm\.com\/sou\/popup_coupon\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - app-api.smzdm.com
  - homepage-api.smzdm.com
  - h5.smzdm.com
  - haojia-api.smzdm.com
  - haojia.m.smzdm.com
  - user-api.smzdm.com
  - article-api.smzdm.com
  - s-api.smzdm.com
  - haojia-cdn.smzdm.com
  - post.m.smzdm.com
