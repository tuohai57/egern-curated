name: 什么值得买
description: 移除开屏广告、信息流广告、各类横幅广告、搜索页广告、文章内广告，移除活动皮肤、精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/ZhiDeMai.png
homepage: https://hub.kelee.one
rules:
- domain:
    match: adx-api.zdmimg.com
    policy: REJECT
- url_regex:
    match: ^https:\/\/h5\.smzdm\.com\/user\/coupon\/coupon_list\?
    policy: REJECT
body_rewrites:
- response_jq:
    match: ^https:\/\/app-api\.smzdm\.com\/util\/update$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\n(\n(\n(\n(\n(\nif (getpath([\"\
      data\"]) | has(\"silence_local_push\")) then (setpath([\"data\",\"silence_local_push\"\
      ]; 0)) else . end\n) | (\nif (getpath([\"data\"]) | has(\"baichuan_redirect_switch\"\
      )) then (setpath([\"data\",\"baichuan_redirect_switch\"]; 0)) else . end\n)\n\
      ) | (\ndelpaths([[\"data\",\"silence_local_push_msg\"]])\n)\n) | (\ndelpaths([[\"\
      data\",\"video_cache_num_configs\"]])\n)\n) | (\ndelpaths([[\"data\",\"haojia_widget\"\
      ]])\n)\n) | (\ndelpaths([[\"data\",\"widget\"]])\n)\n) | (\ndelpaths([[\"data\"\
      ,\"operation_float\"]])\n)\n) | (\ndef r: if type==\"object\" then if has(\"\
      ad_campaign_name\") and (.ad_campaign_name|type==\"string\") and (.ad_campaign_name|test(\"\
      \\\\S\")) then empty else . end elif type==\"array\" then map(r) else . end;\
      \ .data.operation_float |= map(map(r))\n)\n) ]) as $__egern_results\n      \
      \ | if ($__egern_results | length) == 1\n         then $__egern_results[0] else\
      \ $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/homepage-api\.smzdm\.com\/v3\/home\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n   .data.component |= map(    if (.zz_content\
      \ | type) == \"array\" then     .zz_content |= map(       select(         (\
      \ (.ad_campaign_id? | type == \"string\" and length > 0)// false ) or      \
      \   ( (.tag? | type == \"string\" and length > 0)// false ) or         ( (.model_type?\
      \ == \"ads\" and (type == \"string\"))// false )         | not       )     )\
      \   else . end )  | .data.component |= map(   select(.zz_type == \"circular_banner\"\
      \ or .zz_type == \"filter\" or .zz_type == \"list\") )  | .data.component |=\
      \ map(   .zz_content |= (     if type == \"array\" then       map(         if\
      \ type == \"object\" and (.article_channel_type// \"\") == \"questionnaire\"\
      \ then           empty         else           .         end       )     else\
      \       .     end   ) )   | del(.data.theme)  | .data.component |= map(   if\
      \ .zz_content | type == \"object\" then     .zz_content |= del(.circular_banner_option)\
      \   else     .   end )\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/haojia-api\.smzdm\.com\/home\/list\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\ndelpaths([[\"data\",\"header_operation\"\
      ,\"theme\"]])\n) | (\n.data.rows |= map(select(.cell_type == \"39001\")) | .data.banner_v2\
      \ |= map(select(.cell_type == \"21028\"))\n)\n) ]) as $__egern_results\n   \
      \    | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/haojia\.m\.smzdm\.com\/detail_modul\/user_related_modul\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndelpaths([[\"data\",\"super_coupon\"\
      ]])\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: ^https:\/\/haojia\.m\.smzdm\.com\/detail_modul\/other_modul\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndelpaths([[\"data\",\"banner\"]])\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/user-api\.smzdm\.com\/vip$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\n(\n(\ndelpaths([[\"data\",\"\
      activity_entrance_info\"]])\n) | (\ndelpaths([[\"data\",\"big_banner\"]])\n\
      )\n) | (\ndelpaths([[\"data\",\"top_banner\"]])\n)\n) | (\ndelpaths([[\"data\"\
      ,\"banner_switch\"]])\n)\n) | (\ndelpaths([[\"data\",\"yaoqingshaiwu\"]])\n\
      )\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: ^https:\/\/s-api\.smzdm\.com\/sou\/list_v10\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.rows |= map(select(.model_type\
      \ != \"ads\")) | .data.top_aladdin |= map(select(has(\"ad\") | not))\n) ]) as\
      \ $__egern_results\n       | if ($__egern_results | length) == 1\n         then\
      \ $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/s-api\.smzdm\.com\/sou\/filter\/tags\/hot_tags\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\n(\ndelpaths([[\"data\",\"search_faxian\"\
      ]])\n) | (\ndelpaths([[\"data\",\"tonglan\"]])\n)\n) | (\ndelpaths([[\"data\"\
      ,\"hongbao\"]])\n)\n) | (\n.data.search_hot.home |= map(select(.article_tag.article_title\
      \ != \"广告\")) | .data.search_hot.home |= map(select(has(\"pos\")))\n)\n) ])\
      \ as $__egern_results\n       | if ($__egern_results | length) == 1\n      \
      \   then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/haojia-api\.smzdm\.com\/detail\/\d+\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndelpaths([[\"data\",\"quan_log\"]])\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/haojia-cdn\.smzdm\.com\/preload\/\d+\/fiphone\/v\d+_\d+_\d+\/wx\d+\/im\d+\/[0-9a-z]+\/[0-9a-z]+\.json$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndelpaths([[\"data\",\"quan_log\"]])\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/post\.m\.smzdm\.com\/ajax_app\/ajax_get_footer_list\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\ndelpaths([[\"data\",\"tuiguang_ad\"\
      ]])\n) | (\ndelpaths([[\"data\",\"activity_banner\"]])\n)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
map_locals:
- match: (?:^https:\/\/app-api\.smzdm\.com\/util\/loading\?)|(?:^https:\/\/app-api\.smzdm\.com\/mychannel\/list$)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/user-api\.smzdm\.com\/vip\/bottom_card_list\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/article-api\.smzdm\.com\/publish\/get_bubble\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: (?:^https:\/\/s-api\.smzdm\.com\/sou\/search_default_keyword\?)|(?:^https:\/\/s-api\.smzdm\.com\/sou\/popup_coupon\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - app-api.smzdm.com
  - homepage-api.smzdm.com
  - h5.smzdm.com
  - haojia-api.smzdm.com
  - haojia.m.smzdm.com
  - user-api.smzdm.com
  - article-api.smzdm.com
  - s-api.smzdm.com
  - haojia-cdn.smzdm.com
  - post.m.smzdm.com
