name: ' iRingo: 🌤 WeatherKit'
description: 'iOS 18 & macOS 15 & watchOS 11

  1.解锁全部天气功能

  2.修改空气质量数据

  3.修改下一小时降水数据

  4.修改天气数据

  5.修改天气预警数据'
compat_arguments:
  DataSets: airQuality,currentWeather,forecastDaily,forecastHourly,forecastNextHour,weatherAlerts
  Weather.Provider: ColorfulClouds
  WeatherAlerts.Provider: QWeatherWeb
  NextHour.Provider: ColorfulClouds
  AirQuality.Current.Pollutants.Provider: ColorfulClouds
  AirQuality.Calculate.Algorithm: EU_EAQI
  API.ColorfulClouds.Token: ''
  API.QWeather.Host: devapi.qweather.com
  API.QWeather.Token: ''
  API.WAQI.Token: ''
  Storage: Argument
  LogLevel: WARN
compat_arguments_desc: "DataSets: [数据集]\n    ├ airQuality: 空气质量\n    ├ currentWeather:\
  \ 当前天气\n    ├ forecastDaily: 每日预报\n    ├ forecastHourly: 每小时预报\n    ├ forecastNextHour:\
  \ 未来一小时降水强度\n    └ weatherAlerts: 天气预警\n选择需要解析并处理的数据集；未选择的数据槽始终保持原样透传，不作修改。\n\n\
  Weather.Provider: [天气] 数据源\n    ├ WeatherKit: WeatherKit（不替换）\n    ├ ColorfulClouds:\
  \ 彩云天气\n    └ QWeather: 和风天气\n使用选定的数据源替换天气数据。\n\nWeatherAlerts.Provider: [天气预警]\
  \ 数据源\n    ├ WeatherKit: WeatherKit（不修改）\n    ├ QWeatherWeb: 和风天气网页\n    ├ QWeather:\
  \ 和风天气 API\n    └ ColorfulClouds: 彩云天气 API\n使用选定的数据源处理天气预警数据。\n\nNextHour.Provider:\
  \ [未来一小时降水强度] 数据源\n    ├ WeatherKit: WeatherKit（不添加）\n    ├ ColorfulClouds: 彩云天气\n\
  \    └ QWeather: 和风天气\n使用选定的数据源填充未来一小时降水强度的数据。\n\nAirQuality.Current.Pollutants.Provider:\
  \ [今日污染物] 数据源\n    ├ ColorfulClouds: 彩云天气\n    └ QWeather: 和风天气\n使用选定的数据源填补污染物数据。\n\
  \nAirQuality.Calculate.Algorithm: [iRingo内置算法] 算法\n    ├ None: 不转换\n    ├ UBA: 德国LQI（FB001846）\n\
  \    ├ EU_EAQI: 欧盟EAQI（ETC HE Report 2024/17）\n    ├ WAQI_InstantCast_US: 美标InstantCast（EPA-454/B-24-002）\n\
  \    ├ WAQI_InstantCast_CN: 国标InstantCast（HJ 633—2012）\n    ├ WAQI_InstantCast_CN_25_DRAFT:\
  \ 国标InstantCast（HJ 633 2025年草案）\n    ├ CA_AQHI: 加拿大AQHI（10.17269/s41997-019-00237-w）\n\
  \    ├ HK_AQHI: 香港AQHI\n    ├ AQHI_Multi_CN: AQHI-Multi（中国）\n    ├ AQHI_Multi_CN_HK:\
  \ AQHI-Multi（中国+香港）\n    ├ CN_DEATH_AQHI: 中国（致死风险）AQHI\n    └ CN_DEATH_HK_AQHI:\
  \ 中国（致死风险）+香港AQHI\n使用内置算法，通过污染物数据本地计算空气指数。InstantCast源自于WAQI，美标版本使用了WAQI的臭氧标准。\n\
  \nAPI.ColorfulClouds.Token: [API] 彩云天气令牌\n彩云天气 API 令牌\n\nAPI.QWeather.Host: [API]\
  \ 和风天气主机\n和风天气 API 使用的主机名\n\nAPI.QWeather.Token: [API] 和风天气令牌\n和风天气 API 令牌\n\nAPI.WAQI.Token:\
  \ [API] WAQI 令牌\nWAQI API 令牌，填写此字段将自动使用WAQI高级API\n\nStorage: [储存] 配置类型\n    ├ Argument:\
  \ 优先使用插件选项与模块参数等，由 $argument 传入的配置，$argument 不包含的设置项由 PersistentStore (BoxJs) 提供\n\
  \    ├ PersistentStore: 只使用来自 BoxJs 等，由 $persistentStore 提供的配置\n    └ database:\
  \ 只使用由作者的 database.mjs 文件提供的默认配置，其他任何自定义配置不再起作用\n选择要使用的配置类型。未设置此选项或不通过此选项的旧版本的配置顺序依旧是\
  \ $persistentStore (BoxJs) > $argument > database。\n\nLogLevel: [调试] 日志等级\n    ├\
  \ OFF: 关闭\n    ├ ERROR: ❌ 错误\n    ├ WARN: ⚠️ 警告\n    ├ INFO: ℹ️ 信息\n    ├ DEBUG:\
  \ \U0001F171️ 调试\n    └ ALL: 全部\n选择脚本日志的输出等级，低于所选等级的日志将全部输出。\n"
open_url: http://boxjs.com/#/app/iRingo.WeatherKit
author: VirgilClyne[https://github.com/VirgilClyne],WordlessEcho[https://github.com/WordlessEcho],001[https://github.com/001ProMax],hhh2210[https://github.com/hhh2210]
homepage: https://NSRingo.github.io/guide/Weather/weather-kit
icon: https://developer.apple.com/assets/elements/icons/weatherkit/weatherkit-128x128.png
dns: {}
rules:
- domain:
    match: weather-analytics-events.apple.com
    policy: REJECT
- domain_suffix:
    match: tthr.apple.com
    policy: REJECT
- domain:
    match: tether.edge.apple
    policy: REJECT
- and:
    match:
    - or:
        match:
        - asn:
            match: '714'
            no_resolve: true
        - asn:
            match: '6185'
            no_resolve: true
    - protocol:
        match: quic
    policy: REJECT
scriptings:
- http_response:
    name: 🌤 WeatherKit.api.v1.availability.response
    match: ^https?:\/\/weatherkit\.apple\.com\/api\/v1\/availability\/
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/ce1db90d77c44fce972db0c2e319845fc1d6a276d41d772c0294882e59d7f999.js
    env:
      _compat.$argument: DataSets="airQuality,currentWeather,forecastDaily,forecastHourly,forecastNextHour,weatherAlerts"&Weather.Provider="ColorfulClouds"&WeatherAlerts.Provider="QWeatherWeb"&NextHour.Provider="ColorfulClouds"&AirQuality.Current.Pollutants.Provider="ColorfulClouds"&AirQuality.Calculate.Algorithm="EU_EAQI"&API.ColorfulClouds.Token=""&API.QWeather.Host="devapi.qweather.com"&API.QWeather.Token=""&API.WAQI.Token=""&Storage="ColorfulClouds00"&LogLevel="ColorfulClouds11"
    body_required: true
- http_request:
    name: 🌤 WeatherKit.api.v1.airQualityScale.request
    match: ^https?:\/\/weatherkit\.apple\.com\/api\/v1\/airQualityScale\/
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/da05af299dd2172e1c25a2bff349cdda268114ee7fc43340cc48da29c76ea033.js
    env:
      _compat.$argument: DataSets="ColorfulClouds22"&Weather.Provider="ColorfulClouds33"&WeatherAlerts.Provider="ColorfulClouds44"&NextHour.Provider="ColorfulClouds55"&AirQuality.Current.Pollutants.Provider="ColorfulClouds66"&AirQuality.Calculate.Algorithm="ColorfulClouds77"&API.ColorfulClouds.Token="ColorfulClouds88"&API.QWeather.Host="ColorfulClouds99"&API.QWeather.Token="QWeatherWeb00"&API.WAQI.Token="QWeatherWeb11"&Storage="QWeatherWeb22"&LogLevel="QWeatherWeb33"
    body_required: true
- http_request:
    name: 🌤 WeatherKit.api.v1.weatherAlerts.html.request
    match: ^https?://weatherkit\.apple\.com/api/v1/weatherAlerts\?[^#]*&ids=[^&#]*-[0-9]{9}(?:&|$)
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/da05af299dd2172e1c25a2bff349cdda268114ee7fc43340cc48da29c76ea033.js
    env:
      _compat.$argument: DataSets="QWeatherWeb44"&Weather.Provider="QWeatherWeb55"&WeatherAlerts.Provider="QWeatherWeb66"&NextHour.Provider="QWeatherWeb77"&AirQuality.Current.Pollutants.Provider="QWeatherWeb88"&AirQuality.Calculate.Algorithm="QWeatherWeb99"&API.ColorfulClouds.Token="ColorfulClouds00"&API.QWeather.Host="ColorfulClouds11"&API.QWeather.Token="ColorfulClouds22"&API.WAQI.Token="ColorfulClouds33"&Storage="ColorfulClouds44"&LogLevel="ColorfulClouds55"
    body_required: true
- http_request:
    name: 🌤 WeatherKit.api.v1.weatherAlerts.api.request
    match: ^https?://weatherkit\.apple\.com/api/v1/weatherAlerts\?[^#]*&ids=-?[0-9]+(?:\.[0-9]+)?,-?[0-9]+(?:\.[0-9]+)?(?:&|$)
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/da05af299dd2172e1c25a2bff349cdda268114ee7fc43340cc48da29c76ea033.js
    env:
      _compat.$argument: DataSets="ColorfulClouds66"&Weather.Provider="ColorfulClouds77"&WeatherAlerts.Provider="ColorfulClouds88"&NextHour.Provider="ColorfulClouds99"&AirQuality.Current.Pollutants.Provider="ColorfulClouds00"&AirQuality.Calculate.Algorithm="ColorfulClouds11"&API.ColorfulClouds.Token="ColorfulClouds22"&API.QWeather.Host="ColorfulClouds33"&API.QWeather.Token="ColorfulClouds44"&API.WAQI.Token="ColorfulClouds55"&Storage="ColorfulClouds66"&LogLevel="ColorfulClouds77"
    body_required: true
- http_response:
    name: 🌤 WeatherKit.api.v2.weather.response
    match: ^https?:\/\/weatherkit\.apple\.com\/api\/v2\/weather\/
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/ce1db90d77c44fce972db0c2e319845fc1d6a276d41d772c0294882e59d7f999.js
    env:
      _compat.$argument: DataSets="ColorfulClouds88"&Weather.Provider="ColorfulClouds99"&WeatherAlerts.Provider="EU_EAQI00"&NextHour.Provider="EU_EAQI11"&AirQuality.Current.Pollutants.Provider="EU_EAQI22"&AirQuality.Calculate.Algorithm="EU_EAQI33"&API.ColorfulClouds.Token="EU_EAQI44"&API.QWeather.Host="EU_EAQI55"&API.QWeather.Token="EU_EAQI66"&API.WAQI.Token="EU_EAQI77"&Storage="EU_EAQI88"&LogLevel="EU_EAQI99"
    body_required: true
    binary_body: true
    max_size: 8388608
mitm:
  hostnames:
  - weatherkit.apple.com
