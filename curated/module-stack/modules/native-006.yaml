url_rewrites: []
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/m?api\.weibo\.c(n|om)\/2\/cardlist\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.items[] | select(.category ==\
      \ \"group\"))\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
scriptings:
- http_response:
    name: 微博-响应
    match: (?i)^https:\/\/m?api\.weibo\.c(n|om)\/2\/groups\/allgroups\/v2\?
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/0f1f3eba5b2c96f4f089525ad033b578b6a18a2fd99eb95409e5b0816f4a4b34.js
    body_required: true
- http_response:
    name: 微博原脚本超话与热搜接口
    match: (?i)^https?://m?api\.weibo\.c(?:n|om)/2/(?:statuses/container_timeline_topicpage|page)\?
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/0f1f3eba5b2c96f4f089525ad033b578b6a18a2fd99eb95409e5b0816f4a4b34.js
    body_required: true
mitm:
  hostnames:
  - '*.weibo.cn'
  - '*.weibo.com'
  - weibo.com
