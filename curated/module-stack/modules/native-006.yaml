- match: (?i:^https:\/\/m?api\.weibo\.c(n|om)\/2\/(?:ug\/checkin\/list|push\/daily|push\/info))|(?i:^https:\/\/m?api\.weibo\.c(n|om)\/2\/!\/live\/media_homelist\?)|(?i:^https:\/\/m?api\.weibo\.c(n|om)\/2\/comments\/bullet_screens\?)|(?i:^https:\/\/m?api\.weibo\.c(n|om)\/2\/photo\/info\?)|(?i:^https:\/\/m?api\.weibo\.c(n|om)\/2\/statuses\/(?:container_positive|push_info))|(?i:^https:\/\/m?api\.weibo\.c(n|om)\/2\/vote\/get_vote_detail\?)|(?i:^https:\/\/m?api\.weibo\.c(n|om)\/2\/!\/chaohua\/discovery\/home_bottom\/switch\?)|(?i:^https:\/\/m?api\.weibo\.c(n|om)\/2\/!\/huati\/(?:discovery_home_bottom_channels|discovery_home_bottom_getdotinfo|mobile_discovery_searchchange))|(?i:^https:\/\/m?api\.weibo\.c(n|om)\/2\/!\/wbox\/\w+\/(?:home_bottom_modal|interest_category))|(?i:^https:\/\/m?api\.weibo\.c(n|om)\/2\/search\/(?:container_discover|finder_nav_polling)\?)|(?i:^https:\/\/m?api\.weibo\.c(n|om)\/2\/hot\/hours_spotlight\?)|(?i:^https:\/\/m?api\.weibo\.c(n|om)\/2\/video\/redpacket\?)|(?i:^https:\/\/m?api\.weibo\.c(n|om)\/2\/!\/(?:search\/finder_nav_polling|sug\/list\/finderchange|was\/finder\/searchbarchange)\?)|(?i:^https:\/\/m?api\.weibo\.c(n|om)\/2\/video\/tiny_video_info_show\?)
