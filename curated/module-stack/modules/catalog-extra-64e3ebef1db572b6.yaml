name: 美食杰
description: 移除开屏广告和信息流广告。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/MeiShiJie.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/newapi\.meishi\.cc\/indexnew\/home_feeds
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\nif .data.items then .data.items |=\
      \ map(select(.type | . != \"101\" and . != \"12\")) else . end\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
mitm:
  hostnames:
  - newapi.meishi.cc
