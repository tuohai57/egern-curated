name: 威锋
description: 移除开屏广告、信息流广告、文末广告、首页轮播图推广。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/WPForum.png
map_locals:
- match: (?i)^https:\/\/api\.wfdata\.club\/v2\/yesfeng\/yesList\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - api.wfdata.club
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api\.wfdata\.club\/v2\/yesfeng\/slideshow\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data |= map(select(.protocolId ==\
      \ 1)))\n) ]) as $__egern_results\n       | if ($__egern_results | length) ==\
      \ 1\n         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
