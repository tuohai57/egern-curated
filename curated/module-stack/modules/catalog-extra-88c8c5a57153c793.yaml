name: 高德地图
description: 过滤高德地图开屏广告、各页面推广，精简我的页面。
author: RuCu6[https://github.com/RuCu6], kelv1n1n[https://github.com/kelv1n1n], 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/Amap.png
homepage: https://hub.kelee.one
rules:
- domain:
    match: amap-aos-info-nogw.amap.com
    policy: REJECT
- domain:
    match: free-aos-cdn-image.amap.com
    policy: REJECT
- domain_suffix:
    match: v.smtcdns.com
    policy: REJECT
body_rewrites:
- response_jq:
    match: ^https:\/\/m5\.amap\.com\/ws\/shield\/search_business\/process\/marketingOperationStructured\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\ndelpaths([[\"data\",\"commonMaterial\"\
      ]])\n) | (\ndelpaths([[\"data\",\"tipsOperationLocation\"]])\n)\n) | (\ndelpaths([[\"\
      data\",\"resourcePlacement\"]])\n)\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/m5\.amap\.com\/ws\/shield\/search_poi\/homepage\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndelpaths([[\"history_tags\"]])\n)\
      \ ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/m5-zb\.amap\.com\/ws\/sharedtrip\/taxi\/order_detail_car_tips\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndelpaths([[\"data\",\"carTips\",\"\
      data\",\"popupInfo\"]])\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
map_locals:
- match: ^https:\/\/m5-zb\.amap\.com\/ws\/ride\/home\/page\/get_commuting_card\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: (?:^https:\/\/m5\.amap\.com\/ws\/shield\/search_business\/process\/orderList\?)|(?:^https:\/\/m5\.amap\.com\/ws\/shield\/search\/new_hotword\?)|(?:^https:\/\/m5\.amap\.com\/ws\/faas\/amap-navigation\/card-service-(?:car-end|route-plan))|(?:^https:\/\/m5\.amap\.com\/ws\/shield\/search_poi\/tips_adv\?)
