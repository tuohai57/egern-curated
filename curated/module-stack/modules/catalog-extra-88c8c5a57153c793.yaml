- match: (?:^https:\/\/m5\.amap\.com\/ws\/aos\/main\/page\/product\/list\?)|(?:^https:\/\/m5\.amap\.com\/ws\/faas\/amap-navigation\/(?:main-page-assets|main-page-location|ridewalk-end-fc|usr-profile-fc\/homeV2))|(?:^https:\/\/m5\.amap\.com\/ws\/(?:mapapi\/hint_text\/offline_data|message\/notice\/list|shield\/search\/new_hotword))|(?:^https:\/\/m5\.amap\.com\/ws\/shield\/scene\/recommend\?)|(?:^https:\/\/m5\.amap\.com\/ws\/valueadded\/weather\/v2\?)
