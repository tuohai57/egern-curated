name: 微脉圈
description: 移除开屏广告、聊天页横幅提示及发现页面的横幅广告。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Weimai.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/confssl\d?\.iweimai\.cn\/wm_ios_update\.json\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\n(\nif (getpath([]) | has(\"\
      isShowCJAd\")) then (setpath([\"isShowCJAd\"]; 0)) else . end\n) | (\ndelpaths([[\"\
      launchAd\"]])\n)\n) | (\ndelpaths([[\"adBanners\"]])\n)\n) | (\ndelpaths([[\"\
      ad\"]])\n)\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
mitm:
  hostnames:
  - confssl*.iweimai.cn
