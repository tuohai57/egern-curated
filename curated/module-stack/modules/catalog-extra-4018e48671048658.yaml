name: CC直播
description: 移除信息流推广和横幅，精简顶部标签。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/CCLive.png
homepage: https://hub.kelee.one
rules:
- url_regex:
    match: ^https:\/\/cc\.163\.com\/act\/m\/daily\/ad_
    policy: REJECT
body_rewrites:
- response_jq:
    match: ^https:\/\/api\.cc\.163\.com\/v\d\/mgamenavigation\/navigation_list\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.info_list |= map(select(.name\
      \ == \"关注\" or .name == \"推荐\" or .name == \"视频\" or .name == \"全部\"))\n) ])\
      \ as $__egern_results\n       | if ($__egern_results | length) == 1\n      \
      \   then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/api\.cc\.163\.com\/v\d\/mgamerecpage\/recommend_page\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.plugins|=map(select(.module_type!=\"\
      banner\"))|.data.plugins|=map(select(.module_type!=\"show_list\"))|.data.plugins|=map(select(.title!=\"\
      推荐品类\"))\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/api\.cc\.163\.com\/v\d\/entpage\/live_navbar_mobile\/ios\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.top_nav |= map(select(.cn_name\
      \ == \"推荐\" or .cn_name == \"星秀\" or .cn_name == \"心动交友\"))\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
map_locals:
- match: ^http:\/\/mshare\.cc\.163\.com\/mshare\/startadv_mobile_v\d\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/appapi\.cc\.163\.com\/v\d\/mixfloatingwindow\/floating_windows\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^http:\/\/api\.cc\.163\.com\/v1\/mpopuprecommend\/exit_room_conf$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - api.cc.163.com
  - cc.163.com
  - mshare.cc.163.com
  - appapi.cc.163.com
