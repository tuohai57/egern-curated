name: 微博轻享版
description: 移除开屏广告、时间线广告及评论区广告，移除发现页面横幅推广、最常访问、主页访客及热门视频，移除搜索填充词。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Weibo_intl.png
map_locals:
- match: (?i)^https:\/\/bootpreload\.uve\.weibo\.com\/v1\/ad\/preload$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i:^https:\/\/api\.weibo\.cn\/2\/cardlist\?v_f=2)|(?i:^https:\/\/api\.weibo\.cn\/2\/ad\/)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/weibointl\.api\.weibo\.cn\/portal\.php\?a=get_searching_info
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - bootpreload.uve.weibo.com
  - weibointl.api.weibo.cn
  - api.weibo.cn
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/weibointl\.api\.weibo\.cn\/portal\.php\?a=trends
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"banner\"],\
      \ [\"data\", \"user_footprint\"], [\"data\", \"profile_accessrecord\"], [\"\
      data\", \"native_content\"]])) | (.data.discover |= map(select(.schema != \"\
      尊享会员\")))\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.weibo\.cn\/2\/statuses\/friends\/timeline$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"advertises\"], [\"ad\"\
      ], [\"ad_version_2_weibo\"]])) | (.statuses|=map(select(.ad_marked!=true)))\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.weibo\.cn\/2\/statuses\/unread_hot_timeline$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"ad\"], [\"ad_version_2_weibo\"\
      ]])) | (.statuses|=map(select(.ad_marked!=true)))\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.weibo\.cn\/2\/comments\/build_comments\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.datas[].data.ad_from_comment? =\
      \ true)\n) ]) as $__egern_results\n       | if ($__egern_results | length) ==\
      \ 1\n         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.weibo\.cn\/2\/statuses\/container_detail\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.pageHeader.data.items |= (if . ==\
      \ null then [] else map(select(.data.itemid != \"top_searching\")) end))\n)\
      \ ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.weibo\.cn\/2\/cardlist\?aid=
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.cards |= map(select((.mblog?|(.ad_marked?|type==\"\
      boolean\")and.ad_marked==true)or(.card_group?|type==\"array\"and any(.[]?;.mblog?|(.ad_marked?|type==\"\
      boolean\")and.ad_marked==true))|not)))\n) ]) as $__egern_results\n       | if\
      \ ($__egern_results | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/weibointl\.api\.weibo\.cn\/portal\.php\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data.cards |= map(.items |= map(if\
      \ .type == \"personal_vip\" then .right_text = \"\" else . end)))\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
