name: 微博轻享版
description: 移除开屏广告、时间线广告及评论区广告，移除发现页面横幅推广、最常访问、主页访客及热门视频，移除搜索填充词。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Weibo_intl.png
map_locals:
- match: (?i)^https:\/\/bootpreload\.uve\.weibo\.com\/v1\/ad\/preload$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api\.weibo\.cn\/2\/cardlist\?v_f=2
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api\.weibo\.cn\/2\/ad\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/weibointl\.api\.weibo\.cn\/portal\.php\?a=get_searching_info
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - bootpreload.uve.weibo.com
  - weibointl.api.weibo.cn
  - api.weibo.cn
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/weibointl\.api\.weibo\.cn\/portal\.php\?a=trends
    filter: (delpaths([["data", "banner"], ["data", "user_footprint"], ["data", "profile_accessrecord"],
      ["data", "native_content"]])) | (.data.discover |= map(select(.schema != "尊享会员")))
- response_jq:
    match: (?i)^https:\/\/api\.weibo\.cn\/2\/statuses\/friends\/timeline$
    filter: (delpaths([["advertises"], ["ad"], ["ad_version_2_weibo"]])) | (.statuses|=map(select(.ad_marked!=true)))
- response_jq:
    match: (?i)^https:\/\/api\.weibo\.cn\/2\/statuses\/unread_hot_timeline$
    filter: (delpaths([["ad"], ["ad_version_2_weibo"]])) | (.statuses|=map(select(.ad_marked!=true)))
- response_jq:
    match: (?i)^https:\/\/api\.weibo\.cn\/2\/comments\/build_comments\?
    filter: (.datas[].data.ad_from_comment? = true)
- response_jq:
    match: (?i)^https:\/\/api\.weibo\.cn\/2\/statuses\/container_detail\?
    filter: (.pageHeader.data.items |= (if . == null then [] else map(select(.data.itemid
      != "top_searching")) end))
- response_jq:
    match: (?i)^https:\/\/api\.weibo\.cn\/2\/cardlist\?aid=
    filter: (.cards |= map(select((.mblog?|(.ad_marked?|type=="boolean")and.ad_marked==true)or(.card_group?|type=="array"and
      any(.[]?;.mblog?|(.ad_marked?|type=="boolean")and.ad_marked==true))|not)))
- response_jq:
    match: (?i)^https:\/\/weibointl\.api\.weibo\.cn\/portal\.php\?
    filter: (.data.cards |= map(.items |= map(if .type == "personal_vip" then .right_text
      = "" else . end)))
