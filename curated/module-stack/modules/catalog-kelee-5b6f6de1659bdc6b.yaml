name: 虎嗅
description: 移除广告配置、信息流直播预约横幅、相关文章推荐、48小时热文推荐，精简搜索页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Huxiu.png
rules:
- domain:
    match: api-ad-product.huxiu.com
    policy: REJECT
map_locals:
- match: (?i)^https:\/\/api-ms-config\.huxiu\.com\/v1\/adConfig$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api-web-feed\.huxiu\.com\/v1\/index\/recommendContentsNew$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api-search\.huxiu\.com\/api\/searchIndex$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api-article\.huxiu\.com\/v2\/article\/getTextArticleRelated$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api-web-moment\.huxiu\.com\/v3\/moment\/getDetailRecdArticle$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - api-ms-config.huxiu.com
  - api-web-feed.huxiu.com
  - api-search.huxiu.com
  - api-article.huxiu.com
  - api-web-moment.huxiu.com
  - api-ms-feed.huxiu.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api-ms-feed\.huxiu\.com\/v1\/media\/recommend$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"live\"]]))\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
