name: 小黑盒（可莉·适配）〔版本1〕
description: 移除开屏广告和热点板块信息流广告
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/XiaoHeiHe.png
open_url: https://apps.apple.com/app/id1244505010
tag: 去广告
url_rewrites: []
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api\.xiaoheihe\.cn\/bbs\/app\/feeds\/news
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.result.links |= map(if .content_type\
      \ == 27 then del(.title, .ad_pm, .img_gif, .idea_id, .ad_report, .label, .source,\
      \ .intranet_only, .ad_cm, .content_type, .PROTOCOL, .img, .ad_ratio) else .\
      \ end)\n) ]) as $__egern_results\n       | if ($__egern_results | length) ==\
      \ 1\n         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
mitm:
  hostnames:
  - api.xiaoheihe.cn
map_locals:
- match: (?i)^https:\/\/api\.xiaoheihe\.cn\/account\/get_ads_info_v2
  status_code: 200
  body: '{}'
