name: 得物
description: 移除开屏广告、弹窗、搜索词填充、热搜榜、猜你想搜、推荐关注、推荐信息流，精简消息中心和我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Dewu.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/app\.dewu\.com\/api\/v1\/app\/biz-aggregate\/me\/user-index\?
    filter: .data.modules |= map(if .key == "wallet" then .data.menus |= map(select(.key
      == "coupon" or .key == "allowance" or .key == "gift" or .key == "balance"))
      else . end) | .data.modules |= map(select(.key != "merchant" and .key != "discountCoupon"))
- response_jq:
    match: ^https:\/\/app\.dewu\.com\/api\/v1\/app\/account\/wallet\/page\/entrance\?
    filter: '.data.groupInfoDTOS |= map(.moduleInfoDTO = {assetModule: .moduleInfoDTO.assetModule})
      | .data.moduleNames = [.data.moduleNames[] | select(. == "assetModule")] | .
      as $full | $full | .data.groupNames |= (map(select(. == "MAIN" or . == "ASYNC_COMMON"
      or . == "ASYNC_GOODS_FEEDS")))'
- response_jq:
    match: ^https:\/\/app\.dewu\.com\/identify-discovery\/v1\/discovery\/index\?
    filter: .data.groups |= map(.items |= map(select(.title == "消息中心")))
map_locals:
- match: ^https:\/\/app\.dewu\.com\/api\/v1\/app\/advertisement\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/app\.dewu\.com\/hacking-newbie\/v1\/app\/coupon\/module\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/app\.dewu\.com\/api\/v1\/app\/search\/lexicon\/v3\/background_words\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/app\.dewu\.com\/api\/v1\/app\/search\/lexicon\/v1\/rank_words\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/app\.dewu\.com\/sns-rec\/v1\/attention\/feed\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/app\.dewu\.com\/sns-rec\/v1\/search\/word-skip\/new-list\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/app\.dewu\.com\/sns-rec\/v1\/search\/hotword-list\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - app.dewu.com
