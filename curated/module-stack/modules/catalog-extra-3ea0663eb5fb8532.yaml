  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/zgrb\.epicc\.com\.cn\/G-HAPP\/a\/config\/guessYouLike\/v3
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - zgrb.epicc.com.cn
