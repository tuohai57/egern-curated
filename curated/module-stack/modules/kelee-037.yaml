name: 知乎
description: 移除HTTPDNS和QUIC传输配置，移除开屏广告、信息流广告、回答页广告，移除回答页下的相关回答、专栏卡片及圈子卡片，移除直答页面推荐知识库和提问推荐，移除评论区评论氛围满意度调查，精简首页顶部标签及我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/ZhiHu.png
map_locals:
- match: (?i:^https:\/\/api\.zhihu\.com\/ad-style-service\/request$)|(?i:^https:\/\/api\.zhihu\.com\/commercial_api\/)|(?i:^https:\/\/api\.zhihu\.com\/commercial_api\/banners_v\d\/app_float_corner\?)|(?i:^https:\/\/api\.zhihu\.com\/next-render\?id=\d+&type=answer)|(?i:^https:\/\/api\.zhihu\.com\/commercial_api\/answer\/\d+\/bottom-v\d$)|(?i:^https:\/\/api\.zhihu\.com\/related_recommend\/feed\/waterfall\?)|(?i:^https:\/\/api\.zhihu\.com\/search\/preset_words\?)|(?i:^https:\/\/api\.zhihu\.com\/search\/related_queries\/question\/\d+$)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i:^https:\/\/zhida\.zhihu\.com\/ai_ingress\/knowledge\/square\/categories\/feeds\?categoryId=1%7D$)|(?i:^https:\/\/zhida\.zhihu\.com\/ai_ingress\/ai_chat\/guidance$)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api\.zhihu\.com\/content-distribution-core\/bubble\/common\/show$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/www\.zhihu\.com\/api\/v\d\/members\/homepage_card$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i:^https:\/\/api\.zhihu\.com\/people\/homepage_entry_v\d$)|(?i:^https:\/\/api\.zhihu\.com\/kvip\/right\/my_card\?)|(?i:^https:\/\/api\.zhihu\.com\/unlimited\/go\/my_card\/v\d\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - m-cloud.zhihu.com
  - api.zhihu.com
  - www.zhihu.com
  - page-info.zhihu.com
  - zhida.zhihu.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/m-cloud\.zhihu\.com\/api\/cloud\/zhihu\/config\/all\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(def drop_keys: {\"km_httpdns_new_config_tars\"\
      :true,\"preFetchHttpDns\":true,\"httpdns_detector_use_concurrent\":true,\"httpdns_use_memory_cache\"\
      :true,\"httpdns_new_config_tars\":true,\"coreNetworkConf_useTars\":true,\"km_coreNetworkConf_useTars\"\
      :true,\"sugarQuicConfig\":true,\"quic_dns_detect_enable\":true,\"quicMixAB\"\
      :true,\"quic_downgrade_enable\":true,\"quic_priority_strategy\":true,\"quic_check_health_enable\"\
      :true,\"tquic_configuration\":true,\"networkExprimentList\":true,\"tars_ab_list\"\
      :true,\"zaSetExtraRequestHeader\":true}; .data.configs |= map(select((drop_keys[.configKey]\
      \ // false) | not) | if (.configValue | type) == \"object\" then del(.configValue.delayHttpdns,\
      \ .configValue.dnsParser, .configValue.HTTPDNS) else . end))\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/root\/tab\/v\d(?:\?.+)?$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.tab_list |= map(select(.tab_type\
      \ == \"follow\" or .tab_type == \"recommend\" or .tab_type == \"hot\" or .tab_type\
      \ == \"ring_tab\")))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/topstory\/recommend\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data |= map(select(.type == \"ComponentCard\"\
      ))) | (.data[]?.children |= (if type == \"array\" then map(select(.id != \"\
      ring\")) else . end))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/questions\/\d+\/feeds\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"ad_info\"]]))\n) ])\
      \ as $__egern_results\n       | if ($__egern_results | length) == 1\n      \
      \   then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/comment_v\d\/(answers|pins)\/\d+\/root_comment\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"atmosphere_voting_config\"\
      ]]))\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/(api|page-info)(?:\.zhihu)?\.com\/answers\/v\d\/\d+(?:\?.*)?$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"third_business\"], [\"\
      float_search_word\"]])) | (.structured_content.segments |= map(select(.type\
      \ != \"card\")))\n) ]) as $__egern_results\n       | if ($__egern_results |\
      \ length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/(articles|answers|pins)\/v\d\/\d+\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"third_business\"], [\"\
      ring_info\"], [\"interaction_bar_plugins\"]]))\n) ]) as $__egern_results\n \
      \      | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/comment_v\d\/answers\/\d+\/list-headers$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"continuous_consumption_module\"\
      ]]))\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/podcasts\/hub\/v\d$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"banners\"]]))\n) ])\
      \ as $__egern_results\n       | if ($__egern_results | length) == 1\n      \
      \   then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/search\/recommend_query\/v\d\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.recommend_queries.queries |= map(select(.type\
      \ == \"normal\")))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/search_v\d\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"pendant\"]]))\n) ])\
      \ as $__egern_results\n       | if ($__egern_results | length) == 1\n      \
      \   then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/search\/tabs\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data |= map(select(.t | IN(\"general\"\
      , \"ai_zhida\", \"recent\", \"people\", \"zvideo\", \"ring\", \"topic\", \"\
      podcast\", \"column\", \"pin\", \"favlist\"))))\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/people\/self$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"vip_info\", \"entrance_new\"\
      , \"right_button\"], [\"vip_info\", \"entrance_v2\"]]))\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
