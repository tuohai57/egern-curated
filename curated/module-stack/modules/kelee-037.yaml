    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/www\.zhihu\.com\/api\/v\d\/members\/homepage_card$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api\.zhihu\.com\/people\/homepage_entry_v\d$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api\.zhihu\.com\/kvip\/right\/my_card\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api\.zhihu\.com\/unlimited\/go\/my_card\/v\d\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - m-cloud.zhihu.com
  - api.zhihu.com
  - www.zhihu.com
  - page-info.zhihu.com
  - zhida.zhihu.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/m-cloud\.zhihu\.com\/api\/cloud\/zhihu\/config\/all\?
    filter: '(def drop_keys: {"km_httpdns_new_config_tars":true,"preFetchHttpDns":true,"httpdns_detector_use_concurrent":true,"httpdns_use_memory_cache":true,"httpdns_new_config_tars":true,"coreNetworkConf_useTars":true,"km_coreNetworkConf_useTars":true,"sugarQuicConfig":true,"quic_dns_detect_enable":true,"quicMixAB":true,"quic_downgrade_enable":true,"quic_priority_strategy":true,"quic_check_health_enable":true,"tquic_configuration":true,"networkExprimentList":true,"tars_ab_list":true,"zaSetExtraRequestHeader":true};
      .data.configs |= map(select((drop_keys[.configKey] // false) | not) | if (.configValue
      | type) == "object" then del(.configValue.delayHttpdns, .configValue.dnsParser,
      .configValue.HTTPDNS) else . end))'
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/root\/tab\/v\d(?:\?.+)?$
    filter: (.tab_list |= map(select(.tab_type == "follow" or .tab_type == "recommend"
      or .tab_type == "hot" or .tab_type == "ring_tab")))
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/topstory\/recommend\?
    filter: (.data |= map(select(.type == "ComponentCard"))) | (.data[]?.children
      |= (if type == "array" then map(select(.id != "ring")) else . end))
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/questions\/\d+\/feeds\?
    filter: (delpaths([["ad_info"]]))
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/comment_v\d\/(answers|pins)\/\d+\/root_comment\?
    filter: (delpaths([["atmosphere_voting_config"]]))
- response_jq:
    match: (?i)^https:\/\/(api|page-info)(?:\.zhihu)?\.com\/answers\/v\d\/\d+(?:\?.*)?$
    filter: (delpaths([["third_business"], ["float_search_word"]])) | (.structured_content.segments
      |= map(select(.type != "card")))
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/(articles|answers|pins)\/v\d\/\d+\?
    filter: (delpaths([["third_business"], ["ring_info"], ["interaction_bar_plugins"]]))
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/comment_v\d\/answers\/\d+\/list-headers$
    filter: (delpaths([["continuous_consumption_module"]]))
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/podcasts\/hub\/v\d$
    filter: (delpaths([["banners"]]))
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/search\/recommend_query\/v\d\?
    filter: (.recommend_queries.queries |= map(select(.type == "normal")))
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/search_v\d\?
    filter: (delpaths([["pendant"]]))
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/search\/tabs\?
    filter: (.data |= map(select(.t | IN("general", "ai_zhida", "recent", "people",
      "zvideo", "ring", "topic", "podcast", "column", "pin", "favlist"))))
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/people\/self$
    filter: (delpaths([["vip_info", "entrance_new", "right_button"], ["vip_info",
      "entrance_v2"]]))
