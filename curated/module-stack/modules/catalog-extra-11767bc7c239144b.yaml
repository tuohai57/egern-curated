name: 萤石云视频
description: 移除开屏广告、首页推广、我的页面推广。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/VideoGo.png
homepage: https://hub.kelee.one
rules:
- url_regex:
    match: ^https:\/\/api\.ys7\.com\/api\/ads
    policy: REJECT
map_locals:
- match: ^https:\/\/i\.ys7\.com\/api\/user\/tabList
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/api\.ys7\.com\/v3\/config\/service\/entrance\/bannerInfo
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/api\.ys7\.com\/v3\/intelligent-app\/apps\/linkage
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/api\.ys7\.com\/v3\/configurations\/gray\/info\?grayTypes=185
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/api\.ys7\.com\/v3\/videoclips\/square\/video\/query
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - api.ys7.com
  - i.ys7.com
