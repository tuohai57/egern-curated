name: 淘票票
description: 移除开屏广告、悬浮广告、轮播图广告和弹窗广告，移除搜索填充词和为你推荐。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Taopiaopiao.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.film\.mtopintegrationapi\.homeconfig\/
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\ndelpaths([[\"data\",\"returnValue\"\
      ,\"floatingBanner\"]])\n) | (\ndelpaths([[\"data\",\"returnValue\",\"searchShadeList\"\
      ]])\n)\n) | (\n.data.returnValue.topTab |= map(select(.activeImage | not)) |\
      \ .data.returnValue.topTab |= map(del(.backgroundColor))\n)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.film\.life\.aristotle\.get\/
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndef filter_nodes: map(if .data.componentId?\
      \ and (.data.componentId | type == \"string\") and (.data.componentId | (contains(\"\
      tpp_banner\") or . == \"tpp_guess_like\")) then empty else .nodes |= (if . then\
      \ filter_nodes else . end) end); .data.nodes |= (if . then filter_nodes else\
      \ . end)\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
map_locals:
- match: (?:^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.film\.life\.popup\.get\/)|(?:^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.film\.mtopindependentadvertiseapi\.queryadvertise\/)|(?:^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.film\.mtopitemadvertiseapi\.queryadvertise\/)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - acs.m.taobao.com
