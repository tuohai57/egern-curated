name: 天气通
description: 移除开屏广告、横幅广告、弹窗广告，精简底栏及我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/TianQiTong.png
map_locals:
- match: (?i)^https:\/\/forecast\.sina\.cn\/app\/overall\/switch\.php\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/tqt\.weibo\.cn\/business\/advert\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/tqt\.weibo\.cn\/user\/device\/ad_multi_star\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/tqt\.weibo\.cn\/operation\/activity\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/tqt\.weibo\.cn\/api\/user\/user\/\d\.\d\/\?method=personal_center$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - forecast.sina.cn
  - tqt.weibo.cn
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/tqt\.weibo\.cn\/master\/nav\/tab\?
    filter: (map(.tabs|=map(select(.type=="weather" or .type=="radar" or .type=="my"))))
