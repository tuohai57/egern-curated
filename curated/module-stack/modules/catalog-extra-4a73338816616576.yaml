name: TeraBox
description: 移除开屏广告、应用内悬浮窗、弹窗广告及横幅广告。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/TeraBox.png
homepage: https://hub.kelee.one
rules:
- domain:
    match: ymg-api.terabox.com
    policy: REJECT
map_locals:
- match: (?:^https:\/\/www\.terabox\.com\/adx\/)|(?:^https:\/\/www\.terabox\.com\/api\/ad\/)|(?:^https:\/\/www\.terabox\.com\/api\/page\/tips\?)|(?:^https:\/\/www\.terabox\.com\/rest\/1\.0\/task\/common\/inttips\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - www.terabox.com
