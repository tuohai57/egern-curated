name: 微信外部链接解锁
description: 解锁微信外部链接访问限制，跳过中间界面。支付宝链接、被封禁链接进行通知弹窗跳转，在微信中用快照显示被封禁的链接（可选），在微信中进行强制重定向（可选），群聊及扫码均可使用，可选项可在脚本的2~3行更改，也可在BoxJs中更改。
author: zZPiglet[https://github.com/zZPiglet]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/WeChat.png
scriptings:
- http_response:
    name: 微信外部链接解锁
    match: (?i)^https\:\/\/(weixin110\.qq|security.wechat)\.com\/cgi-bin\/mmspamsupport-bin\/newredirectconfirmcgi\?
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/f0ed6a3b7dba3365969e6b36b621e13f0feb17f1eef6794ba9a36d0413d36d50.js
    body_required: true
    update_interval: 86400
mitm:
  hostnames:
  - weixin110.qq.com
  - security.wechat.com
