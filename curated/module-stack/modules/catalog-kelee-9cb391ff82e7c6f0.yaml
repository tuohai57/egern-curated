name: 宝宝树孕育
description: 过滤宝宝树孕育广告
author: RuCu6[https://github.com/RuCu6]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/BabyTree.png
rules:
- url_regex:
    match: ^http:\/\/go\.babytree\.com\/go_pregnancy\/api\/(index_activity\/get_app_index_activity|sign\/sign_h_5)\?
    policy: REJECT
- url_regex:
    match: ^http:\/\/go\.babytree\.com\/go_search\/api\/mobile_search_new\/get_multi_search_default_keywords\?
    policy: REJECT
- url_regex:
    match: ^http:\/\/m\.meitun\.com\/newapi\/router\/topic\/hometptf\/feedRecommend
    policy: REJECT
- url_regex:
    match: ^http:\/\/pic08\.babytreeimg\.com\/knowledge\/2022\/0923\/\w+
    policy: REJECT
- url_regex:
    match: ^http:\/\/plough\.babytree\.com\/plough\.do
    policy: REJECT
scriptings:
- http_response:
    name: 调整整体配置
    match: (?i)^http:\/\/api\.babytree\.com\/bafconfigcenter_intf\/config\/get\?
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/0159119e7b367400b85f8814eae93b5030f00bb51a5676e97c03056f3bca70ab.js
    body_required: true
    update_interval: 86400
- http_response:
    name: 移除各页面推广
    match: (?i:^http:\/\/go\.babytree\.com\/go_pregnancy\/api\/(app_index\/get_app_tab|cms_column\/get_column_list|feeds\/get_index_feeds_list|user\/get_user_info)\?)|(?i:^http:\/\/go\.babytree\.com\/go_search\/api\/mobile_search_new\/search_index)
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/0159119e7b367400b85f8814eae93b5030f00bb51a5676e97c03056f3bca70ab.js
    body_required: true
    update_interval: 86400
mitm:
  hostnames:
  - api.babytree.com
  - go.babytree.com
