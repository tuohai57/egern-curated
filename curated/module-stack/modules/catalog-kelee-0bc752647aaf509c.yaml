name: 快递100
description: 移除横幅广告、弹窗广告，精简首页。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/KuaiDi100.png
map_locals:
- match: (?i)^https?:\/\/p\.kuaidi100\.com\/advertisement\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https?:\/\/p\.kuaidi100\.com\/e-commerce\/act\/actInfo\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https?:\/\/p\.kuaidi100\.com\/apicenter\/card\.dox
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - p.kuaidi100.com
body_rewrites:
- response_jq:
    match: (?i)^https?:\/\/p\.kuaidi100\.com\/mobile\/mobileapi\.do$
    filter: (delpaths([["adsplash"], ["adIsConsumable"], ["adProductId"], ["nologin_tips"],
      ["index_banner"], ["me_banner"], ["index_banner_shadow"], ["adshongbao"], ["adsapp_homepage_ticket_pop"],
      ["adsoptimizationsend"], ["adsapp_activity_ad_array"], ["adbanner"], ["adposition"],
      ["adShowAgainTime"]]))
- response_jq:
    match: (?i)^https?:\/\/p\.kuaidi100\.com\/apicenter\/xcx\.dox
    filter: (delpaths([["data", "secondMenuList"]]))
