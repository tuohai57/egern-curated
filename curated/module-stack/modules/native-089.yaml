name: 网易邮箱大师（可莉·适配）
description: 移除网易邮箱大师开屏广告、签到任务提醒，精简侧拉抽屉和我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/MailMaster.png
open_url: https://apps.apple.com/app/id897003024
tag: 去广告
url_rewrites: []
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/appconf\.mail\.163\.com\/mailmaster\/api\/page\/v2\/conf\.do$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.data.functionOperatorInfoList,\
      \ .data.memberOperator, .data.activityTabInfoList)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/appconf\.mail\.163\.com\/mailmaster\/api\/config\/function\.do$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.config[] |= if .result.tools\
      \ then .result.tools |= map(select(.name == \"邮件追踪\" or .name == \"替身邮箱\"))\
      \ else . end | del(.data.config[] | select(.functionName == \"Function-AD\"\
      ))\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
mitm:
  hostnames:
  - appconf.mail.163.com
  - dashi.163.com
map_locals:
- match: (?i)^https:\/\/appconf\.mail\.163\.com\/mailmaster\/api\/http\/urlConfig\.do$
  status_code: 200
  body: '{}'
- match: (?i)^https:\/\/dashi\.163\.com\/task-center-api\/fapi\/task\/list$
  status_code: 200
  body: '{}'
- match: (?i)^https:\/\/appconf\.mail\.163\.com\/mailoperating\/mailmaster\/api\/operator\/get$
  status_code: 200
  body: '{}'
