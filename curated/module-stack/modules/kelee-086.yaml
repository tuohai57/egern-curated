name: 百度网盘（可莉·适配）〔版本2〕
description: 移除开屏广告、首页卡片广告、传输页面广告、各类弹窗，精简侧拉抽屉和我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/BaiduNetDisk.png
map_locals:
- match: (?i:^https:\/\/pan\.baidu\.com\/api\/getconfig\?)|(?i:^https:\/\/pan\.baidu\.com\/api\/getsyscfg\?)|(?i:^https:\/\/pan\.baidu\.com\/api\/taskscore\/tasklist\?)|(?i:^https:\/\/pan\.baidu\.com\/act\/api\/activityentry\?)|(?i:^https:\/\/pan\.baidu\.com\/rest\/\d\.\d\/pcs\/adv\?)|(?i:^https:\/\/pan\.baidu\.com\/api\/plugin\/get\?)|(?i:^https:\/\/pan\.baidu\.com\/recommend\/query\/list\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - pan.baidu.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/pan\.baidu\.com\/feed\/kingkongdistrict\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data.data |= map(select(.type !=\
      \ \"novel\" and .type != \"shortplay\" and .type != \"print\" and .type != \"\
      job_hunt\")))\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
