name: Reddit
description: 过滤应用内推广，阻止NSFW提示。
author: xream[https://github.com/xream]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Reddit.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https?:\/\/gql(-fed)?\.reddit\.com
    filter: ' walk(   if type == "object" then      (if .isNsfw == true then .isNsfw
      = false else . end)     | (if .isNsfwMediaBlocked == true then .isNsfwMediaBlocked
      = false else . end)     | (if .isNsfwContentShown == false then .isNsfwContentShown
      = true else . end)      | (if (.commentsPageAds | type == "array") then (.commentsPageAds
      = []) else . end)      | (if ( (.node | type == "object") and (.node.cells |
      type == "array") and (.node.cells | any(.__typename? == "AdMetadataCell" or
      .isAdPost? == true)) ) then empty else . end)     | (if (.node | type == "object")
      and (.node.adPayload | type == "object") then empty else . end)     | (if .__typename
      == "AdPost" then empty else . end)   else .  end)'
mitm:
  hostnames:
  - gql.reddit.com
  - gql-fed.reddit.com
