name: 美颜相机
description: 移除开屏广告、应用内弹窗，精简首页和我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/MeituMYXJ.png
homepage: https://hub.kelee.one
rules:
- domain:
    match: adui.tg.meitu.com
    policy: REJECT
body_rewrites:
- response_jq:
    match: ^https:\/\/api\.meiyan\.com\/operation\/get_config\.json\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\n(\n(\n(\ndelpaths([[\"response\"\
      ,\"time_limit\"]])\n) | (\ndelpaths([[\"response\",\"bubble\"]])\n)\n) | (\n\
      delpaths([[\"response\",\"person_center\"]])\n)\n) | (\nif (getpath([\"response\"\
      ,\"function_pop\",\"meiyan_style\"]) | has(\"is_pop\")) then (setpath([\"response\"\
      ,\"function_pop\",\"meiyan_style\",\"is_pop\"]; false)) else . end\n)\n) | (\n\
      if (getpath([\"response\",\"onoff\",\"vip_half_window_exit_remain_popup\"])\
      \ | has(\"open\")) then (setpath([\"response\",\"onoff\",\"vip_half_window_exit_remain_popup\"\
      ,\"open\"]; 0)) else . end\n)\n) | (\nif (getpath([\"response\",\"onoff\"])\
      \ | has(\"vip_home_exit_remain_popup\")) then (setpath([\"response\",\"onoff\"\
      ,\"vip_home_exit_remain_popup\"]; 0)) else . end\n)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
map_locals:
- match: (?:^https:\/\/api\.meiyan\.com\/operation\/home_banner\.json\?)|(?:^https:\/\/api\.meiyan\.com\/vip\/permission_update_popup\.json\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - api.meiyan.com
