mitm:
  hostnames:
  - magev6.if.qidian.com
  - ywab.reader.qq.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/client\/getconf$
    filter: (setpath(["Data", "WolfEye"]; 0) | setpath(["Data", "CloudSetting", "TeenShowFreq"];
      0)) | (delpaths([["Data", "ActivityPageBackPushNoticeFrequency"], ["Data", "ActivityIcon"],
      ["Data", "ActivityPopup"], ["Data", "LuckBag"]]))
- response_jq:
    match: (?i)^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v2\/dailyrecommend\/getdailyrecommend\?
    filter: (setpath(["Data", "Items"]; "[]"))
- response_jq:
    match: (?i)^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v3\/user\/getaccountpage\?
    filter: (delpaths([["Data", "BenefitButtonList"]]))
