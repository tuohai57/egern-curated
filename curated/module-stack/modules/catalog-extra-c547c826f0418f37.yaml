- match: ^https:\/\/api\.xiaoyuzhoufm\.com\/v\d\/ai
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/api\.xiaoyuzhoufm\.com\/v\d\/search\/get
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https?:\/\/api\.xiaoyuzhoufm\.com\/v\d\/category
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - api.xiaoyuzhoufm.com
