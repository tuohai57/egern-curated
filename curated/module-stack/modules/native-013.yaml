name: 网易云音乐（可莉·适配）〔版本1〕
description: 保留可莉规则与精简；补齐 Egern 原生 AES/压缩响应处理。隐藏漫游、笔记、关注、问候语和音乐合伙人，保留发现、歌单、推荐、排行榜及真实会员状态。
author: RuCu6[https://github.com/RuCu6], Keywos[https://github.com/Keywos], 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://loonlab.103516.xyz/Plugin/
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/NeteaseMusic.png
open_url: https://apps.apple.com/app/id590338362
tag: 去广告, 解锁会员
compat_arguments:
  FX: 'false'
  MY: 'true'
  DT: 'true'
  GZ: 'true'
  PRGG: 'true'
  PRRK: 'false'
  PRDRD: 'false'
  PRSCVPT: 'false'
  PRST: 'false'
  PRRR: 'false'
  HMPR: 'true'
  PRMST: 'false'
  PRCN: 'false'
  Music163_VIP_Shared: 'false'
  Cookie: ''
  MConfigInfo: ''
  UserAgent: ''
compat_arguments_desc: 'FX: 隐藏[底部-发现]

  MY: 隐藏[底部-漫游]

  DT: 隐藏[底部-笔记]

  GZ: 隐藏[底部-关注]

  PRGG: 隐藏[首页-问候语]

  PRRK: 隐藏[首页-排行榜]

  PRDRD: 隐藏[首页-每日推荐]

  PRSCVPT: 隐藏[首页-推荐歌单]

  PRST: 隐藏[首页-最近常听]

  PRRR: 隐藏[首页-雷达歌单]

  HMPR: 隐藏[首页-音乐合伙人]

  PRMST: 隐藏[首页-推荐专属歌单]

  PRCN: 隐藏[首页-你的专属歌单]

  Music163_VIP_Shared: 启用[共享会员]

  Cookie: Cookie

  MConfigInfo: MConfigInfo

  UserAgent: UserAgent'
rules:
- domain:
    match: iadmat.nosdn.127.net
    policy: REJECT
- domain:
    match: iadmatapk.nosdn.127.net
    policy: REJECT
- domain:
    match: iadmusicmat.music.126.net
    policy: REJECT
- domain:
    match: iadmusicmatvideo.music.126.net
    policy: REJECT
- domain:
    match: ipv4.music.163.com
    policy: REJECT
- domain:
    match: ipv6.music.163.com
    policy: REJECT
- domain:
    match: iad.g.163.com
    policy: REJECT
- domain:
    match: iad.service.163.org
    policy: REJECT
- domain:
    match: bdlog.tanx.com
    policy: REJECT
url_rewrites: []
body_rewrites: []
mitm:
  hostnames:
  - interface*.music.163.com
  - ipv4.music.163.com
map_locals:
- match: (?i)https?:\/\/interface\d?\.music\.163\.com\/x?e?api\/ad
  status_code: 200
  body: '{}'
- match: (?i)https?:\/\/interface\d?\.music\.163\.com\/x?e?api\/sp\/flow\/popup
  status_code: 200
  body: '{}'
- match: (?i)https?:\/\/interface\d?\.music\.163\.com\/x?e?api\/delivery\/(batch-deliver|deliver)
  status_code: 200
  body: '{}'
- match: (?i:^https?:\/\/interface\d?\.music\.163\.com\/eapi\/(?:delivery\/(batch-)?deliver|moment\/tab\/info\/|side-bar\/mini-program\/music-service\/account|yunbei\/account\/entrance\/))|(?i:^https?:\/\/interface\d?\.music\.163\.com\/eapi\/(?:community\/friends\/fans-group\/artist\/group\/|mine\/applet\/redpoint|music\/songshare\/text\/recommend\/|resniche\/position\/play\/new\/|resniche\/tspopup\/show|resource\/comments?\/musiciansaid\/|user\/sub\/artist))|(?i:^https?:\/\/interface\d?\.music\.163\.com\/eapi\/(?:ios\/version|mlivestream\/entrance\/playpage\/|link\/position\/show\/strategy|link\/scene\/show\/resource|v1\/content\/exposure\/comment\/banner\/))|(?i:^https?:\/\/interface\d?\.music\.163\.com\/w?eapi\/(?:activity\/bonus\/playpage\/time\/query|resource-exposure\/|search\/(?:chart\/|rcmd\/keyword\/|specialkeyword\/)))
  status_code: 200
  body: '{}'
- match: (?i)^https:\/\/interface\d\.music\.163\.com\/eapi\/my\/podcast\/tab\/recommend
  status_code: 200
  body: '{}'
scriptings:
- http_response:
    name: 网易云音乐 · 广告与界面精简
    match: (?i)^https?://interface\d?\.music\.163\.com/(?:e?api|weapi)/(?:batch|link/home/framework/tab|homepage/block/page|link/page/discovery/resource/show|link/page/rcmd/(?:resource/show|block/resource/multi/refresh)|link/position/show/resource|search/default|ocpc/ad(?:/[^?#]*)?)/?(?:\?[^#]*)?$
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/netease-ui-native.js
    body_required: true
    binary_body: true
    update_interval: 86400
    env:
      FX: 'false'
      MY: 'true'
      DT: 'true'
      GZ: 'true'
      PRGG: 'true'
      PRRK: 'false'
      PRDRD: 'false'
      PRSCVPT: 'false'
      PRST: 'false'
      PRRR: 'false'
      HMPR: 'true'
      PRMST: 'false'
      PRCN: 'false'
