homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https?:\/\/p\.kuaidi100\.com\/mobile\/mobileapi\.do$
    filter: '(

      (

      (

      (

      (

      (

      (

      (

      (

      (

      (

      (

      (

      delpaths([["adsplash"]])

      ) | (

      delpaths([["adIsConsumable"]])

      )

      ) | (

      delpaths([["adProductId"]])

      )

      ) | (

      delpaths([["nologin_tips"]])

      )

      ) | (

      delpaths([["index_banner"]])

      )

      ) | (

      delpaths([["me_banner"]])

      )

      ) | (

      delpaths([["index_banner_shadow"]])

      )

      ) | (

      delpaths([["adshongbao"]])

      )

      ) | (

      delpaths([["adsapp_homepage_ticket_pop"]])

      )

      ) | (

      delpaths([["adsoptimizationsend"]])

      )

      ) | (

      delpaths([["adsapp_activity_ad_array"]])

      )

      ) | (

      delpaths([["adbanner"]])

      )

      ) | (

      delpaths([["adposition"]])

      )

      ) | (

      delpaths([["adShowAgainTime"]])

      )'
- response_jq:
    match: ^https?:\/\/p\.kuaidi100\.com\/apicenter\/xcx\.dox
