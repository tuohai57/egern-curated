name: 快递100
description: 移除横幅广告、弹窗广告，精简首页。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/KuaiDi100.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https?:\/\/p\.kuaidi100\.com\/mobile\/mobileapi\.do$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\n(\n(\n(\n(\n(\n(\n(\n(\n(\n\
      (\n(\ndelpaths([[\"adsplash\"]])\n) | (\ndelpaths([[\"adIsConsumable\"]])\n\
      )\n) | (\ndelpaths([[\"adProductId\"]])\n)\n) | (\ndelpaths([[\"nologin_tips\"\
      ]])\n)\n) | (\ndelpaths([[\"index_banner\"]])\n)\n) | (\ndelpaths([[\"me_banner\"\
      ]])\n)\n) | (\ndelpaths([[\"index_banner_shadow\"]])\n)\n) | (\ndelpaths([[\"\
      adshongbao\"]])\n)\n) | (\ndelpaths([[\"adsapp_homepage_ticket_pop\"]])\n)\n\
      ) | (\ndelpaths([[\"adsoptimizationsend\"]])\n)\n) | (\ndelpaths([[\"adsapp_activity_ad_array\"\
      ]])\n)\n) | (\ndelpaths([[\"adbanner\"]])\n)\n) | (\ndelpaths([[\"adposition\"\
      ]])\n)\n) | (\ndelpaths([[\"adShowAgainTime\"]])\n)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https?:\/\/p\.kuaidi100\.com\/apicenter\/xcx\.dox
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndelpaths([[\"data\",\"secondMenuList\"\
      ]])\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
map_locals:
- match: (?:^https?:\/\/p\.kuaidi100\.com\/advertisement\/)|(?:^https?:\/\/p\.kuaidi100\.com\/e-commerce\/act\/actInfo\?)|(?:^https?:\/\/p\.kuaidi100\.com\/apicenter\/card\.dox)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - p.kuaidi100.com
