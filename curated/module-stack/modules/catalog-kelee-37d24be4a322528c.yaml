name: 微博
description: 过滤微博广告及去除各部分推广模块
author: RuCu6[https://github.com/RuCu6], zmqcherish[https://github.com/zmqcherish]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/WeiBo.png
rules:
- domain_suffix:
    match: uve.weibo.com
    policy: DIRECT
- domain:
    match: huodong.weibo.cn
    policy: REJECT
- domain_suffix:
    match: biz.weibo.com
    policy: REJECT
map_locals:
- match: (?i:^https:\/\/api\.weibo\.cn\/2\/(?:ug\/checkin\/list|push\/daily|push\/info))|(?i:^https:\/\/api\.weibo\.cn\/2\/!\/live\/media_homelist\?)|(?i:^https:\/\/api\.weibo\.cn\/2\/comments\/bullet_screens\?)|(?i:^https:\/\/api\.weibo\.cn\/2\/photo\/info\?)|(?i:^https:\/\/api\.weibo\.cn\/2\/statuses\/(?:container_positive|push_info))|(?i:^https:\/\/api\.weibo\.cn\/2\/vote\/get_vote_detail\?)|(?i:^https:\/\/api\.weibo\.cn\/2\/!\/chaohua\/discovery\/home_bottom\/switch\?)|(?i:^https:\/\/api\.weibo\.cn\/2\/!\/huati\/(?:discovery_home_bottom_getdotinfo|mobile_discovery_searchchange))|(?i:^https:\/\/api\.weibo\.cn\/2\/!\/wbox\/\w+\/(?:home_bottom_modal|interest_category))|(?i:^https:\/\/api\.weibo\.cn\/2\/search\/(?:container_discover|finder_nav_polling)\?)|(?i:^https:\/\/api\.weibo\.cn\/2\/hot\/hours_spotlight\?)|(?i:^https:\/\/api\.weibo\.cn\/2\/video\/redpacket\?)|(?i:^https:\/\/api\.weibo\.cn\/2\/!\/(?:search\/finder_nav_polling|sug\/list\/finderchange|was\/finder\/searchbarchange)\?)|(?i:^https:\/\/api\.weibo\.cn\/2\/video\/tiny_video_info_show\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/bootrealtime\.uve\.weibo\.com\/v[23]\/ad\/realtime
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/sdkapp\.uve\.weibo\.com\/interface\/sdk\/(?:get-lbs-cell-info\.php|sdkconfig\.php)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/card\.weibo\.com\/article\/m\/aj\/(?:reward|uvead)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/weibo\.com\/ttarticle\/x\/m\/aj\/(?:reward|uvead)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
scriptings:
- http_response:
    name: 移除首页推广
    match: (?i:^https:\/\/api\.weibo\.cn\/2\/(?:checkin\/show|client\/publisher_list|push\/active))|(?i:^https:\/\/api\.weibo\.cn\/2\/groups\/allgroups\/v2\?)|(?i:^https:\/\/api\.weibo\.cn\/2\/(?:cardlist|page))|(?i:^https:\/\/api\.weibo\.cn\/2\/comments\/build_comments\?)|(?i:^https:\/\/api\.weibo\.cn\/2\/(?:container\/asyn|flowlist|flowpage))|(?i:^https:\/\/api\.weibo\.cn\/2\/friendships\/(?:create|destroy))|(?i:^https:\/\/api\.weibo\.cn\/2\/profile\/(?:container_timeline|dealatt|me|statuses\/tab|userinfo))|(?i:^https:\/\/api\.weibo\.cn\/2\/shproxy\/chaohua\/discovery\/searchactive\?)|(?i:^https:\/\/api\.weibo\.cn\/2\/statuses\/(?:comments_expand_child|container_detail_comment))|(?i:^https:\/\/api\.weibo\.cn\/2\/statuses\/(?:container_detail\?|container_timeline(?:_hot|_topic|_topicpage|_unread)?|repost_timeline|unread_hot_timeline))|(?i:^https:\/\/api\.weibo\.cn\/2\/statuses\/(?:extend|show)\?)|(?i:^https:\/\/api\.weibo\.cn\/2\/video\/(?:full_screen_stream|tiny_stream_mid_detail|tiny_stream_video_list)\?)|(?i:^https:\/\/api\.weibo\.cn\/2\/!\/huati\/discovery_home_bottom_channels\?)|(?i:^https:\/\/api\.weibo\.cn\/2\/direct_messages\/user_list\?)|(?i:^https:\/\/api\.weibo\.cn\/2\/messageflow\/notice\?)|(?i:^https:\/\/api\.weibo\.cn\/2\/search\/(?:container_timeline|finder)\?)|(?i:^https:\/\/api\.weibo\.cn\/2\/searchall\?)
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/026ccd766a53f744c2bf2aad93c4deb6f207defe4daf973178bb3e4193c997fb.js
    body_required: true
    update_interval: 86400
- http_response:
    name: 移除开屏广告 preload
    match: (?i)^https:\/\/bootpreload\.uve\.weibo\.com\/v[12]\/ad\/preload
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/026ccd766a53f744c2bf2aad93c4deb6f207defe4daf973178bb3e4193c997fb.js
    body_required: true
    update_interval: 86400
- http_response:
    name: 移除开屏广告 sdkad
    match: (?i)^https:\/\/sdkapp\.uve\.weibo\.com\/interface\/sdk\/sdkad\.php
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/026ccd766a53f744c2bf2aad93c4deb6f207defe4daf973178bb3e4193c997fb.js
    body_required: true
    update_interval: 86400
- http_response:
    name: 移除开屏广告 wbapplua
    match: (?i)^https:\/\/wbapp\.uve\.weibo\.com\/(?:preload\/get_ad|wbapplua\/wbpullad\.lua)
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/026ccd766a53f744c2bf2aad93c4deb6f207defe4daf973178bb3e4193c997fb.js
    body_required: true
    update_interval: 86400
mitm:
  hostnames:
  - '*.weibo.cn'
  - '*.weibo.com'
  - weibo.com
