name: 快手
description: 移除开屏广告、视频流广告、底栏皮肤、右下角悬浮推广，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/lige47/lige_icon/main/icon/03CNSoft/kuaishou.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/(apissl|az\d-api(-js|-idc)?)\.(gifshow|ksapisrv)\.com\/rest\/system\/startup\?
    filter: '(

      (

      (

      delpaths([["reskinConfig"]])

      ) | (

      delpaths([["sidebarExSquareStyle","moreList"]])

      )

      ) | (

      delpaths([["sidebarExSquareStyle","topList"]])

      )

      ) | (

      .sidebarExSquareStyle.commonlyUsedList |= map(select(.title == "设置" or .title
      == "历史记录" or .title == "草稿箱" or .title == "我的钱包" or .title == "小程序" or .title
      == "未成年人模式" or .title == "官方客服" or .title == "内容偏好" or .title == "离线模式" or .title
      == "稍后再看" or .title == "举报中心" or .title == "挂件"))

      )'
- response_jq:
    match: ^https:\/\/(apissl|az\d-live|az\d-api(-js|-idc)?)\.(gifshow|ksapisrv)\.com\/rest\/n\/live\/feed\/square\/refresh\?
    filter: delpaths([["data","banners"]])
- response_jq:
    match: ^https:\/\/(apissl|az\d-api(-js|-idc)?)\.(gifshow|ksapisrv)\.com\/rest\/n\/feed\/(selection|selectionFast)\?
    filter: if (.feeds | type) == "array" then .feeds |= map(select(.ad | not)) else
      . end
- response_jq:
    match: ^https:\/\/(apissl|az\d-api(-js|-idc)?)\.(gifshow|ksapisrv)\.com\/rest\/n\/user\/profile\/v2\?
    filter: delpaths([["postRecommends"]])
- response_jq:
    match: ^https:\/\/(apissl|az\d-api(-js|-idc)?)\.(gifshow|ksapisrv)\.com\/rest\/im\/wd\/top\/navigation\/getRecommendedSession\?
    filter: delpaths([["data","operationRecommendationList"]])
map_locals:
- match: ^https:\/\/(apissl|az\d-api(-js|-idc)?)\.(gifshow|ksapisrv)\.com\/rest\/n\/nearby\/widget\/info\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/(apissl|az\d-api(-js|-idc)?)\.(gifshow|ksapisrv)\.com\/rest\/n\/taskCenter\/task\/report\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/(apissl|az\d-api(-js|-idc)?)\.(gifshow|ksapisrv)\.com\/rest\/n\/ad\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/(apissl|az\d-api(-js|-idc)?)\.(gifshow|ksapisrv)\.com\/rest\/n\/live\/feed\/info\/simplelive\/card\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - az*-api.ksapisrv.com
  - az4-api-idc.ksapisrv.com
  - az*-api-idc.ksapisrv.com
  - apissl.gifshow.com
  - apissl.ksapisrv.com
  - az*-api-js.gifshow.com
  - az*-live.ksapisrv.com
