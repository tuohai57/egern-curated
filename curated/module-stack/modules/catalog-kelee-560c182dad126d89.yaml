name: 小宇宙
description: 移除开屏广告、搜索框推荐词和AI总结。
author: wish
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/CosmosPodcast.png
map_locals:
- match: (?i:^https:\/\/api\.xiaoyuzhoufm\.com\/v\d\/flash)|(?i:^https:\/\/api\.xiaoyuzhoufm\.com\/v\d\/ai)|(?i:^https:\/\/api\.xiaoyuzhoufm\.com\/v\d\/search\/get)|(?i:^https?:\/\/api\.xiaoyuzhoufm\.com\/v\d\/category)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - api.xiaoyuzhoufm.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api\.xiaoyuzhoufm\.com\/v1\/discovery-feed\/list
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data |= map(select(.type != \"DISCOVERY_HEADER\"\
      \ and .type != \"DISCOVERY_BANNER\")))\n) ]) as $__egern_results\n       | if\
      \ ($__egern_results | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
