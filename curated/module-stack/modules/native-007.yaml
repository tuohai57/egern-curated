name: 小红书
description: 过滤小红书广告，去除水印
author: RuCu6[https://github.com/RuCu6], fmz200[https://github.com/fmz200], meichiny[https://github.com/meichiny],
  可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://loonlab.103516.xyz/Plugin/
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/RedNote.png
open_url: https://apps.apple.com/app/id741292507
tag: 去广告
compat_arguments:
  rednote-feedtime: 'false'
compat_arguments_desc: 'rednote-feedtime: 首页笔记标题前显示时间'
rules:
- domain:
    match: ads-img-al.xhscdn.com
    policy: REJECT
- domain:
    match: ads-img-qc.xhscdn.com
    policy: REJECT
- domain:
    match: ads-video-al.xhscdn.com
    policy: REJECT
- domain:
    match: ads-video-qc.xhscdn.com
    policy: REJECT
- domain:
    match: t-ads.xiaohongshu.com
    policy: REJECT
- and:
    match:
    - protocol:
        match: quic
    - or:
        match:
        - domain_suffix:
            match: xiaohongshu.com
        - domain_suffix:
            match: rnote.com
    policy: REJECT
url_rewrites: []
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/edith\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v1\/search\/banner_list$
    filter: .data = {}
- response_jq:
    match: (?i)^https:\/\/edith\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v1\/search\/hot_list$
    filter: .data.items = []
- response_jq:
    match: (?i)^https:\/\/edith\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v4\/search\/hint
    filter: .data.hint_words = []
- response_jq:
    match: (?i)^https:\/\/edith\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v4\/search\/trending\?
    filter: .data.queries = [] | .data.hint_word = {}
scriptings:
- http_response:
    name: 小红书-响应
    match: (?i)^https:\/\/edith\.(?:xiaohongshu|rnote)\.com\/api\/sns\/(?:v1\/interaction\/comment\/video\/download|v5\/note\/comment\/list|v3\/note\/comment\/sub_comments)
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/318d89bce1117edb26a93b383804e195649ec4674a04efa9e3ddb4ef7f34b498.js
    body_required: true
- http_request:
    name: 小红书 / tiny GIF
    match: (?i)^https?:\/\/ci\.(?:xiaohongshu|rnote)\.com\/system_config\/watermark
    body_required: false
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/424a885351ce40e57339692918c71935232178c4cc8b178b67b37d03b08e2059.js
mitm:
  hostnames:
  - ci.xiaohongshu.com
  - edith.xiaohongshu.com
  - rec.xiaohongshu.com
  - www.xiaohongshu.com
  - so.xiaohongshu.com
  - ci.rnote.com
  - edith.rnote.com
  - rec.rnote.com
  - www.rnote.com
  - so.rnote.com
map_locals:
- match: (?i)^https:\/\/edith\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v1\/surprisebox\/(?:get_style|open|submit_action)
  status_code: 200
  body: '{}'
- match: (?i)^https:\/\/www\.(?:xiaohongshu|rnote)\.com\/api\/marketing\/box\/trigger\?
  status_code: 200
  body: '{}'
- match: (?i)^https:\/\/edith\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/(?:guide\/user_banner|note\/guide)
  status_code: 200
  body: '{}'
- match: (?i)^https:\/\/www\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/(?:ads\/resource|hey\/\w+\/hey_gallery)
  status_code: 200
  body: '{}'
