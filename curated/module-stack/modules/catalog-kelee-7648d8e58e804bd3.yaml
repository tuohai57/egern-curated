name: 一刻相册
description: 移除开屏广告、横幅广告和弹窗推广。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/BaiduPhoto.png
map_locals:
- match: (?i)^https:\/\/pan\.baidu\.com\/act\/api\/conf\?.*conf_key=youa_core_config_ios
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/pan\.baidu\.com\/youai\/material\/v1\/getbynavid\?.*nav_id=1
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - pan.baidu.com
  - mbd.baidu.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/mbd\.baidu\.com\/ccs\/v1\/start\/confsync\?
    filter: (delpaths([["data", "service", "config", "advertisement"], ["data", "service",
      "config", "youa", "pm_config_ad"]]))
