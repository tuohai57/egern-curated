name: 墨迹天气
author: '@ddgksf2013'
mitm:
  hostnames:
  - '*.api.moji.com'
  - tnc*-*.zijieapi.com
body_rewrites:
- response_jq:
    match: ^https?:\/\/.*api\.moji\.com\/json\/entrance\/list
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.entrance_region_res_list |= map(select(.region_name\
      \ | IN(\"工具区\", \"我页面灯泡\", \"banner区\") | not))\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
map_locals:
- match: (?:^https?:\/\/.*api\.moji\.com\/flycard\/flyCard)|(?:^https?:\/\/.*api\.moji\.com\/shortvideo)|(?:^https?:\/\/.*api\.moji\.com\/json\/advertising_goods)|(?:^https?:\/\/.*api\.moji\.com\/forum)|(?:^https?:\/\/.*api\.moji\.com\/user\/dynamic_v\d\/json\/someone_interest)
  status_code: 200
  body: ''
- match: ^https:\/\/tnc.*zijieapi\.com\/get_domains
  status_code: 200
  body: ''
rules:
- domain_suffix:
    match: adlaunch.moji.com
    policy: REJECT
icon: https://raw.githubusercontent.com/lige47/lige_icon/main/icon/05icon/ad.png
