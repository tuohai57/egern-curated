name: 墨迹天气
author: '@ddgksf2013'
mitm:
  hostnames:
  - '*.api.moji.com'
  - tnc*-*.zijieapi.com
body_rewrites:
- response_jq:
    match: ^https?:\/\/.*api\.moji\.com\/json\/entrance\/list
    filter: .entrance_region_res_list |= map(select(.region_name | IN("工具区", "我页面灯泡",
      "banner区") | not))
map_locals:
- match: ^https?:\/\/.*api\.moji\.com\/flycard\/flyCard
  status_code: 200
  body: ''
- match: ^https?:\/\/.*api\.moji\.com\/shortvideo
  status_code: 200
  body: ''
- match: ^https?:\/\/.*api\.moji\.com\/json\/advertising_goods
  status_code: 200
  body: ''
- match: ^https?:\/\/.*api\.moji\.com\/forum
  status_code: 200
  body: ''
- match: ^https?:\/\/.*api\.moji\.com\/user\/dynamic_v\d\/json\/someone_interest
  status_code: 200
  body: ''
- match: ^https:\/\/tnc.*zijieapi\.com\/get_domains
  status_code: 200
  body: ''
rules:
- domain_suffix:
    match: adlaunch.moji.com
    policy: REJECT
icon: https://raw.githubusercontent.com/lige47/lige_icon/main/icon/05icon/ad.png
