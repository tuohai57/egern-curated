name: 迅雷
description: 移除开屏广告、首页横幅广告、左上角广告入口，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/XunLei.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/conf-m-ssl\.xunlei\.com\/external\/
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\ndelpaths([[\"values\",\"me_config\"\
      ,\"entrance_list_vertical_enable\"]])\n) | (\ndelpaths([[\"values\",\"me_config\"\
      ,\"common_service_list\"]])\n)\n) | (\ndelpaths([[\"values\",\"me_config\",\"\
      banner_service_list\"]])\n)\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/api-shoulei-ssl\.xunlei\.com\/flowhub\/v1\/slots:batchGet$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.slots |= map(select(.id == \"xl_ios_mytab_vipicon\"\
      \ or (.native.assets.title.text.value? and (.native.assets.title.text.value\
      \ | . == \"清理助手\" or . == \"云盘容量\" or . == \"远程设备\"))))\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
mitm:
  hostnames:
  - conf-m-ssl.xunlei.com
  - api-shoulei-ssl.xunlei.com
