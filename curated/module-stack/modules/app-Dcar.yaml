name: 懂车帝
description: 广告专用接口内容净化；保留正常视频、车款及账号功能。客户端证书绑定、真实接口响应和已缓存开屏仍需手机验证。
author: tuohai57
homepage: https://github.com/tuohai57/egern-curated
rules:
- domain:
    match: p3-pack.byteimg.com
    policy: REJECT
- domain:
    match: p6-pack.byteimg.com
    policy: REJECT
scriptings:
- http_response:
    name: 懂车帝开屏广告配置
    match: ^https://api\d+-(?:normal|core)(?:-[a-z0-9]+)*\.(?:dcarapi|snssdk)\.com/motor/(?:ad(?:/[^?#]*)?|operation/activity/display/config/V2/?)(?:\?[^#]*)?$
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/dcar-ad-cleaner.js
    body_required: true
    max_size: 4194304
    timeout: 10
    update_interval: 86400
mitm:
  hostnames:
  - api5-normal-lq.dcarapi.com
icon: https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/6e/2a/81/6e2a81b3-80bd-1d66-91bf-f1e02af10a29/DCDAppIcon-0-0-1x_U007epad-0-1-0-85-220.png/512x512bb.jpg
