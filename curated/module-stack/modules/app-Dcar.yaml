name: 懂车帝（自用维护·重写）
description: 原生 Egern 响应净化：开屏素材与倒计时、信息流中明确标记的广告；保留普通视频与车款。
author: tuohai57
homepage: https://github.com/tuohai57/egern-curated
rules:
- domain:
    match: p3-pack.byteimg.com
    policy: REJECT
- domain:
    match: p6-pack.byteimg.com
    policy: REJECT
scriptings:
- http_response:
    name: 懂车帝 · 开屏与信息流广告
    match: ^https://api5-normal-lq\.dcarapi\.com/motor/(?:ad(?:/[^?#]*)?|operation/activity/display/config/V2/?|stream_entrance/get_feed/?)(?:\?[^#]*)?$
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/dcar-native.js
    body_required: true
    max_size: 4194304
    timeout: 10
    update_interval: 86400
mitm:
  hostnames:
  - api5-normal-lq.dcarapi.com
icon: https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/6e/2a/81/6e2a81b3-80bd-1d66-91bf-f1e02af10a29/DCDAppIcon-0-0-1x_U007epad-0-1-0-85-220.png/512x512bb.jpg
