name: 推栏
description: 过滤推栏广告
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Daily.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https?:\/\/m\.pvp\.xoyo\.com\/conf\/server-mapping$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\ndelpaths([[\"data\",\"splashConf\"\
      ]])\n) | (\ndelpaths([[\"data\",\"splashConfNew\"]])\n)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
mitm:
  hostnames:
  - m.pvp.xoyo.com
