name: 拼多多
description: 移除开屏广告、底栏多多视频、会场入口、聊天页面精选推荐及推广，精简首页和个人中心。
author: ZenmoFeiShi[https://github.com/ZenmoFeiShi], 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/PinDuoDuo.png
rules:
- and:
    match:
    - url_regex:
        match: ^http:\/\/((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\/d(\d)?
    - user_agent:
        match: '*com.xunmeng.pinduoduo*'
    policy: REJECT
- and:
    match:
    - url_regex:
        match: ^http:\/\/\[[0-9a-fA-F:]+\]\/d(\d)?\?
    - user_agent:
        match: '*com.xunmeng.pinduoduo*'
    policy: REJECT
- and:
    match:
    - domain:
        match: api.pinduoduo.com
    - protocol:
        match: quic
    policy: REJECT
- domain:
    match: titan.pinduoduo.com
    policy: REJECT
- domain:
    match: xg.pinduoduo.com
    policy: REJECT
- domain:
    match: cdl-1.pddpic.com
    policy: REJECT
- domain:
    match: titan.pinduoduo.com
    policy: REJECT
- domain:
    match: cdl-p2.pddpic.com
    policy: REJECT
- domain:
    match: cd-1.pddpic.com
    policy: REJECT
- domain:
    match: apm.pinduoduo.com
    policy: REJECT
- domain:
    match: th-b.pinduoduo.com
    policy: REJECT
- domain:
    match: ta.pinduoduo.com
    policy: REJECT
- domain:
    match: th.pinduoduo.com
    policy: REJECT
- domain:
    match: th-a.pinduoduo.com
    policy: REJECT
- domain:
    match: ta-a.pinduoduo.com
    policy: REJECT
- domain:
    match: meta.pinduoduo.com
    policy: REJECT
- domain:
    match: apm-a.pinduoduo.com
    policy: REJECT
map_locals:
- match: (?i:^https:\/\/api\.pinduoduo\.com\/api\/aristotle\/unrated_order_for_unreceived_tab\?)|(?i:^https:\/\/api\.pinduoduo\.com\/api\/aristotle\/query_order_list_tabs_element\?)|(?i:^https:\/\/api\.pinduoduo\.com\/api\/aquarius\/hungary\/global\/homepage\?)|(?i:^https:\/\/api\.pinduoduo\.com\/api\/caterham\/v3\/query\/order_express_group\?)|(?i:^https:\/\/api\.pinduoduo\.com\/search_hotquery\?)|(?i:^https:\/\/api\.pinduoduo\.com\/api\/zaire_biz\/chat\/resource\/get_list_data\?)|(?i:^https:\/\/api\.pinduoduo\.com\/api\/caterham\/v3\/query\/new_chat_group\?)|(?i:^https:\/\/api\.pinduoduo\.com\/api\/alexa\/goods\/back_up\?)|(?i:^https:\/\/api\.pinduoduo\.com\/api\/caterham\/v3\/query\/personal\?)|(?i:^https:\/\/api\.pinduoduo\.com\/api\/brand-olay\/goods_detail\/bybt_guide\?)|(?i:^https:\/\/api\.pinduoduo\.com\/api\/engels\/reviews\/require\/append\?)|(?i:^https:\/\/api\.pinduoduo\.com\/api\/caterham\/v3\/query\/my_order_group\?)|(?i:^https:\/\/api\.pinduoduo\.com\/api\/caterham\/v3\/query\/likes\?)|(?i:^https:\/\/api\.pinduoduo\.com\/api\/phantom\/gbdbpdv\/extra\?)|(?i:^https:\/\/api\.pinduoduo\.com\/api\/manufacturer\/cross\/shortcut\/list\?)|(?i:^https:\/\/api\.pinduoduo\.com\/api\/dunkirk\/liveactivity\/push\/create\/url\/report\?)|(?i:^https:\/\/api\.pinduoduo\.com\/api\/growth\/nagato\/app\/index\/gather\?)|(?i:^https:\/\/api\.pinduoduo\.com\/api\/engels\/wait\/receive\/review\?)|(?i:^https:\/\/api\.pinduoduo\.com\/api\/buffon\/nasus\/recommend\?)|(?i:^https:\/\/api\.pinduoduo\.com\/api\/caterham\/v2\/query\/goods_detail_with_tags\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
scriptings:
- http_response:
    name: 移除扫码取件页面商品推荐及弹窗
    match: (?i)^https:\/\/m\.pinduoduo\.net\/mdkd\/package\?from_app_scan
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/63af2e44da24da11f5c1bc930aefdcef2ce16aa65293be3e80ba8520d46e9c58.js
    body_required: true
    update_interval: 86400
mitm:
  hostnames:
  - api.pinduoduo.com
  - m.pinduoduo.net
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/api\/alexa\/homepage\/hub\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"result\", \"dy_module\"\
      , \"irregular_banner_dy\"], [\"result\", \"icon_set\"], [\"result\", \"search_bar_hot_query\"\
      ], [\"result\", \"dy_module\", \"irregular_banner_dy\"]])) | (.result.bottom_tabs?\
      \ |= map(select(.link | IN(\"index.html\", \"chat_list.html\", \"personal.html\"\
      ))) | .result.buffer_bottom_tabs? |= map(select(.link | IN(\"index.html\", \"\
      chat_list.html\", \"personal.html\"))) | .result.all_top_opts |= map(del(.selected_image,\
      \ .image, .height, .width)))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/search\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"expansion\"]]))\n) ])\
      \ as $__egern_results\n       | if ($__egern_results | length) == 1\n      \
      \   then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/api\/philo\/personal\/hub\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"monthly_card_entrance\"\
      ], [\"personal_center_style_v2_vo\"], [\"icon_set\", \"icons\"], [\"icon_set\"\
      , \"top_personal_icons\"], [\"personal_banner\"]]))\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/api\/oak\/integration\/render\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"bottom_section_list\"\
      ], [\"ui\", \"bottom_section\"], [\"ui\", \"live_section\", \"float_info\"]]))\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/api\/caterham\/v3\/query\/order_detail_group\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"goods_list\"\
      ]]))\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/order\/
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"marketing_banner_vo\"\
      ], [\"shipping\", \"banner_above_recommend\"]]))\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/api\/aristotle\/order_list_v4\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.orders |= map(.order_buttons |=\
      \ map(del(.order_growth_tip))))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
