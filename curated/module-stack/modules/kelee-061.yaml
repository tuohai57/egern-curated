scriptings:
- http_response:
    name: 移除扫码取件页面商品推荐及弹窗
    match: (?i)^https:\/\/m\.pinduoduo\.net\/mdkd\/package\?from_app_scan
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/63af2e44da24da11f5c1bc930aefdcef2ce16aa65293be3e80ba8520d46e9c58.js
    body_required: true
    update_interval: 86400
mitm:
  hostnames:
  - api.pinduoduo.com
  - m.pinduoduo.net
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/api\/alexa\/homepage\/hub\?
    filter: (delpaths([["result", "dy_module", "irregular_banner_dy"], ["result",
      "icon_set"], ["result", "search_bar_hot_query"], ["result", "dy_module", "irregular_banner_dy"]]))
      | (.result.bottom_tabs? |= map(select(.link | IN("index.html", "chat_list.html",
      "personal.html"))) | .result.buffer_bottom_tabs? |= map(select(.link | IN("index.html",
      "chat_list.html", "personal.html"))) | .result.all_top_opts |= map(del(.selected_image,
      .image, .height, .width)))
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/search\?
    filter: (delpaths([["expansion"]]))
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/api\/philo\/personal\/hub\?
    filter: (delpaths([["monthly_card_entrance"], ["personal_center_style_v2_vo"],
      ["icon_set", "icons"], ["icon_set", "top_personal_icons"], ["personal_banner"]]))
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/api\/oak\/integration\/render\?
    filter: (delpaths([["bottom_section_list"], ["ui", "bottom_section"], ["ui", "live_section",
      "float_info"]]))
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/api\/caterham\/v3\/query\/order_detail_group\?
    filter: (delpaths([["data", "goods_list"]]))
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/order\/
    filter: (delpaths([["marketing_banner_vo"], ["shipping", "banner_above_recommend"]]))
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/api\/aristotle\/order_list_v4\?
    filter: (.orders |= map(.order_buttons |= map(del(.order_growth_tip))))
