name: OnTheWay
description: 移除弹窗广告、发现页面横幅推广的推广金刚位，移除我的页面横幅推广。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/OnTheWay.png
map_locals:
- match: (?i)^https:\/\/www\.imxingzhe\.com\/api\/v1\/pop\/window\/\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - www.imxingzhe.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/www\.imxingzhe\.com\/api\/v4\/account\/get_user_info\?
    filter: (delpaths([["banner"]]))
- response_jq:
    match: (?i)^https:\/\/www\.imxingzhe\.com\/api\/v4\/discovery\/ios\/\?
    filter: (delpaths([["banners"], ["ad"]])) | (.display_areas |= map(select(.name
      == "赛事" or .name == "行者帮" or .name == "头条" or .name == "排行榜" or .name == "约伴")))
