name: 微博国际版
description: 移除开屏广告、时间线广告及评论区广告，移除发现页面横幅推广、最常访问、主页访客及热门视频，移除搜索填充词。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Weibo_intl.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/weibointl\.api\.weibo\.cn\/portal\.php\?a=trends
    filter: '(

      (

      (

      (

      delpaths([["data","banner"]])

      ) | (

      delpaths([["data","user_footprint"]])

      )

      ) | (

      delpaths([["data","profile_accessrecord"]])

      )

      ) | (

      delpaths([["data","native_content"]])

      )

      ) | (

      .data.discover |= map(select(.schema != "尊享会员"))

      )'
- response_jq:
    match: ^https:\/\/api\.weibo\.cn\/2\/statuses\/friends\/timeline$
    filter: '(

      (

      (

      delpaths([["advertises"]])

      ) | (

      delpaths([["ad"]])

      )

      ) | (

      delpaths([["ad_version_2_weibo"]])

      )

      ) | (

      .statuses|=map(select(.ad_marked!=true))

      )'
- response_jq:
    match: ^https:\/\/api\.weibo\.cn\/2\/statuses\/unread_hot_timeline$
    filter: '(

      (

      delpaths([["ad"]])

      ) | (

      delpaths([["ad_version_2_weibo"]])

      )

      ) | (

      .statuses|=map(select(.ad_marked!=true))

      )'
- response_jq:
    match: ^https:\/\/api\.weibo\.cn\/2\/comments\/build_comments\?
    filter: .datas[].data.ad_from_comment? = true
- response_jq:
    match: ^https:\/\/api\.weibo\.cn\/2\/cardlist\?aid=
    filter: .cards |= map(select((.mblog?|(.ad_marked?|type=="boolean")and.ad_marked==true)or(.card_group?|type=="array"and
      any(.[]?;.mblog?|(.ad_marked?|type=="boolean")and.ad_marked==true))|not))
map_locals:
- match: ^https:\/\/bootpreload\.uve\.weibo\.com\/v1\/ad\/preload$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/api\.weibo\.cn\/2\/cardlist\?v_f=2
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/api\.weibo\.cn\/2\/ad\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/weibointl\.api\.weibo\.cn\/portal\.php\?a=get_searching_info
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - bootpreload.uve.weibo.com
  - weibointl.api.weibo.cn
  - api.weibo.cn
