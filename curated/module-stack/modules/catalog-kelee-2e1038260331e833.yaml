name: WakeUp课程表
description: 移除横幅广告、弹窗广告，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/WakeupSchedule.png
map_locals:
- match: (?i)^https:\/\/api\.wakeup\.fun\/wakeup\/app\/bannerconf$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - api.wakeup.fun
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api\.wakeup\.fun\/wakeup\/user\/mine$
    filter: (delpaths([["data", "bannerItems"]]))
