name: 起点读书去广告
description: 移除起点读书开屏广告、每日导读、各类弹窗、文末广告、搜索填充词，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/QiDian.png
open_url: https://apps.apple.com/app/id534174796
tag: 去广告
url_rewrites: []
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/client\/getconf$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n.Data.WolfEye = 0 | .Data.CloudSetting.TeenShowFreq\
      \ = 0\n) | (\ndel(.Data.ActivityPageBackPushNoticeFrequency, .Data.ActivityIcon,\
      \ .Data.ActivityPopup, .Data.LuckBag)\n)\n) ]) as $__egern_results\n       |\
      \ if ($__egern_results | length) == 1\n         then $__egern_results[0] else\
      \ $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v2\/dailyrecommend\/getdailyrecommend\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.Data.Items = \"[]\"\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v3\/user\/getaccountpage\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.Data.BenefitButtonList)\n) ])\
      \ as $__egern_results\n       | if ($__egern_results | length) == 1\n      \
      \   then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
mitm:
  hostnames:
  - magev6.if.qidian.com
  - ywab.reader.qq.com
map_locals:
- match: (?i:^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v4\/client\/getsplashscreen\?)|(?i:^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/adv\/)
  status_code: 200
  body: '{}'
- match: (?i)^https:\/\/ywab\.reader\.qq\.com\/user\/experiments\/v2\?
  status_code: 200
  body: '{}'
- match: (?i:^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/checkin\/simpleinfo\?)|(?i:^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/push\/getdialog\?)|(?i:^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/message\/getpushedmessagelist$)|(?i:^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/maintain\/playstrip$)|(?i:^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/dailyrecommend\/recommendBook\?)|(?i:^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/freshman\/bookshelfbtn$)|(?i:^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/bookshelf\/getTopOperation$)|(?i:^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/booksearch\/hotWords\?)|(?i:^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/followsubscribe\/showChapterEndModule\?)|(?i:^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/young\/getconf$)
  status_code: 200
  body: '{}'
