body_rewrites:
- response_jq:
    match: (?i)^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/client\/getconf$
    filter: (.Data.WolfEye = 0 | .Data.CloudSetting.TeenShowFreq = 0) | (del(.Data.ActivityPageBackPushNoticeFrequency,
