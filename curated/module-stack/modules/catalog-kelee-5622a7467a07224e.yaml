name: 叮咚买菜
description: 移除开屏广告、弹窗推广、搜索推荐、信息流广告、悬浮广告、各页面购物推荐、精简我的页面，移除底栏和各页面AI入口。
author: zirawell[https://github.com/zirawell], 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md],
  wish
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/DingdongMaicai.png
rules:
- domain:
    match: trackercollect.ddxq.mobi
    policy: REJECT
- domain:
    match: ddfs-public.ddimg.mobi
    policy: REJECT
- domain:
    match: rttrack.ddxq.mobi
    policy: REJECT
map_locals:
- match: (?i)^https?:\/\/119\.29\.29\.\d+\/d
  status_code: 200
  body: ''
  headers:
    Content-Type: text/plain; charset=utf-8
- match: (?i:^https?:\/\/maicai\.api\.ddxq\.mobi\/advert\/)|(?i:^https?:\/\/maicai\.api\.ddxq\.mobi\/homeApi\/getHomeAdPop)
  status_code: 404
  body: ''
  headers:
    Content-Type: text/plain; charset=utf-8
- match: (?i:^https:\/\/maicai\.api\.ddxq\.mobi\/vip\/getVipAd\/\?)|(?i:^https:\/\/maicai\.api\.ddxq\.mobi\/homeApi\/marketingNotice\?)|(?i:^https:\/\/maicai\.api\.ddxq\.mobi\/search\/rollHotKeyword\?)|(?i:^https:\/\/maicai\.api\.ddxq\.mobi\/search\/rankingList\?)|(?i:^https:\/\/maicai\.api\.ddxq\.mobi\/search\/hotKeyword\?)|(?i:^https:\/\/maicai\.api\.ddxq\.mobi\/order\/getRecommend$)|(?i:^https:\/\/maicai\.api\.ddxq\.mobi\/homeApi\/userLike\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/user\.api\.ddxq\.mobi\/userportal-service\/api\/v1\/user\/queryMyPage\/\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/maicai\.api\.ddxq\.mobi\/guide-service\/userLike\/flowData$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - 119.29.29.*
  - maicai.api.ddxq.mobi
  - user.api.ddxq.mobi
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/maicai\.api\.ddxq\.mobi\/homeApi\/categoriesNewDetail\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"ad_info\"\
      ]]))\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/maicai\.api\.ddxq\.mobi\/tool\/getConfig\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"ai_enter_config\"\
      ]]))\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: (?i)^https?:\/\/maicai\.api\.ddxq\.mobi\/homeApi\/newDetails\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"top_advert_data\"\
      ], [\"data\", \"suspension\"]])) | (.data.list |= map(select(has(\"capsule_freedom_zone\"\
      ) | not)))\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/maicai\.api\.ddxq\.mobi\/guide-service\/productApi\/productDetail\/info\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"detail\",\
      \ \"chatEntry\"]]))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https?:\/\/maicai\.api\.ddxq\.mobi\/homeApi\/bottomNavi
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(del(.data.adId?) | if (.data.bottom_list?\
      \ | length > 0) then .data.bottom_list |= map(select(.type != \"eatwhat\"))\
      \ else . end)\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
- response_jq:
    match: (?i)^https?:\/\/maicai\.api\.ddxq\.mobi\/homeApi\/homeFlowDetail
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(walk(if type == \"object\" and has(\"\
      list\") then .list |= map(if type == \"object\" and has(\"multi_advertise_data_list\"\
      ) then del(.multi_advertise_data_list) else . end) else . end))\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
