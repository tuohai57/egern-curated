name: 优酷
description: 移除开屏广告、视频广告、信息流广告。其余广告由于请求已加密，故无法移除。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md], RuCu6[https://github.com/RuCu6]
icon: https://raw.githubusercontent.com/lige47/lige_icon/main/icon/03CNSoft/youkushipin.png
homepage: https://hub.kelee.one
rules:
- domain:
    match: push.m.youku.com
    policy: DIRECT
- domain:
    match: un-acs.youku.com
    policy: DIRECT
- domain:
    match: dorangesource.alicdn.com
    policy: DIRECT
- domain:
    match: h-adashx.ut.taobao.com
    policy: REJECT
- domain:
    match: adx-core.youku.com
    policy: REJECT
- domain:
    match: adx-open-service.youku.com
    policy: REJECT
- domain:
    match: yk-ssp.ad.youku.com
    policy: REJECT
- domain:
    match: cad.youku.com
    policy: REJECT
- domain:
    match: ykad-data.youku.com
    policy: REJECT
- domain:
    match: yk-ssp.ad.youku.com
    policy: REJECT
- domain:
    match: amdc.m.youku.com
    policy: REJECT
- domain:
    match: cad.youku.com
    policy: REJECT
- domain:
    match: nbsdk-baichuan.alicdn.com
    policy: REJECT
- domain:
    match: youku-crm-product.youku.com
    policy: REJECT
- domain:
    match: dr-danmu.youku.com
    policy: REJECT
- domain:
