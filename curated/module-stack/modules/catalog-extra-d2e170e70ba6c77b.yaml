name: 爱企查
description: 移除开屏广告、应用内弹窗、首页轮播图、悬浮部件、信息流和搜索填充词。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Aiinquiry.png
homepage: https://hub.kelee.one
rules:
- url_regex:
    match: ^https:\/\/aiqicha\.baidu\.com\/app\/commonstatusAjax
    policy: REJECT
map_locals:
- match: (?:^https:\/\/aiqicha\.baidu\.com\/app\/bannerPicAjax)|(?:^https:\/\/aiqicha\.baidu\.com\/app\/getPopConfigAjax)|(?:^https:\/\/aiqicha\.baidu\.com\/app\/getHotTopicAjax)|(?:^https:\/\/aiqicha\.baidu\.com\/app\/getNewsReportAjax)|(?:^https:\/\/aiqicha\.baidu\.com\/app\/getExpertVideoAjax)|(?:^https:\/\/aiqicha\.baidu\.com\/apps\/getHotRecommendV2Ajax)|(?:^https:\/\/aiqicha\.baidu\.com\/m\/getLoginWordsAjax)|(?:^https:\/\/aiqicha\.baidu\.com\/app\/getAppPopSettingAjax)|(?:^https:\/\/aiqicha\.baidu\.com\/apps\/getHomeMonitorDataAjax)|(?:^https:\/\/aiqicha\.baidu\.com\/apps\/searchRecommendAjax)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - aiqicha.baidu.com
