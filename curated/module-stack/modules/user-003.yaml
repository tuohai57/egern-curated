name: 转转
author: '@ddgksf2013'
mitm:
  hostnames:
  - app.zhuanzhuan.com
  - lego.zhuanzhuan.com
  - lego-tech.zhuanzhuan.com
  - sentry.zhuanzhuan.com
  - wkdcm1.tingyun.com
  - wkrt.tingyun.com
body_rewrites:
- response_jq:
    match: ^https:\/\/app\.zhuanzhuan\.com\/zz\/v\d\/zzlogic\/getOpenScreen
    filter: .respData=null
- response_jq:
    match: ^https:\/\/app\.zhuanzhuan\.com\/zzopen\/popwindow\/getallpopwin
    filter: .respData.popWindow=null | .respData.bottomFloat=null | .respData.bubbleGuide=null
      | .respData.topOperation=null | .respData.topOperationIsOther=false
- response_jq:
    match: ^https:\/\/app\.zhuanzhuan\.com\/api\/zzlogic\/cbchomepage
    filter: .respData.topActBanner=null | .respData.leftPendant={} | .respData.operationCardArea=null
      | .respData.horizontalCard=null | .respData.newUserArea=null | .respData.redInfoBanner=null
- response_jq:
    match: ^https:\/\/app\.zhuanzhuan\.com\/zzopen\/zzbmlogic\/queryFrontPageWindowInfo
    filter: .respData.bannerInfo.data=[] | .respData.popupInfo={} | .respData.operatingInfo=[]
      | .respData.rightBanner=null | .respData.topAtmosphereV2.carouselList=[]
- response_jq:
    match: ^https:\/\/app\.zhuanzhuan\.com\/zz\/v\d\/zzinfoshow\/getfeedflowinfo
    filter: .respData.infoData=((.respData.infoData // []) | map(select(.type!=29)))
- response_jq:
    match: ^https:\/\/app\.zhuanzhuan\.com\/api\/ptlogic\/getnewcomerzoneentry
    filter: .respData=null
- response_jq:
    match: ^https:\/\/app\.zhuanzhuan\.com\/zzopen\/zzbmlogic\/getSearchHomePageConfig
    filter: .respData.searchWords=[] | .respData.hotBrands=[] | .respData.hotSearch=[]
      | .respData.hotOrder=[]
- response_jq:
    match: ^https:\/\/app\.zhuanzhuan\.com\/zz\/transfer\/getsearchword
    filter: .respData.recommendword.data=[]
- response_jq:
    match: ^https:\/\/app\.zhuanzhuan\.com\/zz\/transfer\/getsearchconfigdata
    filter: .respData.goods=[] | .respData.officialCheckMindWordConfig={}
- response_jq:
    match: ^https:\/\/app\.zhuanzhuan\.com\/api\/zzlogic\/getShowCaseWords
    filter: .respData.showCaseData=[]
- response_jq:
    match: ^https:\/\/app\.zhuanzhuan\.com\/zzx\/transfer\/getConfigInfo
    filter: .respData.zzReport={} | .respData.questionnairePop=[]
- response_jq:
    match: ^https:\/\/app\.zhuanzhuan\.com\/zzopen\/ptuserlogic\/getmymien
    filter: .respData.bmNewInfo=null | .respData.activityField=null | .respData.miniActivityField=null
      | .respData.memberCenter=null | .respData.displayChoiceGoodsFeed=0 | .respData.walletArea.cardItems=((.respData.walletArea.cardItems
      // []) | map(select(.tokenId=="balance"))) | .respData.toolbarArea=((.respData.toolbarArea
      // []) | map(select(.tokenId!="3cInvest" and .tokenId!="quzuji" and .tokenId!="financial"
      and .tokenId!="fenqishagncheng" and .tokenId!="dianyuanzhaomu" and .tokenId!="offlStore"
      and .tokenId!="equity")))
- response_jq:
    match: ^https:\/\/app\.zhuanzhuan\.com\/zz\/v\d\/zzusercenter\/myprofilevariouscardsv2
    filter: .respData.cardList=[]
- response_jq:
    match: ^https:\/\/app\.zhuanzhuan\.com\/zz\/v\d\/zzinfoshow\/getchoicegoodsinfos
    filter: .respData.infoData=[]
- response_jq:
    match: ^https:\/\/app\.zhuanzhuan\.com\/zz\/v\d\/corecyclelogic\/getredpointconfig
    filter: .respData.showFlag=0 | .respData.picture=""
- response_jq:
    match: ^https:\/\/app\.zhuanzhuan\.com\/zz\/v\d\/zzlogic\/tabredpoint
    filter: .respData={}
map_locals:
- match: ^https:\/\/app\.zhuanzhuan\.com\/zz\/v\d\/zzlogic\/(?:reportdautracking|reportVariousData|reportPushChannelStatus|reporttabclick)
  status_code: 200
  body: '{}'
- match: ^https:\/\/lego\.zhuanzhuan\.com\/(?:v1\/coke|page\/mark)
  status_code: 200
  body: '{}'
- match: ^https:\/\/lego-tech\.zhuanzhuan\.com\/(?:v1\/coke-tech|page\/mark-p-tech)
  status_code: 200
  body: '{}'
- match: ^https:\/\/sentry\.zhuanzhuan\.com\/api\/\d+\/envelope\/
  status_code: 200
  body: '{}'
- match: ^https:\/\/wkdcm1\.tingyun\.com\/(?:initMobileApp|getTaskDefs|reportSpanData)
  status_code: 200
  body: '{}'
- match: ^https:\/\/wkrt\.tingyun\.com\/getMobileRedirectHost
  status_code: 200
  body: '{}'
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/ZhuanZhuan.png
