name: 丰巢
description: 移除弹窗，精简首页和生活服务。此插件需要IPA签名方可使用，App Store用户请勿使用此插件，务必点击下方主页链接查看详细教程。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/FC_Box.png
homepage: https://getupnote.com/share/notes/zSn1ShBmzNYISKcTgjXE5oHMrNf2/34bf3aad-7872-497d-b239-198e27e8c84c
body_rewrites:
- response_jq:
    match: ^https:\/\/consumer\.fcbox\.com\/v1\/dynamicConfig\/findTabbarConfig\/mainPage$
    filter: '(

      (

      delpaths([["data","lifeService"]])

      ) | (

      delpaths([["data","mall"]])

      )

      ) | (

      delpaths([["data","wash"]])

      )'
map_locals:
- match: ^https:\/\/consumer\.fcbox\.com\/fcboxactivityweb\/api\/v\d\/clientPage\/modulesAggregated\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/consumer\.fcbox\.com\/fcboxactivityweb\/api\/v\d\/clientPage\/jinGangFirst\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/consumer\.fcbox\.com\/v2\/home\/mallInfo$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/dsp\.fcbox\.com\/adSearch\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/consumer\.fcbox\.com\/hs-portal\/app\/config\/page\/home\/v2\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/consumer\.fcbox\.com\/post\/suggestion\/query$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/consumer\.fcbox\.com\/fcboxactivityweb\/marketingEntrance\/retentionPopup$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/consumer\.fcbox\.com\/fcboxactivityweb\/api\/clientPopup\/v\d\/queryPopupWithPriority$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/consumer\.fcbox\.com\/fcboxactivityweb\/api\/guidePopup\/popup$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - consumer.fcbox.com
  - dsp.fcbox.com
