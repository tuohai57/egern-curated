name: 丰巢
description: 移除弹窗，精简首页和生活服务。此插件需要IPA签名方可使用，App Store用户请勿使用此插件，务必点击下方主页链接查看详细教程。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/FC_Box.png
homepage: https://getupnote.com/share/notes/zSn1ShBmzNYISKcTgjXE5oHMrNf2/34bf3aad-7872-497d-b239-198e27e8c84c
body_rewrites:
- response_jq:
    match: ^https:\/\/consumer\.fcbox\.com\/v1\/dynamicConfig\/findTabbarConfig\/mainPage$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\ndelpaths([[\"data\",\"lifeService\"\
      ]])\n) | (\ndelpaths([[\"data\",\"mall\"]])\n)\n) | (\ndelpaths([[\"data\",\"\
      wash\"]])\n)\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
map_locals:
- match: (?:^https:\/\/consumer\.fcbox\.com\/fcboxactivityweb\/api\/v\d\/clientPage\/modulesAggregated\?)|(?:^https:\/\/consumer\.fcbox\.com\/fcboxactivityweb\/api\/v\d\/clientPage\/jinGangFirst\?)|(?:^https:\/\/consumer\.fcbox\.com\/v2\/home\/mallInfo$)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/dsp\.fcbox\.com\/adSearch\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: (?:^https:\/\/consumer\.fcbox\.com\/hs-portal\/app\/config\/page\/home\/v2\?)|(?:^https:\/\/consumer\.fcbox\.com\/post\/suggestion\/query$)|(?:^https:\/\/consumer\.fcbox\.com\/fcboxactivityweb\/marketingEntrance\/retentionPopup$)|(?:^https:\/\/consumer\.fcbox\.com\/fcboxactivityweb\/api\/clientPopup\/v\d\/queryPopupWithPriority$)|(?:^https:\/\/consumer\.fcbox\.com\/fcboxactivityweb\/api\/guidePopup\/popup$)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - consumer.fcbox.com
  - dsp.fcbox.com
