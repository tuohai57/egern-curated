name: ECOVACS HOME
description: 移除横幅推广，精简底栏。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/EcovacsHome.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/gl-cn-api\.ecovacs\.cn\/v3\/private\/
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.navigateInfoResponseList |=\
      \ map(select(.positionType == \"Robot\" or .positionType == \"Mine\"))\n) ])\
      \ as $__egern_results\n       | if ($__egern_results | length) == 1\n      \
      \   then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
map_locals:
- match: ^https:\/\/api-app\.dc-cn\.cn\.ecouser\.net\/api\/ecms\/app\/ad\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/gl-cn-api\.ecovacs\.cn\/v1\/private\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - gl-cn-api.ecovacs.cn
  - api-app.dc-cn.cn.ecouser.net
