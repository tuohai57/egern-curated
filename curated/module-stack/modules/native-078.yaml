icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/TikTok.png
open_url: https://apps.apple.com/app/id1142110895
tag: 去广告
rules:
- and:
    match:
    - ip_cidr:
        match: 101.126.58.201/32
    - dest_port:
        match: '6443'
    policy: REJECT
- and:
    match:
    - ip_cidr:
        match: 110.249.199.75/32
    - dest_port:
        match: '6443'
    policy: REJECT
- and:
    match:
    - ip_cidr:
        match: 111.225.147.191/32
    - dest_port:
        match: '6443'
    policy: REJECT
- and:
    match:
    - ip_cidr:
        match: 111.63.61.101/32
    - dest_port:
        match: '6443'
    policy: REJECT
- and:
    match:
    - ip_cidr:
        match: 220.243.141.0/32
    - dest_port:
        match: '6443'
    policy: REJECT
- and:
    match:
    - or:
        match:
        - domain_suffix:
            match: bytegecko.com
        - domain_suffix:
            match: byteeffecttos.com
    - domain_keyword:
        match: ncdn
    policy: REJECT
- url_regex:
    match: (?i)^https:\/\/api5-normal-lq\.amemv\.com\/api\/ad\/
    policy: REJECT
- url_regex:
    match: (?i)^https:\/\/(aweme\.snssdk\.com|api5-normal-m\.amemv\.com)\/api\/ad\/
    policy: REJECT
- url_regex:
    match: (?i)^https:\/\/zlink\.ugsdk\.cn\/ad\/
    policy: REJECT
url_rewrites: []
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/((aweme\.snssdk\.com|api5-normal-m\.amemv\.com)|api5-normal-m\.amemv\.com)\/aweme\/homepage\/sidebar_data\/\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.data_map.recently_apps, .data_map.recently_users)\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/(aweme\.snssdk\.com|api5-normal-m\.amemv\.com)\/aweme\/homepage\/render\/\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\ndel(.data.tab_config)\n) | (\n\
      .data.tab_list[]? |= (if .extra.side_bar.modules != null then .extra.side_bar.modules[]?.items[]?\
      \ |= (if .data.first_page_module?.module_title == \"常用功能\" then .data={} else\
      \ . end) else . end) | .data.tab_list |= map(if .extra.tab_list != null then\
      \ .extra.tab_list |= map(select(.tab_id | IN(\"homepage_tablive\", \"homepage_follow\"\
      , \"homepage_hot_container\"))) else . end) | .data.tab_list |= map(select(.extra.tab_list\
      \ != null and (.extra.tab_list | length > 0)))\n)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/(aweme\.snssdk\.com|api5-normal-m\.amemv\.com)\/tfe\/api\/request_combine\/v1\/\?need_personal_recommend
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data[\"/service/settings/v3/\"].body.data.settings.homepage_two_session_tab_skin_2025\
      \ = false | .data[\"/service/settings/v3/\"].body.data.settings.homepage_tab_skin_enable\
      \ = false\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
mitm:
  hostnames:
  - aweme.snssdk.com
  - api5-normal-m.amemv.com
