name: 小黑盒
description: 移除开屏广告和热点板块信息流广告
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/XiaoHeiHe.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/api\.xiaoheihe\.cn\/bbs\/app\/feeds\/news
    filter: .result.links |= map(if .content_type == 27 then del(.title, .ad_pm, .img_gif,
      .idea_id, .ad_report, .label, .source, .intranet_only, .ad_cm, .content_type,
      .PROTOCOL, .img, .ad_ratio) else . end)
map_locals:
- match: ^https:\/\/api\.xiaoheihe\.cn\/account\/get_ads_info_v2
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - api.xiaoheihe.cn
