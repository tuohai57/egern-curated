name: 铁路12306
description: 过滤12306应用内广告及开屏广告
author: RuCu6[https://github.com/RuCu6], 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/12306.png
rules:
- domain:
    match: ad.12306.cn
    policy: DIRECT
scriptings:
- http_request:
    name: 移除12306应用内广告
    match: (?i)^https:\/\/mobile\.12306\.cn\/otsmobile\/app\/mgs\/mgw\.htm$
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/22a825d8149d952dd9c6c1c5c96fa3f830a0ebba975f8fc402f55ad1f40d4a8a.js
    body_required: false
    update_interval: 86400
mitm:
  hostnames:
  - ad.12306.cn
  - mobile.12306.cn
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/ad\.12306\.cn\/ad\/ser\/getAdList$
    filter: (delpaths([["materialsList"], ["advertParam"]]))
