name: 波点音乐
description: 精简应用配置，禁用P2P传输。移除开屏广告、横幅推广、悬浮广告、歌曲广告、商城入口、搜索推广、评论区推广、试听语音提醒。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/BodianMusic.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/bd-api\.kuwo\.cn\/api\/service\/conf\/all\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\n(\n(\n(\n(\n(\ndelpaths([[\"\
      data\",\"groupSign\",\"adStartAppDialog\"]])\n) | (\ndelpaths([[\"data\",\"\
      groupSign\",\"adGuideTest\"]])\n)\n) | (\ndelpaths([[\"data\",\"groupSign\"\
      ,\"playTips\"]])\n)\n) | (\ndelpaths([[\"data\",\"groupSign\",\"adExitChange\"\
      ]])\n)\n) | (\ndelpaths([[\"data\",\"conf\",\"adGuidePopCount\"]])\n)\n) | (\n\
      delpaths([[\"data\",\"conf\",\"adDownListOpen\"]])\n)\n) | (\nif (getpath([\"\
      data\",\"conf\",\"flowControlConfig\"]) | has(\"uploadEnable\")) then (setpath([\"\
      data\",\"conf\",\"flowControlConfig\",\"uploadEnable\"]; false)) else . end\n\
      )\n) | (\nif (getpath([\"data\",\"conf\",\"flowControlConfig\"]) | has(\"p2pEnable\"\
      )) then (setpath([\"data\",\"conf\",\"flowControlConfig\",\"p2pEnable\"]; false))\
      \ else . end\n)\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/ab-bodian\.kuwo\.cn\/abtest\/ui\/info\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\n(\n(\n(\n(\n(\ndelpaths([[\"\
      data\",\"mapTestInfo\",\"CommentADPosition\"]])\n) | (\ndelpaths([[\"data\"\
      ,\"mapTestInfo\",\"DiscoverADPosition\"]])\n)\n) | (\ndelpaths([[\"data\",\"\
      mapTestInfo\",\"DownloadAd\"]])\n)\n) | (\ndelpaths([[\"data\",\"mapTestInfo\"\
      ,\"FreeModVoiceReminder\"]])\n)\n) | (\ndelpaths([[\"data\",\"mapTestInfo\"\
      ,\"GamesTrans\"]])\n)\n) | (\ndelpaths([[\"data\",\"mapTestInfo\",\"bodianmvdialog\"\
      ]])\n)\n) | (\ndelpaths([[\"data\",\"mapTestInfo\",\"MvTryShowAds\"]])\n)\n\
      ) | (\ndelpaths([[\"data\",\"mapTestInfo\",\"insert\"]])\n)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/bd-api\.kuwo\.cn\/api\/service\/global\/config\/scene\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\n(\n(\ndelpaths([[\"data\",\"\
      iosP2PCacheEnable\"]])\n) | (\ndelpaths([[\"data\",\"warmStartDialog\"]])\n\
      )\n) | (\ndelpaths([[\"data\",\"adsNotFinishVipPop4DayInterval\"]])\n)\n) |\
      \ (\nif (getpath([\"data\"]) | has(\"showShopEntry\")) then (setpath([\"data\"\
      ,\"showShopEntry\"]; false)) else . end\n)\n) | (\nif (getpath([\"data\"]) |\
      \ has(\"iosP2pEnableSendDataLimit\")) then (setpath([\"data\",\"iosP2pEnableSendDataLimit\"\
      ]; 1)) else . end\n)\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/bd-api\.kuwo\.cn\/api\/search\/topic\/word\/list\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\n(\ndelpaths([[\"data\",\"hotTopic\"\
      ]])\n) | (\ndelpaths([[\"data\",\"searchFind\"]])\n)\n) | (\ndelpaths([[\"data\"\
      ,\"globalJumpInfo\"]])\n)\n) | (\ndelpaths([[\"data\",\"hotWord\"]])\n)\n) ])\
      \ as $__egern_results\n       | if ($__egern_results | length) == 1\n      \
      \   then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/bd-api\.kuwo\.cn\/api\/service\/home\/index\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.moduleList |= map(select(.type\
      \ | tostring | (. != \"8\" and . != \"1\")))\n) ]) as $__egern_results\n   \
      \    | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/bd-api\.kuwo\.cn\/api\/service\/music\/recommendList\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.musicList[] |= del(.showAd)\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/bd-api\.kuwo\.cn\/api\/comments\/v3\/topInfo\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\ndelpaths([[\"data\",\"putao\"]])\n\
      ) | (\ndelpaths([[\"data\",\"bannerVos\"]])\n)\n) ]) as $__egern_results\n \
      \      | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
map_locals:
- match: (?:^https:\/\/bd-api\.kuwo\.cn\/api\/(play|service|advert)\/advert\/)|(?:^https:\/\/bd-api\.kuwo\.cn\/api\/service\/banner\/)|(?:^https:\/\/bd-api\.kuwo\.cn\/api\/ucenter\/vip\/give\/config\?)|(?:^https:\/\/bd-api\.kuwo\.cn\/api\/service\/home\/module\?.*&moduleId=6)|(?:^https:\/\/bd-api\.kuwo\.cn\/api\/pay\/vip\/lowPriceText\?)|(?:^https:\/\/bd-api\.kuwo\.cn\/api\/service\/global\/config\/vipEnter\?)|(?:^https:\/\/bd-api\.kuwo\.cn\/api\/popup\/)|(?:^https:\/\/bd-api\.kuwo\.cn\/api\/pay\/vip\/invitation\/swell\/popup\?)|(?:^https:\/\/bd-api\.kuwo\.cn\/api\/service\/version\/popup\?)|(?:^https:\/\/bd-api\.kuwo\.cn\/api\/pay\/vip\/invitation\/assist\/popup\?)|(?:^https:\/\/bd-api\.kuwo\.cn\/api\/pay\/h5\/common\/popup\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - bd-api.kuwo.cn
