name: 波点音乐
description: 精简应用配置，禁用P2P传输。移除开屏广告、横幅推广、悬浮广告、歌曲广告、商城入口、搜索推广、评论区推广、试听语音提醒。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/BodianMusic.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/bd-api\.kuwo\.cn\/api\/service\/conf\/all\?
    filter: '(

      (

      (

      (

      (

      (

      (

      delpaths([["data","groupSign","adStartAppDialog"]])

      ) | (

      delpaths([["data","groupSign","adGuideTest"]])

      )

      ) | (

      delpaths([["data","groupSign","playTips"]])

      )

      ) | (

      delpaths([["data","groupSign","adExitChange"]])

      )

      ) | (

      delpaths([["data","conf","adGuidePopCount"]])

      )

      ) | (

      delpaths([["data","conf","adDownListOpen"]])

      )

      ) | (

      if (getpath(["data","conf","flowControlConfig"]) | has("uploadEnable")) then
      (setpath(["data","conf","flowControlConfig","uploadEnable"]; false)) else .
      end

      )

      ) | (

      if (getpath(["data","conf","flowControlConfig"]) | has("p2pEnable")) then (setpath(["data","conf","flowControlConfig","p2pEnable"];
      false)) else . end

      )'
- response_jq:
    match: ^https:\/\/ab-bodian\.kuwo\.cn\/abtest\/ui\/info\?
    filter: '(

      (

      (

      (

      (

      (

      (

      delpaths([["data","mapTestInfo","CommentADPosition"]])

      ) | (

      delpaths([["data","mapTestInfo","DiscoverADPosition"]])

      )

      ) | (

      delpaths([["data","mapTestInfo","DownloadAd"]])

      )

      ) | (

      delpaths([["data","mapTestInfo","FreeModVoiceReminder"]])

      )

      ) | (

      delpaths([["data","mapTestInfo","GamesTrans"]])

      )

      ) | (

      delpaths([["data","mapTestInfo","bodianmvdialog"]])

      )

      ) | (

      delpaths([["data","mapTestInfo","MvTryShowAds"]])

      )

      ) | (

      delpaths([["data","mapTestInfo","insert"]])

      )'
- response_jq:
    match: ^https:\/\/bd-api\.kuwo\.cn\/api\/service\/global\/config\/scene\?
    filter: '(

      (

      (

      (

      delpaths([["data","iosP2PCacheEnable"]])

      ) | (

      delpaths([["data","warmStartDialog"]])

      )

      ) | (

      delpaths([["data","adsNotFinishVipPop4DayInterval"]])

      )

      ) | (

      if (getpath(["data"]) | has("showShopEntry")) then (setpath(["data","showShopEntry"];
      false)) else . end

      )

      ) | (

      if (getpath(["data"]) | has("iosP2pEnableSendDataLimit")) then (setpath(["data","iosP2pEnableSendDataLimit"];
      1)) else . end

      )'
- response_jq:
    match: ^https:\/\/bd-api\.kuwo\.cn\/api\/search\/topic\/word\/list\?
    filter: '(

      (

      (

      delpaths([["data","hotTopic"]])

      ) | (

      delpaths([["data","searchFind"]])

      )

      ) | (

      delpaths([["data","globalJumpInfo"]])

      )

      ) | (

      delpaths([["data","hotWord"]])

      )'
- response_jq:
    match: ^https:\/\/bd-api\.kuwo\.cn\/api\/service\/home\/index\?
    filter: .data.moduleList |= map(select(.type | tostring | (. != "8" and . != "1")))
- response_jq:
    match: ^https:\/\/bd-api\.kuwo\.cn\/api\/service\/music\/recommendList\?
    filter: .data.musicList[] |= del(.showAd)
- response_jq:
    match: ^https:\/\/bd-api\.kuwo\.cn\/api\/comments\/v3\/topInfo\?
    filter: '(

      delpaths([["data","putao"]])

      ) | (

      delpaths([["data","bannerVos"]])

      )'
map_locals:
- match: ^https:\/\/bd-api\.kuwo\.cn\/api\/(play|service|advert)\/advert\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/bd-api\.kuwo\.cn\/api\/service\/banner\/
