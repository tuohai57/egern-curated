name: 菜鸟（小白脸·适配）
description: 过滤菜鸟广告
author: 小白脸
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Cainiao.png
open_url: https://apps.apple.com/app/id951610982
tag: 去广告
url_rewrites: []
body_rewrites:
- response_jq:
    match: (?i)^(?!https:\/\/e2e-mtop\.cainiao\.com\/gw\/mtop\.cainiao\.app\.e2e\.engine\.page\.fetch\.cn)(?:https:\/\/(cn-acs\.m|e2e-mtop)\.cainiao\.com\/gw\/mtop\.cainiao\.app\.e2e\.engine\.page\.fetch)
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.data.data.data.mainSearch.bizData.searchContents,\
      \ .data.data.data.operationList)\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/e2e-mtop\.cainiao\.com\/gw\/mtop\.cainiao\.app\.e2e\.engine\.page\.fetch\.cn
    filter: "(\n# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.data.data.data.mainSearch.bizData.searchContents,\
      \ .data.data.data.operationList)\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json\n) | (\n# Egern: preserve input on failed,\
      \ empty or multi-result transform\n. as $__egern_original_json\n| try (([ (\n\
      del(.data.data.banner, .data.data.activity, .data.data.vip)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json\n)"
- response_jq:
    match: (?i)^https:\/\/longquan-mtop\.cainiao\.com\/gw\/mtop\.com\.cainiao\.longquan\.place\.getpageresourcecontent\.cn
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.data.result.placeContentMap[\"\
      780001\"].contentList)\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/netflow-mtop\.cainiao\.com\/gw\/mtop\.cainiao\.guoguo\.nbnetflow\.ads
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\nif .data.result[0].materialId == \"\
      39017\" then . else .data = {} end\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
mitm:
  hostnames:
  - netflow-mtop.cainiao.com
  - nbcps-mtop.cainiao.com
  - cn-acs.m.cainiao.com
  - e2e-mtop.cainiao.com
  - longquan-mtop.cainiao.com
rules:
- url_regex:
    match: (?i)^https:\/\/nbcps-mtop\.cainiao\.com\/gw\/mtop\.cainiao\.nbcps\.presentation\.fetch\.cn
    policy: REJECT
- url_regex:
    match: (?i)^https:\/\/netflow-mtop\.cainiao\.com\/gw\/mtop\.cainiao\.guoguo\.nbnetflow\.ads\.index
    policy: REJECT
- url_regex:
    match: (?i)^https:\/\/cn-acs\.m\.cainiao\.com\/gw\/mtop\.cainiao\.adkeyword\.get\.cn
    policy: REJECT
- url_regex:
    match: (?i)^https:\/\/cn-acs\.m\.cainiao\.com\/gw\/mtop\.cainiao\.guoguo\.nbnetflow\.ads\.m?show
    policy: REJECT
