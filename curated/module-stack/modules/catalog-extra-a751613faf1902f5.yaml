name: 中国联通
author: '@ddgksf2013'
mitm:
  hostnames:
  - m.client.10010.com
  - img.client.10010.com
rules:
- domain_suffix:
    match: ad.10010.com
    policy: REJECT
- url_regex:
    match: ^https?:\/\/m\.client\.10010\.com\/mobileserviceimportant\/customer\/querySmartServicekhd.htm
    policy: REJECT
- url_regex:
    match: ^https?:\/\/m\.client\.10010\.com\/clientIndex\/api\/v1\/index\/queryIndexExclusiveOffers
    policy: REJECT
- url_regex:
    match: ^https?:\/\/img\.client\.10010\.com\/homejingxuan12\/js\/(pubuliu|1homeView)
    policy: REJECT
body_rewrites:
- response_jq:
    match: ^https?:\/\/m\.client\.10010\.com\/search_service\/search\/searchScrollWord
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.[\"113000004\"]=[]\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
