name: 每日赛车
description: 移除开屏广告、信息流广告。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/MeiRiSaiChe.png
mitm:
  hostnames:
  - api.romielf.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api\.romielf\.com\/index\/indexv\d\?
    filter: (setpath(["data", "advertisement"]; "[]") | setpath(["data", "listadvertising"];
      "[]")) | (.data.list |= map(select(.type == 1)))
