name: 每日赛车
description: 移除开屏广告、信息流广告。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/MeiRiSaiChe.png
mitm:
  hostnames:
  - api.romielf.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api\.romielf\.com\/index\/indexv\d\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(setpath([\"data\", \"advertisement\"\
      ]; \"[]\") | setpath([\"data\", \"listadvertising\"]; \"[]\")) | (.data.list\
      \ |= map(select(.type == 1)))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
