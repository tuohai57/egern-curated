name: 健康160
description: 移除开屏广告、应用内悬浮窗、弹窗广告、横幅广告，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/91160.png
homepage: https://hub.kelee.one
rules:
- url_regex:
    match: ^https:\/\/patientappapi\.91160\.com\/cus_index\.php\?c=adver
    policy: REJECT
body_rewrites:
- response_jq:
    match: ^https:\/\/soapi\.91160\.com\/homepage-recommendation\/recommendation\/medical\/complex\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndelpaths([[\"data\",\"checkupList\"\
      ]])\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: ^https:\/\/soapi\.91160\.com\/homepage-recommendation\/homepage\/flow\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.rows |= map(select(.type as\
      \ $type | [\"GOOD\", \"ARTICLE\"] | index($type) | not))\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/patientgate\.91160\.com\/cube\/v1\/unit_page\/page_data\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.modules |= map(select(.name\
      \ == \"announcement\" or .name == \"guide\" or .name == \"expert\" or .name\
      \ == \"featuredDepartments\" or .name == \"featureDevice\" or .name == \"featureTech\"\
      \ or .name == \"familyDoctor\" or .name == \"introduction\" or .name == \"bus\"\
      \ or .name == \"classicCase\" or .name == \"askEveryone\" or .name == \"reviews\"\
      \ or .name == \"notes\"))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
map_locals:
- match: ^https:\/\/msglb\.91160\.com\/msg\/outer\/broker\/get$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/patientgate\.91160\.com\/advert-api\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/snsapi\.91160\.com\/vipmemberapi\/mbCombo\/mbComboWords\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/patientgate\.91160\.com\/rec\/homepage\/open\/getUserGoodsList\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: (?:^https:\/\/snsapi\.91160\.com\/hotword\/open\/v1\/getSearchExplore\?)|(?:^https:\/\/snsapi\.91160\.com\/hotword\/open\/v1\/getHotWordPlate\?)|(?:^https:\/\/snsapi\.91160\.com\/engine\/backgroundWord\/queryForFrontend\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - patientgate.91160.com
  - soapi.91160.com
  - snsapi.91160.com
  - msglb.91160.com
  - patientappapi.91160.com
