name: 起点读书
description: 移除起点读书开屏广告、每日导读、各类弹窗、文末广告、搜索填充词，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/QiDian.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/client\/getconf$
    filter: '(

      (

      (

      (

      (

      if (getpath(["Data"]) | has("WolfEye")) then (setpath(["Data","WolfEye"]; 0))
      else . end

      ) | (

      if (getpath(["Data","CloudSetting"]) | has("TeenShowFreq")) then (setpath(["Data","CloudSetting","TeenShowFreq"];
      0)) else . end

      )

      ) | (

      delpaths([["Data","ActivityPageBackPushNoticeFrequency"]])

      )

      ) | (

      delpaths([["Data","ActivityIcon"]])

      )

      ) | (

      delpaths([["Data","ActivityPopup"]])

      )

      ) | (

      delpaths([["Data","LuckBag"]])

      )'
- response_jq:
    match: ^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v2\/dailyrecommend\/getdailyrecommend\?
    filter: if (getpath(["Data"]) | has("Items")) then (setpath(["Data","Items"];
      [])) else . end
- response_jq:
    match: ^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v3\/user\/getaccountpage\?
    filter: delpaths([["Data","BenefitButtonList"]])
