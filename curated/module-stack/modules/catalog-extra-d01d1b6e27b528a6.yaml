name: 起点读书
description: 移除起点读书开屏广告、每日导读、各类弹窗、文末广告、搜索填充词，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/QiDian.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/client\/getconf$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\n(\n(\n(\nif (getpath([\"Data\"\
      ]) | has(\"WolfEye\")) then (setpath([\"Data\",\"WolfEye\"]; 0)) else . end\n\
      ) | (\nif (getpath([\"Data\",\"CloudSetting\"]) | has(\"TeenShowFreq\")) then\
      \ (setpath([\"Data\",\"CloudSetting\",\"TeenShowFreq\"]; 0)) else . end\n)\n\
      ) | (\ndelpaths([[\"Data\",\"ActivityPageBackPushNoticeFrequency\"]])\n)\n)\
      \ | (\ndelpaths([[\"Data\",\"ActivityIcon\"]])\n)\n) | (\ndelpaths([[\"Data\"\
      ,\"ActivityPopup\"]])\n)\n) | (\ndelpaths([[\"Data\",\"LuckBag\"]])\n)\n) ])\
      \ as $__egern_results\n       | if ($__egern_results | length) == 1\n      \
      \   then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v2\/dailyrecommend\/getdailyrecommend\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\nif (getpath([\"Data\"]) | has(\"Items\"\
      )) then (setpath([\"Data\",\"Items\"]; [])) else . end\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v3\/user\/getaccountpage\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndelpaths([[\"Data\",\"BenefitButtonList\"\
      ]])\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
map_locals:
- match: (?:^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v4\/client\/getsplashscreen\?)|(?:^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/adv\/)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/ywab\.reader\.qq\.com\/user\/experiments\/v2\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: (?:^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/checkin\/simpleinfo\?)|(?:^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/push\/getdialog\?)|(?:^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/message\/getpushedmessagelist$)|(?:^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/maintain\/playstrip$)|(?:^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/dailyrecommend\/recommendBook\?)|(?:^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/freshman\/bookshelfbtn$)|(?:^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/bookshelf\/getTopOperation$)|(?:^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/booksearch\/hotWords\?)|(?:^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/followsubscribe\/showChapterEndModule\?)|(?:^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/young\/getconf$)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - magev6.if.qidian.com
  - ywab.reader.qq.com
