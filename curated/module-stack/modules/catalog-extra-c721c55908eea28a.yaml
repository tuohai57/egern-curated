name: 小红书
description: 过滤信息流推广，移除图片及视频水印，如有异常，请先清除缓存再尝试。
author: RuCu6[https://github.com/RuCu6], fmz200[https://github.com/fmz200]
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/RedNote.png
homepage: https://hub.kelee.one
rules:
- and:
    match:
    - protocol:
        match: quic
    - domain_suffix:
        match: xiaohongshu.com
        policy: EXTENDED-MATCHING
    policy: REJECT
body_rewrites:
- response_jq:
    match: ^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v1\/search\/banner_list$
    filter: if (getpath([]) | has("data")) then (setpath(["data"]; {})) else . end
- response_jq:
    match: ^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v1\/search\/hot_list$
    filter: if (getpath(["data"]) | has("items")) then (setpath(["data","items"];
      [])) else . end
- response_jq:
    match: ^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v4\/search\/hint
    filter: if (getpath(["data"]) | has("hint_words")) then (setpath(["data","hint_words"];
      [])) else . end
- response_jq:
    match: ^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v4\/search\/trending\?
    filter: '(

      if (getpath(["data"]) | has("queries")) then (setpath(["data","queries"]; []))
      else . end

      ) | (

      if (getpath(["data"]) | has("hint_word")) then (setpath(["data","hint_word"];
      {})) else . end

      )'
scriptings:
- http_request:
    name: 小红书 / binary local
    match: ^https:\/\/ci\.xiaohongshu\.com\/system_config\/watermark
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/424a885351ce40e57339692918c71935232178c4cc8b178b67b37d03b08e2059.js
    body_required: false
map_locals:
- match: ^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v1\/surprisebox\/(?:get_style|open|submit_action)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/www\.xiaohongshu\.com\/api\/marketing\/box\/trigger\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/(?:v2\/guide\/user_banner|v3\/note\/guide)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/www\.xiaohongshu\.com\/api\/sns\/(?:v1\/ads\/resource|v2\/hey\/\w+\/hey_gallery)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - ci.xiaohongshu.com
  - edith.xiaohongshu.com
  - rec.xiaohongshu.com
  - so.xiaohongshu.com
  - www.xiaohongshu.com
