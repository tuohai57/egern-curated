name: 墨迹天气
description: 移除天气页面横幅、工具栏，移除时景关注页面推荐，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/MojiWeather.png
homepage: https://hub.kelee.one
rules:
- url_regex:
    match: ^https:\/\/fcard\.api\.moji\.com\/flycard\/flyCard\?
    policy: REJECT
body_rewrites:
- response_jq:
    match: ^https:\/\/mme\.api\.moji\.com\/json\/entrance\/list$
    filter: del(.entrance_region_res_list[] | select(.region_name == "皇冠区域" or .region_name
      == "banner区")) | .entrance_region_res_list[].entrance_res_list |= if . then
      map(select(.entrance_name | . != "墨迹钱包" and . != "墨圈")) else . end
map_locals:
- match: ^https:\/\/vdo\.api\.moji\.com\/shortvideo\/card\/subscribe$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/vdo\.api\.moji\.com\/shortvideo\/video\/index_flow\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/vdo\.api\.moji\.com\/shortvideo\/video_user\/hotGuyRcm\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/vdo\.api\.moji\.com\/shortvideo\/zone\/follow_src_zone\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/sns\.api\.moji\.com\/user\/dynamic_v9\/json\/someone_interest\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - fcard.api.moji.com
  - vdo.api.moji.com
  - sns.api.moji.com
  - mme.api.moji.com
  - psnlz.api.moji.com
