- url_regex:
    match: ^https:\/\/www\.zhihu\.com\/api\/v4/(?:answers|questions)\/\d+/related-readings
    policy: REJECT
- url_regex:
    match: ^https:\/\/www\.zhihu\.com\/commercial_api\/banners_v3\/mobile_banner
    policy: REJECT
- url_regex:
    match: ^https:\/\/zhuanlan\.zhihu\.com\/api\/articles\/\d+\/recommendation
    policy: REJECT
- url_regex:
    match: ^https:\/\/zhstatic\.zhihu\.com\/brand-ad
    policy: REJECT
url_rewrites:
- match: ^https:\/\/link\.zhihu\.com\/\?target=(?:https?)?(?:%3A|:)?(?:\/\/|%2F%2F)?(.*)
  location: http://$1
  status_code: 302
body_rewrites:
- response_regex:
    match: ^https:\/\/api\.zhihu\.com\/search\/recommend_query\/v2\?
    find: '"recommend_queries":\{.+\}'
    replace: '"recommend_queries":{}'
map_locals:
- match: (?:^https:\/\/api\.zhihu\.com\/commercial_api\/(?:answer\/\d+\/bottom-v2|article\/\d+\/bottom-v2|banners_v3\/app_topstory_banner|launch_v2|real_time_launch_v2))|(?:^https:\/\/api\.zhihu\.com\/content-distribution-core\/bubble\/common\/settings)|(?:^https:\/\/api\.zhihu\.com\/(?:moments\/lastread|drama\/hot-drama-list))|(?:^https:\/\/api\.zhihu\.com\/root\/window)|(?:^https:\/\/api\.zhihu\.com\/(?:bazaar\/float_window|market\/popovers_v2))|(?:^https:\/\/api\.zhihu\.com\/me\/guides)|(?:^https:\/\/api\.zhihu\.com\/search\/(hot_search|preset_words))
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/www\.zhihu\.com\/api\/v4\/search\/related_queries\/(?:article|answer)\/\d+
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: (?:^https:\/\/api\.zhihu\.com\/comment_v5\/(?:articles|answers)\/\d+\/list-headers)|(?:^https:\/\/api\.zhihu\.com\/prague\/related_suggestion_native\/feed\?)|(?:^https:\/\/api\.zhihu\.com\/v5\.1\/topics\/answer\/\d+\/relation)|(?:^https:\/\/api\.zhihu\.com\/ad-style-service\/request)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/appcloud2\.zhihu\.com\/v3\/resource\?group_name=mp
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/api\.zhihu\.com\/distribute\/rhea\/qa_ad_card\/h5\/recommendation\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
scriptings:
- http_response:
    name: 知乎 / 1
    match: ^https:\/\/(?:api|page-info)\.zhihu\.com\/(?:answers|articles)\/v2\/\d+
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/544fd88207b9d7005bb5cf427a1994028f91a95a65fde3db72a501983bff99f4.js
    body_required: true
    update_interval: 86400
- http_response:
    name: 知乎 / 2
    match: (?:^https:\/\/api\.zhihu\.com\/commercial_api\/app_float_layer)|(?:^https:\/\/api\.zhihu\.com\/feed\/render\/tab\/config\?)|(?:^https:\/\/api\.zhihu\.com\/(?:moments_v3|topstory\/hot-lists\/total|topstory\/recommend))|(?:^https:\/\/api\.zhihu\.com\/root\/tab)|(?:^https:\/\/api\.zhihu\.com\/v2\/topstory\/hot-lists\/everyone-seeing\?)|(?:^https:\/\/api\.zhihu\.com\/bazaar\/vip_tab\/header\?)|(?:^https:\/\/api\.zhihu\.com\/next-(?:bff|data|render))|(?:^https:\/\/api\.zhihu\.com\/questions\/\d+(?:\/answers|\/feeds|\?include=))
