name: 汽水音乐
description: 移除开屏广告、弹窗广告、播放器推广、歌曲详情界面视频推广、播放页面的歌曲视频，精简首页和我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/SodaMusic.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/tnc\d-(bjlgy|ali[a-z]{2})\d?\.zijieapi\.com\/get_domains\/v\d\/\?
    filter: '(

      (

      (

      (

      if (getpath(["data"]) | has("opaque_data_enabled")) then (setpath(["data","opaque_data_enabled"];
      0)) else . end

      ) | (

      if (getpath(["data"]) | has("ttnet_http_dns_enabled")) then (setpath(["data","ttnet_http_dns_enabled"];
      0)) else . end

      )

      ) | (

      if (getpath(["data"]) | has("ttnet_quic_enabled")) then (setpath(["data","ttnet_quic_enabled"];
      0)) else . end

      )

      ) | (

      if (getpath(["data"]) | has("ttnet_tt_http_dns")) then (setpath(["data","ttnet_tt_http_dns"];
      0)) else . end

      )

      ) | (

      .data.ttnet_dispatch_actions |= map(select(.action != "dispatch" and .action
      != "tc"))

      )'
- response_jq:
    match: ^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/me\?
    filter: delpaths([["reward_ad_banner"]])
- response_jq:
    match: ^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/feed\/song-tab\?
    filter: del(.items[] | select(.type == "video_track_mix"))
- response_jq:
    match: ^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/card\?
    filter: '(

      delpaths([["preview_guide"]])

      ) | (

      del(.card_items[] | select(has("priority_display")))

      )'
- response_jq:
    match: ^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/more-panel\?
    filter: .blocks |= map(select(.type != "related_video"))
