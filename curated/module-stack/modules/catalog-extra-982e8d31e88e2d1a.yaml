name: 启信宝
description: 移除开屏广告、应用内弹窗、首页轮播图、悬浮部件和个性化推荐信息流。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/QiXinBao.png
homepage: https://hub.kelee.one
rules:
- url_regex:
    match: ^https:\/\/qxb-minicode-pic-osscache\.qixin\.com\/web\/
    policy: REJECT
map_locals:
- match: ^https:\/\/appc\.qixin\.com\/v4\/general\/getSearchPlaceholderRedirect$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: (?:^https:\/\/appc-v6\.qixin\.com\/v4\/general\/getAppFloatAd$)|(?:^https:\/\/appc-v6\.qixin\.com\/v4\/general\/getAppBanners$)|(?:^https:\/\/appc-v6\.qixin\.com\/v4\/user\/getUserActivitys$)|(?:^https:\/\/appc-v6\.qixin\.com\/v4\/enterprise\/homePageRecommend\/recommendCard\d+)|(?:^https:\/\/appc-v6\.qixin\.com\/v4\/user\/getRecommendPersons$)|(?:^https:\/\/appc-v6\.qixin\.com\/v4\/enterprise\/getRecommendEnts$)|(?:^https:\/\/appc-v6\.qixin\.com\/v4\/enterprise\/getRecommendation$)|(?:^https:\/\/appc-v6\.qixin\.com\/v4\/general\/getAppBottomBanners$)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - appc.qixin.com
  - appc-v6.qixin.com
  - qxb-minicode-pic-osscache.qixin.com
