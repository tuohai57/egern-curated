name: 斗鱼
description: 移除开屏、首页视频流、首页轮播图广告，移除直播间悬浮窗。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Douyu.png
rules:
- url_regex:
    match: ^http:\/\/linkmicschedule\.douyucdn\.cn\/im_schedule\/im_gate_list
    policy: REJECT
- and:
    match:
    - dest_port:
        match: '18000'
    - protocol:
        match: stun
    policy: REJECT
- domain:
    match: stun1.douyucdn.cn
    policy: REJECT
- domain:
    match: stun1.qvb.qcloud.com
    policy: REJECT
map_locals:
- match: (?i)^https:\/\/rtbapi\.douyucdn\.cn\/japi\/sign\/app\/getinfo
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
scriptings:
- http_response:
    name: 移除首页轮播图和视频流广告
    match: (?i)^https:\/\/apiv2\.douyucdn\.cn\/mgapi\/livenc\/home\/getRecV3
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/92c8426b0229a89e22277c7f8ca1ff71ad1900e8786cb9f24845491393612b1a.js
    body_required: true
    update_interval: 86400
mitm:
  hostnames:
  - rtbapi.douyucdn.cn
  - apiv2.douyucdn.cn
  - venus.douyucdn.cn
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/apiv2\.douyucdn\.cn\/japi\/entrance\/roomRes\/nc\/m\/list
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"pendant_a\"\
      ], [\"data\", \"entrance_d\"]]))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/venus\.douyucdn\.cn\/venus\/config\/static\/update.+keyCodeSet=flow_config
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(setpath([\"greatGodGameSitterSwitch\"\
      ]; 0) | setpath([\"followMoreAnchorEntrance\"]; 0) | setpath([\"sdklivebanner\"\
      ]; 0) | setpath([\"homeActFloatSwitch\"]; 0) | setpath([\"bringGoodsSwitch\"\
      ]; 0) | setpath([\"qqGameSwitch\"]; 0))\n) ]) as $__egern_results\n       |\
      \ if ($__egern_results | length) == 1\n         then $__egern_results[0] else\
      \ $__egern_original_json end)\n  catch $__egern_original_json"
