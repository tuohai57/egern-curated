  ishowshu[https://github.com/ishowshu], 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://loonlab.103516.xyz/Plugin/
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/Goofish.png
open_url: https://apps.apple.com/app/id510909506
tag: 去广告
rules:
- domain_suffix:
    match: iyes.youku.com
    policy: REJECT
- and:
    match:
    - url_regex:
        match: '"^http:\/\/.+\/amdc\/mobileDispatch"'
    - user_agent:
        match: '"%E9%97%B2%E9%B1%BC*"'
    policy: REJECT
- url_regex:
    match: (?i)^https:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.playboy\.recommend\/1\.0
    policy: REJECT
url_rewrites: []
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idlehome\.widget\.refresh\.get\/
    filter: .data.homeTopList = []
- response_jq:
    match: (?i)^https:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.home\.whale\.modulet\/
    filter: .data.container.sections |= map(select(.template.name == "fish_home_miniapp"))
- response_jq:
    match: (?i)^https:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.user\.strategy\.list\/
    filter: del(.data)
- response_jq:
    match: (?i)^https:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.fun\.follow\.feed\.list\/
    filter: .data.sections|=map(select(.cardType==2001))
- response_jq:
    match: (?i)^https:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idlehome\.home\.community\/
    filter: .data.feedsList |= map(select(.template.name == "idlefish_home_new_commodity_card"
      or .template.name == "idlefish_home_new_content_card"))
- response_jq:
    match: (?i)^https:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idlehome\.home\.newitem\.page\/
    filter: .data.sections |= map(select(.data.clickParam.args.cardType as $ct | $ct
      != "banner" and $ct != "mamaAD"))
- response_jq:
    match: (?i)^https:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idlemtopsearch\.search\.shade\/
    filter: del(.data)
- response_jq:
    match: (?i)^https:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idlehome\.magic\.home\.page\.list\/
    filter: del(.data.topList)
- response_jq:
    match: (?i)^https:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.trade\.full\.info\/
    filter: .data.components |= map(select(.render != "recommendTabVO"))
- response_jq:
    match: (?i)^https:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.group\.myself\.banner\/
    filter: .data.bannerList = []
- response_jq:
    match: (?i)^https:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.playboy\.recommend\/2\.0
    filter: .data.recommends = [] | .data.items = [] | .data.next = false
- response_jq:
    match: (?i)^https:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.fun\.follow\.often\.visit\/
    filter: .data.sections = []
- response_jq:
    match: (?i)^https:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.circle\.myself\.banner\/1\.0
    filter: .data.bannerList = []
- response_jq:
    match: (?i)^https:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.circle\.visited\/1\.0
    filter: .data.visitedCircleList = []
- response_jq:
    match: (?i)^https:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idlemtopsearch\.search\.activate\.tablist\/
    filter: .data.tabList = []
- response_jq:
    match: (?i)^https:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.trade\.order\.render\/
    filter: del(.data.bottomBarVO.benefitPointAtmosphere) | .data.components |= map(select(.render
      != "meanTimeBuyVO"))
