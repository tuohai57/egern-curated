name: 猫耳FM
description: 移除开屏广告、青少年模式弹窗、首页顶部入口，替换底栏的直播入口为发现入口。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/CatEarFM.png
map_locals:
- match: (?i)^https:\/\/data\.missevan\.com\/site\/ad-track$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/app\.missevan\.com\/x\/recommend\/get-popup$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i:^https:\/\/fm\.missevan\.com\/api\/v2\/meta\/banner$)|(?i:^https:\/\/fm\.missevan\.com\/api\/v2\/recommended\/top\?)|(?i:^https:\/\/fm\.missevan\.com\/api\/v2\/chatroom\/sound\/recommend\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - app.missevan.com
  - data.missevan.com
  - fm.missevan.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/app\.missevan\.com\/site\/launch\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"info\", \"splash\"],\
      \ [\"info\", \"splash_ready\"]]))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/app\.missevan\.com\/site\/config$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"info\", \"tab_bar_live\"\
      ], [\"0\"], [\"info\", \"enable_tab_bar_live_notice\"], [\"false\"], [\"info\"\
      , \"teenager_popup_mode\"], [\"0\"]])) | (delpaths([[\"info\", \"httpdns\"],\
      \ [\"info\", \"homepage_top_task_button\"]])) | (.info.cronet |= (fromjson |\
      \ .quic=false | tojson))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/app\.missevan\.com\/site\/tabs\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.info.tabs |= map(select(.title as\
      \ $t | [\"直播\", \"发现\", \"广播剧\", \"听书\", \"分类\"] | index($t) != null)))\n) ])\
      \ as $__egern_results\n       | if ($__egern_results | length) == 1\n      \
      \   then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/app\.missevan\.com\/site\/icons\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.info.icons |= map(select(.title\
      \ as $t | $t == \"直播\" or $t == \"必听剧\" or $t == \"免费榜\" or $t == \"夜猫子\" or\
      \ $t == \"启动音\")))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/app\.missevan\.com\/discovery\/list$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.info |= map(map(select(.title !=\
      \ \"免流服务\"))))\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/app\.missevan\.com\/site\/get-top$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"info\", \"search_words\"\
      ]]))\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
