name: 酷安
description: 过滤酷安广告
author: RuCu6[https://github.com/RuCu6], 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/CoolApk.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/api\.coolapk\.com\/v6\/feed\/detail\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.hotReplyRows |= if . then map(select(.id?))\
      \ else . end | .data.topReplyRows |= if . then map(select(.id?)) else . end\
      \ | reduce (\"detailSponsorCard\", \"include_goods\", \"include_goods_ids\"\
      ) as $key (.; .data[$key]=[])\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/api\.coolapk\.com\/v6\/feed\/replyList
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\nif .data? and ((.data | type) == \"\
      array\") and (.data | length > 0) then .data |= map(select(.id?)) else . end\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/api\.coolapk\.com\/v6\/main\/dataList
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data |= (if (type==\"array\" and\
      \ length>0) then map(select((.entityTemplate!=\"sponsorCard\") and (.title!=\"\
      精选配件\"))) else . end)\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/api\.coolapk\.com\/v6\/page\/dataList
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\nif (.data | length > 0) then .data\
      \ |= map(select((.title? != \"酷安热搜\") and (.entityTemplate? != \"imageScaleCard\"\
      ) and (.entityTemplate? != \"sponsorCard\"))) else . end\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/api\.coolapk\.com\/v6\/main\/indexV8
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data |= (if length > 0 then map(select((.entityTemplate\
      \ != \"sponsorCard\") and ([8639,29349,33006,32557] | index(.entityId) | not)\
      \ and ((.title// \"\" | test(\"值得买|红包\")) | not))) else . end)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/api\.coolapk\.com\/v6\/main\/init
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data |= map(select(.entityId? | [944,945,6390]\
      \ | index(.) | not) | if .entityId == 20131 then .entities |= map(select(.title\
      \ != \"酷品\")) else . end)\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
map_locals:
- match: ^https:\/\/api\.coolapk\.com\/v6\/search\?.*type=hotSearch
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - api.coolapk.com
