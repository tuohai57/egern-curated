name: Pinterest
description: 移除瀑布流、更多探索内容中的广告
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Pinterest.png
mitm:
  hostnames:
  - api.pinterest.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api\.pinterest\.com\/v\d\/feeds\/home\/\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data |= map(select(.is_promoted\
      \ == false or .is_promoted == \"false\")))\n) ]) as $__egern_results\n     \
      \  | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.pinterest\.com\/v\d\/pins\/\d+\/related\/modules\/\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data |= map(select(.is_promoted\
      \ == false or .is_promoted == \"false\")))\n) ]) as $__egern_results\n     \
      \  | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
