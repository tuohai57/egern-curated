    policy: REJECT
- url_regex:
    match: ^https?:\/\/.*\.xima.*\.com\/mobile\/discovery\/v\d\/location
    policy: REJECT
- url_regex:
    match: ^https?:\/\/.*\.xima.*\.com\/(hub\/)?hotWord
    policy: REJECT
- url_regex:
    match: ^https?:\/\/.*\.xima.*\.com\/(hub\/)?hotWordBillboard
    policy: REJECT
- url_regex:
    match: ^https?:\/\/.*\.xima.*\.com\/(hub)?guideWord
    policy: REJECT
- url_regex:
    match: ^https?:\/\/.*\.xima.*\.com\/api\/v\d\/adRealTime
