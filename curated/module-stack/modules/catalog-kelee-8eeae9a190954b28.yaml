name: 新浪财经
description: 移除开屏广告、弹窗广告、横幅广告、信息流广告，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/SinaStock.png
map_locals:
- match: (?i)^https:\/\/news\.cj\.sina\.cn\/search\/tips\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/search\.cj\.sina\.cn\/stock\/get_index_new\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/news\.cj\.sina\.cn\/search\/tips\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/recommend\.cj\.sina\.cn\/app\/v2\/search\/discovery$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/quotes\.sina\.com\.cn\/cn\/api\/openapi\.php\/PriceChangeService\.getSearchList\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - app.cj.sina.com.cn
  - news.cj.sina.cn
  - search.cj.sina.cn
  - recommend.cj.sina.cn
  - quotes.sina.com.cn
  - newscj.xincai.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/news\.cj\.sina\.cn\/app\/v1\/news724\/list\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"result\", \"data\",\
      \ \"ad\"]]))\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/app\.cj\.sina\.com\.cn\/apps\/api\/user\/center\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.result.data |= with_entries(select(.key\
      \ == \"button\" or .key == \"account\" or .key == \"balance\")))\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/news\.cj\.sina\.cn\/toutiao\/content\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(del(.result.data[]?.ad, .result.data[]?.report))\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/app\.cj\.sina\.com\.cn\/api\/deal\/index\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"banner\"]]))\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/app\.cj\.sina\.com\.cn\/clientSetting\/api\/start\/init\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"result\", \"data\",\
      \ \"search_ad\"], [\"result\", \"data\", \"center_ads\"], [\"result\", \"data\"\
      , \"banner_new_tagid\"], [\"result\", \"data\", \"ad_hasAddScreenParam\"], [\"\
      result\", \"data\", \"us_trade\"], [\"result\", \"data\", \"open_account\"],\
      \ [\"result\", \"data\", \"us_hq_trade\"]]))\n) ]) as $__egern_results\n   \
      \    | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/(newscj\.xincai\.com|news\.cj\.sina\.cn)\/app\/v1\/feed\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data.feed.data |= map(select((.author\
      \ // \"\") != \"\")))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
