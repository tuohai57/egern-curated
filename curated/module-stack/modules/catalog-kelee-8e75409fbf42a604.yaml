name: 七猫小说
description: 移除大部分七猫小说广告，但受限于七猫小说自身对MitM和VPN状态的检测，部分页面广告无法移除。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/SevenCat.png
rules:
- domain:
    match: cdn-ad.wtzw.com
    policy: REJECT
- domain:
    match: cdn-new-ad.wtzw.com
    policy: REJECT
- domain_suffix:
    match: gdt.qq.com
    policy: REJECT
map_locals:
- match: (?i)^https:\/\/api-cfg\.wtzw\.com\/v\d\/splash\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i:^https:\/\/api-bc\.wtzw\.com\/api\/v4\/search\/dispose)|(?i:^https:\/\/api-bc\.wtzw\.com\/api\/v\d\/book-store\/config)|(?i:^https:\/\/api-bc\.wtzw\.com\/api\/v\d\/book-store\/push-book)|(?i:^https:\/\/api-bc\.wtzw\.com\/api\/v\d\/operation)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/sf3-fe-tos\.pglstatp-toutiao\.com\/obj\/ad-pattern\/
  status_code: 404
  body: ''
  headers:
    Content-Type: text/plain; charset=utf-8
- match: (?i)^https:\/\/api-gw\.wtzw\.com\/welf\/app\/v\d\/task\/red-packet
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/cdn\.wtzw\.com\/bookimg\/free\/api\/v\d\/reader\/reader-copy-paragraph-all\.json
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i:^https:\/\/api-cfg\.wtzw\.com\/v\d\/reward\/)|(?i:^https:\/\/api-cfg\.wtzw\.com\/v\d\/adv\/)
  status_code: 404
  body: ''
  headers:
    Content-Type: text/plain; charset=utf-8
- match: (?i:^https:\/\/api-cfg\.wtzw\.com\/v\d\/offline-adv\/index)|(?i:^https:\/\/api-cfg\.wtzw\.com\/v\d\/operation\/index\?ad_personal_switch)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/xiaoshuo\.wtzw\.com\/api\/v\d\/withdraw\/init
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - api-cfg.wtzw.com
  - sf3-fe-tos.pglstatp-toutiao.com
  - api-bc.wtzw.com
  - api-gw.wtzw.com
  - cdn.wtzw.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/xiaoshuo\.wtzw\.com\/api\/v\d\/user\/my-center\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"func_area\"\
      , 1], [\"data\", \"func_area\", 2]]))\n) ]) as $__egern_results\n       | if\
      \ ($__egern_results | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
