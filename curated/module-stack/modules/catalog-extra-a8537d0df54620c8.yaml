name: 斗鱼
description: 移除开屏、首页视频流、首页轮播图广告，移除直播间悬浮窗。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Douyu.png
homepage: https://hub.kelee.one
rules:
- url_regex:
    match: ^http:\/\/linkmicschedule\.douyucdn\.cn\/im_schedule\/im_gate_list
    policy: REJECT
- and:
    match:
    - dest_port:
        match: '18000'
    - protocol:
        match: stun
    policy: REJECT
- domain:
    match: stun1.douyucdn.cn
    policy: REJECT
- domain:
    match: stun1.qvb.qcloud.com
    policy: REJECT
url_rewrites:
- match: ^(http:\/\/)((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\/(hlsh5p1\.douyucdn2\.cn)(.*)
  location: $1$5$6
  status_code: 307
body_rewrites:
- response_jq:
    match: ^https:\/\/apiv2\.douyucdn\.cn\/japi\/entrance\/roomRes\/nc\/m\/list
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\ndelpaths([[\"data\",\"pendant_a\"\
      ]])\n) | (\ndelpaths([[\"data\",\"entrance_d\"]])\n)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/venus\.douyucdn\.cn\/venus\/config\/static\/update.+keyCodeSet=flow_config
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\n(\n(\n(\nif (getpath([]) | has(\"\
      greatGodGameSitterSwitch\")) then (setpath([\"greatGodGameSitterSwitch\"]; 0))\
      \ else . end\n) | (\nif (getpath([]) | has(\"followMoreAnchorEntrance\")) then\
      \ (setpath([\"followMoreAnchorEntrance\"]; 0)) else . end\n)\n) | (\nif (getpath([])\
      \ | has(\"sdklivebanner\")) then (setpath([\"sdklivebanner\"]; 0)) else . end\n\
      )\n) | (\nif (getpath([]) | has(\"homeActFloatSwitch\")) then (setpath([\"homeActFloatSwitch\"\
      ]; 0)) else . end\n)\n) | (\nif (getpath([]) | has(\"bringGoodsSwitch\")) then\
      \ (setpath([\"bringGoodsSwitch\"]; 0)) else . end\n)\n) | (\nif (getpath([])\
      \ | has(\"qqGameSwitch\")) then (setpath([\"qqGameSwitch\"]; 0)) else . end\n\
      )\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
map_locals:
- match: ^https:\/\/rtbapi\.douyucdn\.cn\/japi\/sign\/app\/getinfo
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - rtbapi.douyucdn.cn
  - apiv2.douyucdn.cn
  - venus.douyucdn.cn
