    policy: REJECT
- domain_suffix:
    match: app-measurement.com
    policy: REJECT
- domain_suffix:
    match: pangle.io
    policy: REJECT
- domain_suffix:
    match: applovin.com
    policy: REJECT
- domain_suffix:
    match: appier.net
    policy: REJECT
- domain_suffix:
    match: adsmoloco.com
    policy: REJECT
- domain_suffix:
    match: adcanvas.com
    policy: REJECT
- url_regex:
    match: ^https:\/\/.*\.i18n-pglstatp\.com\/obj\/ad-pattern-sg
