name: 喜马拉雅
description: 移除开屏广告、播放器广告、各类推荐内容，精简频道和我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Himalaya.png
rules:
- domain:
    match: adse.ximalaya.com
    policy: REJECT
- domain:
    match: adsehera.ximalaya.com
    policy: REJECT
- domain:
    match: adse.wsa.ximalaya.com
    policy: REJECT
- domain:
    match: adbehavior.ximalaya.com
    policy: REJECT
- domain:
    match: adbehavior.wsa.ximalaya.com
    policy: REJECT
map_locals:
- match: (?i)^https:\/\/(search|searchwsa)\.ximalaya\.com\/hub\/(guideWord|hotWord)V\d\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/(mobile|mobilehera|mobwsa)\.ximalaya\.com\/discovery-feed\/v\d\/scene\/listen\/refresh\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/(m|mwsa)\.ximalaya\.com\/x-web-activity\/signIn\/getHomePageSignInInfo\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/(mobile|mobilehera|mobwsa)\.ximalaya\.com\/subscribe\/v\d\/subscribe\/tagAlbumList$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/(mobile|mobilehera|mobwsa)\.ximalaya\.com\/track-feed\/v\d\/chase\/recommend\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/(mobile|mobilehera|mobwsa)\.ximalaya\.com\/social-web\/follow-stream\/category\/\d+$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/(m|mwsa)\.ximalaya\.com\/community\/square\/v\d\/stream\?
  status_code: 200
  body: '{"data":{"cards":[{"content":{},"type":"RECOMMENDS"}]},"ret":0}'
  headers:
    Content-Type: application/json
- match: (?i)^https:\/\/(mobile|mobilehera|mobwsa)\.ximalaya\.com\/mobile-playpage\/playpage\/recommendContentV\d\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/(mobile|mobilehera|mobwsa)\.ximalaya\.com\/mobile-playpage\/playpage\/recommend\/resource\/allocation\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/(mobile|mobilehera|mobwsa)\.ximalaya\.com\/firework-portal\/v\d+\/sync\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/(mobile|mobilehera|mobwsa)\.ximalaya\.com\/business-sale-promotion-guide-mobile-web\/popup\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/(mobile|mobilehera|mobwsa)\.ximalaya\.com\/app-skin-service\/skin\/setting\/info\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/(live|livewsa)\.ximalaya\.com\/lamia\/v1\/subscribe\/status$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/(mobile|mobilehera|mobwsa)\.ximalaya\.com\/subscribe\/v\d\/subscribe\/recommend\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/(mobile|mobilehera|mobwsa)\.ximalaya\.com\/mobile-user\/v\d\/purchased\/recommend\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - gslbali.ximalaya.com
  - search.ximalaya.com
  - searchwsa.ximalaya.com
  - mobile.ximalaya.com
  - mobilehera.ximalaya.com
  - mobwsa.ximalaya.com
  - m.ximalaya.com
  - mwsa.ximalaya.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/(mobile|mobilehera|mobwsa)\.ximalaya\.com\/discovery-feed\/v\d\/mix\/
    filter: (.heData |= map(select(.item.list[].bizType != "SceneListenCard")))
- response_jq:
    match: (?i)^https:\/\/(mobile|mobilehera|mobwsa)\.ximalaya\.com\/discovery-category\/customCategories\/
    filter: (.categoryList |= map(.itemList |= map(select(.title | test("直播|123狂欢节|SVIP";
      "i") | not))) | .customCategoryList |= map(select(.title | test("直播|123狂欢节|SVIP";
      "i") | not)))
- response_jq:
    match: (?i)^https:\/\/(mobile|mobilehera|mobwsa)\.ximalaya\.com\/football-portal\/diff2\/batch\?
    filter: (delpaths([["json", "ad"], ["json", "toc"]]))
- response_jq:
    match: (?i)^https:\/\/(mobile|mobilehera|mobwsa)\.ximalaya\.com\/nexus-web\/v\d\/tabs\/customTabs\?
    filter: (.data.feedTabs |= map(select(.name != "大赛")))
- response_jq:
    match: (?i)^https:\/\/mobwsa\.ximalaya\.com\/mobile-playpage\/playpage\/tabs\/v2\/
    filter: (delpaths([["data", "playpage", "resourceMap", "defaultResource"], ["data",
      "playpage", "resourceMap", "playPageTip"]]))
- response_jq:
    match: (?i)^https:\/\/(mobile|mobilehera|mobwsa)\.ximalaya\.com\/mobile-user\/v\d\/homePage\/
    filter: (delpaths([["data", "freeListenV2"]])) | (.data.serviceModule.entrances
      |= map(select(.name == "全部服务")))
