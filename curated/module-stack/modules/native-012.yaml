      \ | select(type == \"object\") | .tools | select(type == \"array\") | .[] |\
      \ select(type == \"object\")) |= del(.tips) else . end) | (if (type == \"object\"\
      ) and ((.data | type) == \"object\") and ((.data.category | type) == \"array\"\
      ) then (.data.category[] | select(type == \"object\") | .tools | select(type\
      \ == \"array\")) |= map(select(if type == \"object\" then (((.id | type) ==\
      \ \"string\" and .id == \"547\") or ((.id | type) == \"number\" and .id == 547))\
      \ | not else true end)) else . end)\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
