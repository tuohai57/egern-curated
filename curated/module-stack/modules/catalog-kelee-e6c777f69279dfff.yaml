name: 稿定设计
description: 移除稿定设计开屏广告、首页轮播图和弹窗，移除功能入口角标。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/GaoDing.png
map_locals:
- match: (?i)^https:\/\/www\.gaoding\.com\/api\/v\d\/oc\/v\d\/delivery-pits\/ios-splash\/modules$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/www\.gaoding\.com\/api\/v\d\/oc\/delivery-pits\/(template|mine|home)-page-dialog\/modules$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/www\.gaoding\.com\/api\/v\d\/cp\/search-words\/v2\/placeholder
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - www.gaoding.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/www\.gaoding\.com\/api\/v\d\/oc\/exhibitions\/template\/resources$
    filter: (.pits |= map(select(.module_type != "BANNER")))
- response_jq:
    match: (?i)^https:\/\/www\.gaoding\.com\/api\/v\d\/oc\/exhibitions\/app_mine\/resources$
    filter: (.pits |= map(select(.module_type != "BANNER")))
- response_jq:
    match: (?i)^https:\/\/www\.gaoding\.com\/api\/v\d\/oc\/exhibitions\/(templates|all_editor_tools)\/resources$
    filter: (walk(if type == "object" and .badge_img_url? then .badge_img_url="" else
      . end))
