name: 哔哩哔哩增强
description: 拜托，没有广告的哔哩哔哩真的超酷的
rules:
- domain:
    match: bsbsb.top
    policy: 自动选择
- domain:
    match: dns.google
    policy: REJECT
- domain:
    match: api.biliapi.com
    policy: REJECT
- domain:
    match: app.biliapi.com
    policy: REJECT
- domain:
    match: api.biliapi.net
    policy: REJECT
- domain:
    match: app.biliapi.net
    policy: REJECT
- and:
    match:
    - domain_suffix:
        match: chat.bilibili.com
    - or:
        match:
        - domain_keyword:
            match: stun
        - domain_keyword:
            match: tracker
        - domain_keyword:
            match: p2p
    policy: REJECT
- dest_port:
    match: '4480'
    policy: REJECT
- dest_port:
    match: '4483'
    policy: REJECT
- dest_port:
    match: '9102'
    policy: REJECT
map_locals:
- match: ^https:\/\/app\.bilibili\.com\/x\/v2\/splash\/list\?
  headers:
    content-type: application/json
  body: '{"code":0,"message":"OK","ttl":1,"data":{"max_time":0,"min_interval":31536000,"pull_interval":31536000,"keep_ids":[],"show":[],"list":[{}],"splash_request_id":""}}'
- match: ^https:\/\/ap[ip]\.bilibili\.com\/x\/(?:resource\/(?:top\/activity|patch\/tab(?:\/v2)?)|v2\/search\/square|vip\/ads\/materials)\?
  headers:
    content-type: application/json
  body: '{"code":-404,"message":"-404","ttl":1,"data":null}'
- match: ^https:\/\/api\.bilibili\.com\/pgc\/activity\/deliver\/material\/receive\?
  headers:
    content-type: application/json
  body: '{"code":0,"data":{"closeType":"close_win","container":[],"showTime":""},"message":"success"}'
- match: ^https:\/\/api\.live\.bilibili\.com\/xlive\/e-commerce-interface\/v1\/ecommerce-user\/get_shopping_info\?
  headers:
    content-type: application/json
  body: '{}'
- match: ^https:\/\/line3-h5-mobile-api\.biligame\.com\/game\/live\/large_card_material\?
  headers:
    content-type: application/json
  body: '{"code":0,"message":"success"}'
scriptings:
- http_request:
    name: Sparkle原始二进制本地响应
    match: (?:^https:\/\/grpc\.biliapi\.net\/bilibili\.app\.interface\.v1\.Teenagers\/ModeStatus$)|(?:^https:\/\/grpc\.biliapi\.net\/bilibili\.app\.interface\.v1\.Search\/DefaultWords$)|(?:^https:\/\/grpc\.biliapi\.net\/bilibili\.app\.(?:view\.v1\.View\/TFInfo|viewunite\.v1\.View\/(?:PlayPause|ViewEndPage))$)
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/d1ee2d906277322ee846c26cbea2982434c60319cf48c4bb2314b6626527147c.js
    body_required: false
- http_request:
    name: bilibili.protobuf.request
    match: (?:^https:\/\/(?:grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.(?:app\.viewunite\.v1\.View\/View|main\.community\.reply\.v1\.Reply\/MainList)$)|(?:^https:\/\/(?:grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.(?:community\.service\.dm\.v1\.DM\/DmSegMobile|app\.view(?:unite)?\.v1\.View\/ViewProgress)$)
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/61fc5eaded4cb28d2c21796d3fb92ae8b8c3896346bf16ad3f4f29f6e1db53d2.js
    body_required: true
    binary_body: true
    max_size: 8388608
- http_response:
    name: bilibili.skin
    match: ^https:\/\/app\.bilibili\.com\/x\/resource\/show\/skin\?
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/0e0ea34142c4f7d4a2f2cdc5731d44bd70b6e43375aec993f40ec54d6593f491.js
    body_required: true
- http_response:
    name: bilibili.json
    match: ^https:\/\/app\.bilibili\.com\/x\/(?:resource\/show\/tab\/v2|v2\/(?:splash\/(?:show|event\/list2)|feed\/index(?:\/story)?|account\/(?:mine(?:\/ipad)?|myinfo)))\?
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/09749a95e96d4b5847d5d6a07476b3ff70b3dc11d8cda2b00e80bd8681594c6e.js
    body_required: true
- http_response:
    name: bilibili.live
    match: ^https:\/\/api\.live\.bilibili\.com\/xlive\/(?:app-interface\/v2\/index\/feed|app-room\/v1\/index\/getInfoBy(?:Room|User))\?
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/09749a95e96d4b5847d5d6a07476b3ff70b3dc11d8cda2b00e80bd8681594c6e.js
    body_required: true
- http_response:
    name: bilibili.webpage
    match: ^https:\/\/www\.bilibili\.com\/blackboard\/era\/[^?]+\.html\?
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/51ac0153239c8ccfbcfa7207cdba4ad6affb6c95e4201f3d54754d17dfeb50c1.js
    body_required: true
- http_response:
    name: bilibili.protobuf.response
    match: ^https:\/\/(?:grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.(?:app\.(?:show\.v1\.Popular\/Index|dynamic\.v2\.Dynamic\/DynAll|view(?:unite)?\.v1\.View\/(?:View|ViewProgress|RelatesFeed|AIRelateAsync)|playurl\.v1\.PlayURL\/PlayView|playerunite\.v1\.Player\/PlayViewUnite)|polymer\.app\.search\.v1\.Search\/SearchAll|community\.service\.dm\.v1\.DM\/DmView|main\.community\.reply\.v1\.Reply\/MainList|pgc\.gateway\.player\.v2\.PlayURL\/PlayView)$
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/bfcc0970105056b51a02eb643931c8d4a8d9656f25a5c3f0d6fe9cf6b4d15f8e.js
    body_required: true
    binary_body: true
    max_size: 8388608
mitm:
  hostnames:
  - grpc.biliapi.net
  - app.bilibili.com
  - api.bilibili.com
  - api.live.bilibili.com
  - www.bilibili.com
  - line3-h5-mobile-api.biligame.com
compat_arguments:
  空降助手策略: 自动选择
  优化评论区加载: bilibili.protobuf.request
  空降助手: bilibili.airborne
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/BilibiliPink.png
