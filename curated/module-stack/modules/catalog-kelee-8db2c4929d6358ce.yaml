name: 皮皮虾
description: 移除开屏广告、评论区广告、视频流广告，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/PiPiXia.png
map_locals:
- match: (?i:^https:\/\/api(5-lq)?\.pipix\.com\/api\/ad\/)|(?i:^https:\/\/api(5-lq)?\.pipix\.com\/bds\/banner\/)|(?i:^https:\/\/api(5-lq)?\.pipix\.com\/bds\/feed\/follow_feed\/)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - api.pipix.com
  - api5-lq.pipix.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api(5-lq)?\.pipix\.com\/bds\/feed\/stream\/v2\/
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data.data |= map(select(has(\"ad_info\"\
      ) | not)))\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api(5-lq)?\.pipix\.com\/bds\/user\/check_in\/
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data.profile_entrances |= map(select(.title\
      \ != \"放心借\" and .title != \"洋钱罐借款\")) | del(.data.pet_interface_message))\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
