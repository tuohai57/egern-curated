name: 两步路户外助手
description: 移除开屏广告、弹窗广告，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/2bulu.png
map_locals:
- match: (?i)^https:\/\/helper\.2bulu\.com\/search\/searchHotKeyList\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/helper\.2bulu\.com\/promote\/getAppUserModule\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/helper\.2bulu\.com\/proSpecial\/allData\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - helper.2bulu.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/helper\.2bulu\.com\/getAppEntranceConfig\?
    filter: (.configData=(.configData|fromjson|del(.adPlatform,.adIntertitialShowType,.adsConfig,.adIntertitialDisplayedLimit,.adSplashShowTypeWhenHotStart,.adIntertitialDayDisplayedMaxCount,.od_adsType,.showMeBaiHeAdView)|tojson))
