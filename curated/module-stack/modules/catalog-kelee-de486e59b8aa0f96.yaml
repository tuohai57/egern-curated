name: 汽水音乐
description: 移除开屏广告、弹窗广告、播放器推广、歌曲详情界面视频推广、播放页面的歌曲视频，精简首页和我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/SodaMusic.png
map_locals:
- match: (?i)^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/commerce\/upsells_config\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/(api|api5-lq)\.qishui\.com\/luna\/ads\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/ads\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/webcast-open\.douyin\.com\/webcast\/openapi\/feed\/\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i:^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/treasure\/entrance\/config\?)|(?i:^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/activities\?)|(?i:^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/media_ads\?)|(?i:^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/commerce\/upsells\?)|(?i:^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/commerce\/v2\/commerce_info\?)|(?i:^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/listen-video\/reminder\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
scriptings:
- http_response:
    name: 移除播放页面视频流
    match: (?i)^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/me\/recently-played-media\?
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/f7a929bfe291b2433db14a2a7ef99b38e92b1f21eaed847e05cc803269eddb93.js
    body_required: true
    update_interval: 86400
mitm:
  hostnames:
  - webcast-open.douyin.com
  - beta-luna.douyin.com
  - api.qishui.com
  - api5-lq.qishui.com
  - tnc*-*.zijieapi.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/tnc\d-(bjlgy|ali[a-z]{2})\d?\.zijieapi\.com\/get_domains\/v\d\/\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(setpath([\"data\", \"opaque_data_enabled\"\
      ]; 0) | setpath([\"data\", \"ttnet_http_dns_enabled\"]; 0) | setpath([\"data\"\
      , \"ttnet_quic_enabled\"]; 0) | setpath([\"data\", \"ttnet_tt_http_dns\"]; 0))\
      \ | (.data.ttnet_dispatch_actions |= map(select(.action != \"dispatch\" and\
      \ .action != \"tc\")))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/me\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"reward_ad_banner\"]]))\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/feed\/song-tab\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(del(.items[] | select(.type == \"\
      video_track_mix\")))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/card\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"preview_guide\"]]))\
      \ | (del(.card_items[] | select(has(\"priority_display\"))))\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/more-panel\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.blocks |= map(select(.type != \"\
      related_video\")))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
