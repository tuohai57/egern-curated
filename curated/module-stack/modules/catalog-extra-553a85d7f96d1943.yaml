name: YY语音
description: 移除开屏广告、应用内弹窗、任务推广、频道横幅推广，精简广场顶部标签。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/YYVoiceTool.png
homepage: https://hub.kelee.one
rules:
- url_regex:
    match: ^https:\/\/web\.yy\.com\/yyvoice_task_sys\/bar\.html\?
    policy: REJECT
body_rewrites:
- response_jq:
    match: ^https:\/\/yuyin-api\.baizhanlive\.com\/postsquare\/college\/page\/tabsV3\?
    filter: .data.tabList |= map(select(.code == "post" or .code == "teamup" or .code
      == "college" or .code == "aiSecretRoom"))
map_locals:
- match: ^https:\/\/yuyin-api\.baizhanlive\.com\/homepage\/flashscreen\/get\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/yuyin-api\.baizhanlive\.com\/homepage\/homepage\/banner\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/yuyin-api\.baizhanlive\.com\/search\/search\/hotword\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - yuyin-api.baizhanlive.com
  - web.yy.com
