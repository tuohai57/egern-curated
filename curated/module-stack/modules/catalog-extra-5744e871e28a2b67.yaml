name: 触站
description: 移除开屏广告、弹窗广告、各页面横幅推广，移除首页悬浮挂件。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Chuzhan.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/app\.huashi6\.com\/app\/common\/config$
    filter: '(

      (

      (

      (

      if (getpath(["data"]) | has("disableAd")) then (setpath(["data","disableAd"];
      true)) else . end

      ) | (

      if (getpath(["data"]) | has("showTopFloatAdvanceTips")) then (setpath(["data","showTopFloatAdvanceTips"];
      false)) else . end

      )

      ) | (

      delpaths([["data","adsConfigIOS"]])

      )

      ) | (

      delpaths([["data","adsConfigAndroid"]])

      )

      ) | (

      delpaths([["data","url","tabMarket"]])

      )'
- response_jq:
    match: ^https:\/\/app\.huashi6\.com\/app\/common\/layouts$
    filter: '.data |= {CZ_MINE_MENUS: .CZ_MINE_MENUS}'
- response_jq:
    match: ^https:\/\/app\.huashi6\.com\/app\/common\/themeConfig$
    filter: .data.tabbars |= map(select(.title != "商城"))
map_locals:
- match: ^https:\/\/app\.huashi6\.com\/app\/index\/ad\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/app\.huashi6\.com\/app\/works\/relative$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/app\.huashi6\.com\/app\/index\/follow\/all_random\/list$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/app\.huashi6\.com\/app\/index\/csyxh\/icon$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - app.huashi6.com
