name: 触站
description: 移除开屏广告、弹窗广告、各页面横幅推广，移除首页悬浮挂件。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Chuzhan.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/app\.huashi6\.com\/app\/common\/config$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\n(\n(\nif (getpath([\"data\"\
      ]) | has(\"disableAd\")) then (setpath([\"data\",\"disableAd\"]; true)) else\
      \ . end\n) | (\nif (getpath([\"data\"]) | has(\"showTopFloatAdvanceTips\"))\
      \ then (setpath([\"data\",\"showTopFloatAdvanceTips\"]; false)) else . end\n\
      )\n) | (\ndelpaths([[\"data\",\"adsConfigIOS\"]])\n)\n) | (\ndelpaths([[\"data\"\
      ,\"adsConfigAndroid\"]])\n)\n) | (\ndelpaths([[\"data\",\"url\",\"tabMarket\"\
      ]])\n)\n) ]) as $__egern_results\n       | if ($__egern_results | length) ==\
      \ 1\n         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: ^https:\/\/app\.huashi6\.com\/app\/common\/layouts$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data |= {CZ_MINE_MENUS: .CZ_MINE_MENUS}\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/app\.huashi6\.com\/app\/common\/themeConfig$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.tabbars |= map(select(.title\
      \ != \"商城\"))\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
map_locals:
- match: (?:^https:\/\/app\.huashi6\.com\/app\/index\/ad\/)|(?:^https:\/\/app\.huashi6\.com\/app\/works\/relative$)|(?:^https:\/\/app\.huashi6\.com\/app\/index\/follow\/all_random\/list$)|(?:^https:\/\/app\.huashi6\.com\/app\/index\/csyxh\/icon$)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - app.huashi6.com
