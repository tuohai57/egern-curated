name: 快对
description: 移除开屏广告、横幅推广，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/KuaiDuiZuoYe.png
rules:
- domain:
    match: adx.zuoyebang.com
    policy: REJECT
map_locals:
- match: (?i:^https:\/\/www\.kuaiduizuoye\.com\/init\/ad\/)|(?i:^https:\/\/www\.kuaiduizuoye\.com\/activity\/init\/checkappconfig$)|(?i:^https:\/\/www\.kuaiduizuoye\.com\/kdapi\/conf\/appbannersv3$)|(?i:^https:\/\/www\.kuaiduizuoye\.com\/kdapi\/conf\/initbanner$)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/apivip\.kuaiduizuoye\.com\/viponline\/scancode\/mycard$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - www.kuaiduizuoye.com
  - apivip.kuaiduizuoye.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/www\.kuaiduizuoye\.com\/codesearch\/aid\/home$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"homeBannerList\"\
      ]]))\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
