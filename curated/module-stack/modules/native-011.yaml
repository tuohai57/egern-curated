name: 百度网盘（可莉·适配）
description: 过滤百度网盘广告，解锁部分SVIP功能。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md], ddgksf2013[https://github.com/ddgksf2013],
  chxm1023[https://github.com/chxm1023]
homepage: https://loonlab.103516.xyz/Plugin/
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/BaiduNetDisk.png
open_url: https://apps.apple.com/app/id547166701
tag: 去广告, 解锁会员
url_rewrites: []
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/pan\.baidu\.com\/feed\/kingkongdistrict\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.data |= map(select(.type !=\
      \ \"novel\" and .type != \"shortplay\" and .type != \"print\" and .type != \"\
      job_hunt\"))\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
scriptings:
- http_response:
    name: 百度网盘-响应
    match: (?i)^https?:\/\/afd\.baidu\.com\/afd\/entry
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/2fdc54b1c7acd53df4ac5379485df8c50834859eed20a8b590de2da0df217ac6.js
    body_required: true
- http_response:
    name: 百度网盘-响应
    match: (?i:^https:\/\/pan\.baidu\.com\/feed\/cardinfos)|(?i:^https:\/\/pan\.baidu\.com\/rest\/.*\/membership\/user\?method=gamecenter)
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/2fdc54b1c7acd53df4ac5379485df8c50834859eed20a8b590de2da0df217ac6.js
    body_required: true
- http_response:
    name: 百度网盘-响应
    match: (?i)^https?:\/\/pan\.baidu\.com\/(act\/.+\/(activityentry|bchannel|cardwelfare|skin)|rest\/.+\/(membership\/user|pcs\/adv)|feed\/cardinfos|api\/(user\/getinfo|quota|loginstatus|account\/getprivilege)|buy\/ad\/conf|wap\/vip|coins\/taskcenter\/homensr)
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/0dca14782f45fef21bd1ceb07ba6e5f7a37db1c56ba75da27053dd13945d4413.js
    body_required: true
- http_request:
    name: 百度网盘-请求
    match: (?i)^https:\/\/pan\.baidu\.com\/api\/streaming\?app_id=\d+&type=M3U8_HQ_1080
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/00615ce6dfae37cdc5e55ae791c9353a3fb6f981d895a6fbd0b53caaaf129ecd.js
    body_required: true
- http_response:
    name: 百度网盘-响应
    match: (?i)^https:\/\/pan\.baidu\.com\/rest\/.*\/membership\/user
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/00615ce6dfae37cdc5e55ae791c9353a3fb6f981d895a6fbd0b53caaaf129ecd.js
    body_required: true
mitm:
  hostnames:
  - pan.baidu.com
  - afd.baidu.com
map_locals:
- match: (?i:^https:\/\/pan\.baidu\.com\/api\/getconfig\?)|(?i:^https:\/\/pan\.baidu\.com\/api\/getsyscfg\?)|(?i:^https:\/\/pan\.baidu\.com\/api\/taskscore\/tasklist\?)|(?i:^https:\/\/pan\.baidu\.com\/act\/api\/activityentry\?)|(?i:^https:\/\/pan\.baidu\.com\/rest\/\d\.\d\/pcs\/adv\?)|(?i:^https:\/\/pan\.baidu\.com\/api\/plugin\/get\?)|(?i:^https:\/\/pan\.baidu\.com\/recommend\/query\/list\?)
  status_code: 200
  body: '{}'
- match: (?i)^https?:\/\/.*baidu\.com\/rest\/.*\/membership\/proxy\/guide
  status_code: 200
  body: ''
- match: (?i:^https?:\/\/pan\.baidu\.com\/act\/v\d\/(bchannel|welfare)\/list)|(?i:^https:\/\/pan\.baidu\.com\/feed\/hotlist)
  status_code: 200
  body: ''
- match: (?i)^https?:\/\/.*zhangyuyidong\.cn\/api\/zysdk
  status_code: 200
  body: ''
- match: (?i:^https:\/\/pan\.baidu\.com\/queryintent\/queryhint)|(?i:^https:\/\/pan\.baidu\.com\/coins\/center\/notice)
  status_code: 200
  body: ''
- match: (?i)^https:\/\/pan\.baidu\.com\/recommend\/shortseries\/list
  status_code: 200
  body: '{}'
