name: 百度网页
description: 移除百度搜索移动端网页的首页广告信息流
author: Keywos[https://github.com/Keywos]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Baidu.png
scriptings:
- http_response:
    name: 移除百度搜索首页信息流广告
    match: (?i)^https?:\/\/(www|m)\.baidu\.com\/?($|\?from=\w{8,9})
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/a135cb358571270371159b1c1539e555f51c7e53d6531afc6b3687796df0b0d4.js
    body_required: true
    update_interval: 86400
mitm:
  hostnames:
  - m.baidu.com
  - www.baidu.com
