name: Tumblr
description: 移除信息流广告
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Tumblr.png
mitm:
  hostnames:
  - api-http2.tumblr.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api-http2\.tumblr\.com\/v2\/config$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"response\", \"ad_placement_configuration\"\
      ], [\"response\", \"configuration\", \"fan_placement_id\"], [\"response\", \"\
      configuration\", \"display_io_max_ad_count\"], [\"response\", \"configuration\"\
      , \"display_io_max_ad_loading_count\"], [\"response\", \"configuration\", \"\
      display_io_placement_id\"], [\"response\", \"configuration\", \"display_io_test_placement_id\"\
      ], [\"response\", \"configuration\", \"display_io_interscroller_display_test_placement_id\"\
      ], [\"response\", \"configuration\", \"display_io_interscroller_video_test_placement_id\"\
      ], [\"response\", \"configuration\", \"dfp_ad_unit_id\"], [\"response\", \"\
      configuration\", \"adx_total_queue_size\"], [\"response\", \"configuration\"\
      , \"adx_loading_queue_size\"], [\"response\", \"configuration\", \"fan_total_queue_size\"\
      ], [\"response\", \"configuration\", \"fan_loading_queue_size\"], [\"response\"\
      , \"configuration\", \"yahoo_total_queue_size\"], [\"response\", \"configuration\"\
      , \"yahoo_loading_queue_size\"], [\"response\", \"configuration\", \"min_minutes_between_sponsored_moments\"\
      ], [\"response\", \"configuration\", \"rewarded_ad_timeout_seconds\"], [\"response\"\
      , \"configuration\", \"vungle_ad_token_sync_seconds\"], [\"response\", \"configuration\"\
      , \"static_interstitial_close_button_delay_seconds\"], [\"response\", \"configuration\"\
      , \"video_interstitial_close_button_delay_seconds\"], [\"response\", \"configuration\"\
      , \"static_interstitial_bid_floor_usd\"], [\"response\", \"configuration\",\
      \ \"video_interstitial_bid_floor_usd\"]]))\n) ]) as $__egern_results\n     \
      \  | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
