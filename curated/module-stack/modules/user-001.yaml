    update_interval: 86400
- http_response:
    name: Apple地图 / 6
    match: ^https?:\/\/gspe35-ssl\.ls\.apple\.(com|cn)\/geo_manifest\/dynamic\/config
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/9643f12ba929df23ddb4b28109d5659e8240a8b9875c3d4c018e2e49c0552691.js
    body_required: true
    update_interval: 86400
