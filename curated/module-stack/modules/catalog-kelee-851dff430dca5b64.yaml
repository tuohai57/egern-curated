name: 测测
description: 移除开屏广告、活动皮肤、各类弹窗及横幅、金刚位红点文字，精简首页标签及搜索页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Cece.png
map_locals:
- match: (?i:^https:\/\/api\.cece\.com\/user\/index\/banners\?)|(?i:^https:\/\/api\.cece\.com\/ask\/ai_chat\/popup\?)|(?i:^https:\/\/api\.cece\.com\/user\/popup\/)|(?i:^https:\/\/api\.cece\.com\/chart\/easter_egg\/popup\?)|(?i:^https:\/\/api\.cece\.com\/user\/register_task\/notice_task\?)|(?i:^https:\/\/api\.cece\.com\/ask\/ask\/alert_minus\?)|(?i:^https:\/\/api\.cece\.com\/msgAsk\/question\/new_coupon_status\?)|(?i:^https:\/\/api\.cece\.com\/user\/user\/myPageBanner\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api\.cece\.com\/live\/user\/coupon_tab\?
  status_code: 200
  body: '{"code":0,"msg":""}'
  headers:
    Content-Type: application/json
- match: (?i:^https:\/\/api\.cece\.com\/live\/recommend\/new_user\?)|(?i:^https:\/\/api\.cece\.com\/chart\/tools\/get_search_recommend\?)|(?i:^https:\/\/api\.cece\.com\/user\/rank\/list\?)|(?i:^https:\/\/api\.cece\.com\/chart\/config\/chart_activity\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - api.cece.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api\.cece\.com\/user\/init\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"launch_img_url\"\
      ], [\"data\", \"launch_goto_url\"]]))\n) ]) as $__egern_results\n       | if\
      \ ($__egern_results | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.cece\.com\/common\/app\/app_config\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(setpath([\"data\", \"is_new_year\"\
      ]; false) | setpath([\"data\", \"spring_festival\"]; false) | setpath([\"data\"\
      , \"show_feedback_entry\"]; false) | setpath([\"data\", \"show_course_entry\"\
      ]; false) | setpath([\"data\", \"show_store_entry\"]; false) | setpath([\"data\"\
      , \"show_luna\"]; false) | setpath([\"data\", \"show_ead\"]; false) | setpath([\"\
      data\", \"show_ad\"]; false) | setpath([\"data\", \"show_live_filter_tarot\"\
      ]; false) | setpath([\"data\", \"community_feed_adswitch\"]; false) | setpath([\"\
      data\", \"open_screen_ad_times\"]; 0) | setpath([\"data\", \"open_screen_ad_duration\"\
      ]; 0) | setpath([\"data\", \"isShowThumbsGif\"]; false) | setpath([\"data\"\
      , \"teenager_mode_open\"]; false) | setpath([\"data\", \"flu_log\"]; false))\
      \ | (delpaths([[\"data\", \"activity_list\"], [\"data\", \"fortune_ab_config\"\
      ]]))\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.cece\.com\/chart\/tools\/home_10_tools\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data.tools |= map(del(.icon_tip_image)))\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.cece\.com\/user\/index\/tab_list\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data.tabs |= map(select(.type !=\
      \ \"shop\")))\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.cece\.com\/common\/app\/risk_entrance\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(setpath([\"data\", \"ai_fortune_show_ask_tool\"\
      ]; false) | setpath([\"data\", \"ai_sign_show_ask_tool\"]; false) | setpath([\"\
      data\", \"single_tool_show_dice_card\"]; false) | setpath([\"data\", \"single_tool_show_tarot_card\"\
      ]; false) | setpath([\"data\", \"single_tool_show_bazi_card\"]; false) | setpath([\"\
      data\", \"single_tool_show_hepan_card\"]; false) | setpath([\"data\", \"single_tool_show_ziwei_card\"\
      ]; false) | setpath([\"data\", \"single_tool_show_xingpan_card\"]; false) |\
      \ setpath([\"data\", \"multi_tool_show_card\"]; false) | setpath([\"data\",\
      \ \"ai_ccai_show_multi_tool\"]; false))\n) ]) as $__egern_results\n       |\
      \ if ($__egern_results | length) == 1\n         then $__egern_results[0] else\
      \ $__egern_original_json end)\n  catch $__egern_original_json"
