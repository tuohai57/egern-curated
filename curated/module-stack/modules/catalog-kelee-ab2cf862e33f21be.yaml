    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/read\.douban\.com\/api\/v2\/search\/hot_words$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/read\.douban\.com\/api\/v2\/search\/hot_charts$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/read\.douban\.com\/api\/v2\/search\/rec_urls$
  status_code: 200
  body: '{}'
