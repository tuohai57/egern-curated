author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/DoubanRead.png
map_locals:
- match: (?i)^https:\/\/read\.douban\.com\/api\/v2\/ads\/
