name: Bilibili增强
description: 拜托，没有广告的哔哩哔哩真的超酷的
compat_arguments:
  动态最常访问: auto
  创作中心: '0'
  过滤置顶评论广告: '1'
  空降助手: bilibili.airborne
  空降助手弹幕版: '#'
  替换鉴权字段: '#'
  Authorization: identify_v1 xxx
rules:
- domain:
    match: api.biliapi.com
    policy: REJECT
- domain:
    match: app.biliapi.com
    policy: REJECT
- domain:
    match: api.biliapi.net
    policy: REJECT
- domain:
    match: app.biliapi.net
    policy: REJECT
map_locals:
- match: ^https:\/\/ap[ip]\.bilibili\.com\/x\/(?:resource\/(?:top\/activity|patch\/tab)|v2\/search\/square|vip\/ads\/materials)\?
  status_code: 200
  body: '{"code":-404,"message":"-404","ttl":1,"data":null}'
  headers:
    content-type: application/json;
- match: ^https:\/\/api\.bilibili\.com\/pgc\/activity\/deliver\/material\/receive\?
  status_code: 200
  body: '{"code":0,"data":{"closeType":"close_win","container":[],"showTime":""},"message":"success"}'
  headers:
    content-type: application/json
    bili-status-code: '0'
- match: ^https:\/\/api\.live\.bilibili\.com\/xlive\/e-commerce-interface\/v1\/ecommerce-user\/get_shopping_info\?
  status_code: 200
  body: '{}'
  headers:
    content-type: application/json
body_rewrites:
- response_jq:
    match: ^https:\/\/api\.bilibili\.com\/pgc\/view\/v2\/app\/season\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.data.payment)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/api\.bilibili\.com\/pgc\/page\/(?:bangumi|cinema\/tab)\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.result.modules |= if . then map(if\
      \ (.style | startswith(\"tip\")) or (.module_id | IN(241, 1283, 1441, 1284))\
      \ then .items = [] elif .style | startswith(\"banner\") then .items |= if .\
      \ then map(select(.link | contains(\"play\"))) else [] end elif .style | startswith(\"\
      function\") then .items |= if . then map(select(.blink | startswith(\"bilibili\"\
      ))) else [] end end) end\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/api\.live\.bilibili\.com\/xlive\/(?:app-interface\/v2\/index\/feed|app-room\/v1\/index\/getInfoBy(?:Room|User))\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data |= (del(.play_together_info,\
      \ .play_together_info_v2, .activity_banner_info) | if .function_card then .function_card[]\
      \ = null end | if .new_tab_info.outer_list then .new_tab_info.outer_list |=\
      \ map(select(.biz_id != 33)) end | if .card_list then .card_list |= map(select(.card_type\
      \ != \"banner_v2\")) end | reduce ([[\"show_reserve_status\"], false], [[\"\
      reserve_info\", \"show_reserve_status\"], false], [[\"shopping_info\", \"is_show\"\
      ], 0]) as [$path, $value] (.; if getpath($path) then setpath($path; $value)\
      \ end))\n) ]) as $__egern_results\n       | if ($__egern_results | length) ==\
      \ 1\n         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
scriptings:
- http_response:
    name: Bilibili增强 / 3
    match: ^https:\/\/app\.bilibili\.com\/x\/(?:resource\/show\/tab\/v2|v2\/(?:splash\/(?:list|show|event\/list2)|feed\/index(?:\/story)?|account\/(?:mine(?:\/ipad)?|myinfo)))\?
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/01bf16fb4d4a30f05823bd00b5d7f52b59cb8145378b4d163e69605cd08e3357.js
    body_required: true
    update_interval: 86400
    max_size: 16777216
mitm:
  hostnames:
  - grpc.biliapi.net
  - app.bilibili.com
  - api.bilibili.com
  - api.live.bilibili.com
icon: https://raw.githubusercontent.com/lige47/lige_icon/main/icon/05icon/ad.png
