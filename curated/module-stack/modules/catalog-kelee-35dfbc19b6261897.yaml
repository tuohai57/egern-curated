name: Uki
description: 移除开屏广告、应用内悬浮窗，各类横幅、信息流广告、搜索填充词、我的页面广告。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Uki.png
map_locals:
- match: (?i)^https:\/\/api\.chenlongtech\.cn\/v\d\/friends\/startInfo$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api\.chenlongtech\.cn\/v\d\/friends\/indexBanner$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api\.chenlongtech\.cn\/v\d\/friends\/getPopup
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api\.chenlongtech\.cn\/v\d\/friends\/allPopUpConfig$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api\.chenlongtech\.cn\/v\d\/friends\/advConf$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api\.chenlongtech\.cn\/v\d\/user\/checkQTSheInsurance$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
scriptings:
- http_response:
    name: 移除匹配卡横幅
    match: (?i)^https:\/\/api\.chenlongtech\.cn\/v\d\/lover\/productList
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/af15371ec2946805b9f3f2af8a13f807434a05166e4f76178a8e28fdf645b720.js
    body_required: true
    update_interval: 86400
- http_response:
    name: 移除密友横幅
    match: (?i)^https:\/\/api\.chenlongtech\.cn\/v\d\/friends\/closeFriend\/home
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/af15371ec2946805b9f3f2af8a13f807434a05166e4f76178a8e28fdf645b720.js
    body_required: true
    update_interval: 86400
- http_response:
    name: 移除娱乐页面横幅和悬浮窗配置
    match: (?i)^https:\/\/api\.chenlongtech\.cn\/v\d\/party\/config$
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/af15371ec2946805b9f3f2af8a13f807434a05166e4f76178a8e28fdf645b720.js
    body_required: true
    update_interval: 86400
- http_response:
    name: 移除广场搜索填充词
    match: (?i)^https:\/\/api\.chenlongtech\.cn\/v1\/post\/fetchSearchRecommend$
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/af15371ec2946805b9f3f2af8a13f807434a05166e4f76178a8e28fdf645b720.js
    body_required: true
    update_interval: 86400
mitm:
  hostnames:
  - api.chenlongtech.cn
