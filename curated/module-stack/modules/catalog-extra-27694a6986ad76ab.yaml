name: 萌娘百科
description: 移除开屏广告、弹窗、首页横幅。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/MoeGirlWiki.png
homepage: https://hub.kelee.one
rules:
- url_regex:
    match: ^https:\/\/grpc\.moegirl\.org\.cn\/moegirl\.moepad\.MoepadAppMetaService\/GetAppInitialInfo$
    policy: REJECT
- url_regex:
    match: ^https:\/\/grpc\.moegirl\.org\.cn\/moegirl\.moepad\.MoepadService\/GetLaunchAdPage$
    policy: REJECT
- url_regex:
    match: ^https:\/\/grpc\.moegirl\.org\.cn\/moegirl\.moepad\.MoepadService\/GetFeedAdProbability$
    policy: REJECT
mitm:
  hostnames:
  - grpc.moegirl.org.cn
