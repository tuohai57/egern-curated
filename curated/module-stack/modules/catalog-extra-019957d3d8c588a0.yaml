- response_jq:
    match: ^https:\/\/api\.gotokeep\.com\/twins\/union\/feed\/union_feed_all$
    filter: .data.modules |= map(select(.code == "unionFeedEntry"))
- response_jq:
    match: ^https:\/\/api\.gotokeep\.com\/twins\/v4\/feed\/entryDetail\?
    filter: if (getpath([]) | has("data")) then (setpath(["data"]; {})) else . end
- response_jq:
    match: ^https:\/\/api\.gotokeep\.com\/config\/v3\/basic\?
    filter: .data.bottomBarControl.tabs |= map(select(.tabType | . == "home" or .
      == "schedule" or . == "dynamic_sports" or . == "personal")) | .data.homeTabs
      |= map(select(.type | . == "socialTab" or . == "union_feed_all" or . == "homeRecommend"
      or . == "suitTab" or . == "union_feed_route"))
- response_jq:
    match: ^https:\/\/api\.gotokeep\.com\/pencil-webapp\/play\/v1\/games\?
    filter: .data.games[].microGames[] |= if .leftIcon? and .leftIcon.type == "aiMode"
      then del(.leftIcon) else . end
