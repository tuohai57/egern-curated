name: Keep
description: 移除开屏广告、搜索推荐和弹窗广告，精简底栏和首页标签。移除关注推荐、文章相关推荐和信息流中的课程推广。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Keep.png
homepage: https://hub.kelee.one
rules:
- domain:
    match: kad.gotokeep.com
    policy: REJECT
body_rewrites:
