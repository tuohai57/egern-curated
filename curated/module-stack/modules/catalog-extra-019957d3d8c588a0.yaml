name: Keep
description: 移除开屏广告、搜索推荐和弹窗广告，精简底栏和首页标签。移除关注推荐、文章相关推荐和信息流中的课程推广。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Keep.png
homepage: https://hub.kelee.one
rules:
- domain:
    match: kad.gotokeep.com
    policy: REJECT
body_rewrites:
- response_jq:
    match: ^https:\/\/api\.gotokeep\.com\/op-engine-webapp\/v1\/configs$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\n(\n(\n(\n(\n(\n(\n(\n(\n(\n\
      (\n(\n(\n(\n(\n(\n(\n(\n(\n(\n(\n(\n(\n(\n(\n(\n(\n(\n(\n(\n(\n(\n(\n(\n(\n\
      (\n(\n(\n(\n(\ndelpaths([[\"data\",\"adTimeoutReport\"]])\n) | (\ndelpaths([[\"\
      data\",\"spotShowReport\"]])\n)\n) | (\ndelpaths([[\"data\",\"adSupplementIntervalMinutes\"\
      ]])\n)\n) | (\ndelpaths([[\"data\",\"adSupplementSwitch\"]])\n)\n) | (\ndelpaths([[\"\
      data\",\"hotFeedSpotAdRequestMoment\"]])\n)\n) | (\ndelpaths([[\"data\",\"activityBrandFeedSpotAdRequestMoment\"\
      ]])\n)\n) | (\ndelpaths([[\"data\",\"searchFeedSpotAdRequestMoment\"]])\n)\n\
      ) | (\ndelpaths([[\"data\",\"feedDetailSpotAdRequestMoment\"]])\n)\n) | (\n\
      delpaths([[\"data\",\"homePageFeedSpotAdRequestMoment\"]])\n)\n) | (\ndelpaths([[\"\
      data\",\"followFeedSpotAdRequestMoment\"]])\n)\n) | (\ndelpaths([[\"data\",\"\
      hotFeedRecommendSpotAdRequestMoment\"]])\n)\n) | (\ndelpaths([[\"data\",\"activityFeedSpotAdRequestMoment\"\
      ]])\n)\n) | (\ndelpaths([[\"data\",\"hotFeedFindSpotAdRequestMoment\"]])\n)\n\
      ) | (\ndelpaths([[\"data\",\"hotFeedSpotFixedPositionSecond\"]])\n)\n) | (\n\
      delpaths([[\"data\",\"searchFeedSpotFixedPositionSecond\"]])\n)\n) | (\ndelpaths([[\"\
      data\",\"followFeedSpotFixedPositionSecond\"]])\n)\n) | (\ndelpaths([[\"data\"\
      ,\"activityFeedSpotFixedPositionSecond\"]])\n)\n) | (\ndelpaths([[\"data\",\"\
      searchFeedSpotFixedPositionThird\"]])\n)\n) | (\ndelpaths([[\"data\",\"hotFeedFindSpotFixedPositionSecond\"\
      ]])\n)\n) | (\ndelpaths([[\"data\",\"hotFeedFindSpotFixedPositionThird\"]])\n\
      )\n) | (\ndelpaths([[\"data\",\"activityFeedSpotFixedPositionInitial\"]])\n\
      )\n) | (\ndelpaths([[\"data\",\"activityFeedSpotFixedPositionThird\"]])\n)\n\
      ) | (\ndelpaths([[\"data\",\"hotFeedDynamicSpotPosition\"]])\n)\n) | (\ndelpaths([[\"\
      data\",\"feedDetailDynamicSpotPosition\"]])\n)\n) | (\ndelpaths([[\"data\",\"\
      hotFeedRecommendDynamicSpotPosition\"]])\n)\n) | (\ndelpaths([[\"data\",\"hotFeedFindDynamicSpotPosition\"\
      ]])\n)\n) | (\ndelpaths([[\"data\",\"homePageFeedDynamicSpotPosition\"]])\n\
      )\n) | (\ndelpaths([[\"data\",\"followFeedDynamicSpotPosition\"]])\n)\n) | (\n\
      delpaths([[\"data\",\"searchFeedSpotPositionDynamic\"]])\n)\n) | (\ndelpaths([[\"\
      data\",\"activityFeedSpotPositionDynamic\"]])\n)\n) | (\ndelpaths([[\"data\"\
      ,\"activityBrandFeedSpotPositionDynamic\"]])\n)\n) | (\ndelpaths([[\"data\"\
      ,\"splashAdLoadTimeLimit\"]])\n)\n) | (\ndelpaths([[\"data\",\"courseAdLoadTimeLimit\"\
      ]])\n)\n) | (\ndelpaths([[\"data\",\"feedAdLoadTimeLimit\"]])\n)\n) | (\ndelpaths([[\"\
      data\",\"aliHCSpotConfig\"]])\n)\n) | (\ndelpaths([[\"data\",\"gdtSpotConfig\"\
      ]])\n)\n) | (\ndelpaths([[\"data\",\"pugcThresholdPercent\"]])\n)\n) | (\ndelpaths([[\"\
      data\",\"pugcStepMinSeconds\"]])\n)\n) | (\ndelpaths([[\"data\",\"pugcStepMaxSeconds\"\
      ]])\n)\n) | (\ndelpaths([[\"data\",\"pugcPreLoadEarlySeconds\"]])\n)\n) | (\n\
      delpaths([[\"data\",\"pugcLoadPostPreRolls\"]])\n)\n) | (\ndelpaths([[\"data\"\
      ,\"closeConfirmButtonText\"]])\n)\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/api\.gotokeep\.com\/twins\/union\/feed\/union_feed_all$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.modules |= map(select(.code\
      \ == \"unionFeedEntry\"))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/api\.gotokeep\.com\/twins\/v4\/feed\/entryDetail\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\nif (getpath([]) | has(\"data\")) then\
      \ (setpath([\"data\"]; {})) else . end\n) ]) as $__egern_results\n       | if\
      \ ($__egern_results | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/api\.gotokeep\.com\/config\/v3\/basic\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.bottomBarControl.tabs |= map(select(.tabType\
      \ | . == \"home\" or . == \"schedule\" or . == \"dynamic_sports\" or . == \"\
      personal\")) | .data.homeTabs |= map(select(.type | . == \"socialTab\" or .\
      \ == \"union_feed_all\" or . == \"homeRecommend\" or . == \"suitTab\" or . ==\
      \ \"union_feed_route\"))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/api\.gotokeep\.com\/pencil-webapp\/play\/v1\/games\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.games[].microGames[] |= if .leftIcon?\
      \ and .leftIcon.type == \"aiMode\" then del(.leftIcon) else . end\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
map_locals:
- match: (?:^https:\/\/api\.gotokeep\.com\/op-engine-webapp\/v1\/ad\/)|(?:^https:\/\/api\.gotokeep\.com\/search\/v6\/default\/keyword\/list\?)|(?:^https:\/\/api\.gotokeep\.com\/twins\/v4\/feed\/followPage\?)|(?:^https:\/\/api\.gotokeep\.com\/twins\/union\/feed\/function\?)|(?:^https:\/\/api\.gotokeep\.com\/guide-webapp\/v1\/popup\/getPopUp\?)|(?:^https:\/\/api\.gotokeep\.com\/search\/v5\/hotCourse\/list$)|(?:^https:\/\/api\.gotokeep\.com\/search\/v4\/hotHashtag\/list$)|(?:^https:\/\/api\.gotokeep\.com\/search\/v4\/hotword\/list\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - api.gotokeep.com
