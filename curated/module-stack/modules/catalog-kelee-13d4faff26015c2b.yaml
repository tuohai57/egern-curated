name: 好轻
description: 移除开屏广告、弹窗广告、横幅推广、商品推广，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/YunmaiScale.png
map_locals:
- match: (?i)^https:\/\/yunmai\.sfo-tx-beijing-02\.saas\.sensorsdata\.cn\/api\/v2\/sfo\/user_popup_configs\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/restapi\.iyunmai\.com\/ad-api\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/apisvr\.iyunmai\.com\/api\/ios\/first-page-module\/center_menu\.json\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/restapi\.iyunmai\.com\/api\/ios\/ad\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - yunmai.sfo-tx-beijing-02.saas.sensorsdata.cn
  - apisvr.iyunmai.com
  - restapi.iyunmai.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/apisvr\.iyunmai\.com\/api\/ios\/apps\/get-online-parameter-list\.json\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data.rows |= map(select(.name |\
      \ IN(\"AC_startTime\",\"AC_endTime\",\"AC_enable\",\"AC_url\",\"AC_challenge_tip\"\
      ,\"AC_challenge_tip_id\",\"AC_pt_tip\",\"AC_pt_tip_id\",\"AC_pt_go_tmall_jd\"\
      ,\"month7_activity\",\"AC_xmas_isOpen\",\"home_show_info\",\"new_user_credit_exchange_info\"\
      ,\"AC_share_recommendUrl\",\"AC_share_recommendUrl_2\",\"AC_share_recommendUrl_3\"\
      ) | not)))\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
