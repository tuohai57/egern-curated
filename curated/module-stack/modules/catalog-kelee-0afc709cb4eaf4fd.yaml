name: 小白智慧打印
description: 移除开屏广告、首页推广金刚位、热门内容推荐、横幅广告、搜索填充词、搜索发现，精简我的页面。账户页面错误是已知问题，无需反馈。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/XiaobaiPrint.png
rules:
- domain:
    match: ad.lovefree.cc
    policy: REJECT
- domain_suffix:
    match: adwanji.com
    policy: REJECT
map_locals:
- match: (?i)^https:\/\/epbox\.gongfudou\.com\/big_data\/v\d\/banners\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/epbox\.gongfudou\.com\/big_data\/v\d\/canvas\/query_actions\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - epbox.gongfudou.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/epbox\.gongfudou\.com\/graphql$
    filter: (delpaths([["data", "mallConsumables"], ["data", "currentUser", "goodsCoupons"]]))
      | (if .data.systemConfig.searchHotTags? then del(.data.systemConfig) else .
      end) | (if (.data.page.__typename=="Page" and .data.page.name=="场景化改版 2024")
      then .data.page.firstTabDetail.floors|=map(select(.numType=="row")) else . end)
