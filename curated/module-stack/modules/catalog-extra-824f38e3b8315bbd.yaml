name: 飞客
description: 移除开屏广告、首页广告、板块广告、帖内广告和我的页面广告。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/FlyerTea.png
homepage: https://hub.kelee.one
rules:
- url_regex:
    match: ^https:\/\/www\.flyert\.com\.cn\/api\/mobile\/index\.php\?module=advis
    policy: REJECT
map_locals:
- match: ^https:\/\/www\.flyert\.com\.cn\/api\/mobile\/index\.php\?module=vip_coupon
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/www\.flyert\.com\.cn\/api\/mobile\/index\.php\?module=getdata
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
scriptings:
- http_request:
    name: 飞客 / binary local
    match: ^https:\/\/ptf\.flyertrip\.com\/static\/img\/common\/ic_plate_mine_button\.png
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/424a885351ce40e57339692918c71935232178c4cc8b178b67b37d03b08e2059.js
    body_required: false
mitm:
  hostnames:
  - www.flyert.com.cn
  - ptf.flyertrip.com
