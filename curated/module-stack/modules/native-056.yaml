name: 铁路12306（可莉·适配）
description: 过滤12306应用内广告及开屏广告
author: RuCu6[https://github.com/RuCu6], 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/12306.png
open_url: https://apps.apple.com/app/id564818797
tag: 去广告
rules:
- domain:
    match: ad.12306.cn
    policy: DIRECT
body_rewrites:
- response_jq:
    match: (?i)^https://ad\.12306\.cn/ad/ser/getAdList(?:\?[^#]*)?$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\nif type == \"object\"\n   and ((.code\
      \ // 0) | . == 0 or . == \"0\" or . == \"00\" or . == 200 or . == \"200\")\n\
      \   and ((.status_code // 0) | . == 0 or . == \"0\" or . == 200 or . == \"200\"\
      )\nthen del(.materialsList, .advertParam) else . end\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
scriptings:
- http_request:
    name: 12306 · 推广操作
    match: (?i)^https://mobile\.12306\.cn/otsmobile/app/mgs/mgw\.htm(?:\?[^#]*)?$
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/railway-12306-native.js
    body_required: false
mitm:
  hostnames:
  - ad.12306.cn
  - mobile.12306.cn
