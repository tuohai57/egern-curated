name: 百度文库去广告
description: 移除开屏广告、横幅广告、弹窗广告、信息流推广、搜索发现、热门搜索、资料库搜索推荐，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/BaiduWenku.png
open_url: https://apps.apple.com/app/id426340811
tag: 去广告
url_rewrites: []
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/appwk\.baidu\.com\/appapi\/index\/home\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.data.bannerInfo, .data.bannerList,\
      \ .data.bannerListV2)\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/(appwk|tanbi)\.baidu\.com\/gsula\/sula\/syncmrecall$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.data.items)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/appwk\.baidu\.com\/appapi\/index\/tab\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.data)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/appwk\.baidu\.com\/appapi\/forum\/feed\?reqMode=wenkuapp_main_feed
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.data)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
mitm:
  hostnames:
  - appwk.baidu.com
  - tanbi.baidu.com
map_locals:
- match: (?i:^https:\/\/appwk\.baidu\.com\/xpage\/interface\/wknaad\?)|(?i:^https:\/\/appwk\.baidu\.com\/appapi\/search\/hot\?)|(?i:^https:\/\/appwk\.baidu\.com\/naapi\/search\/wkhotwords\?)|(?i:^https:\/\/appwk\.baidu\.com\/appapi\/task\/viptasklist\?)|(?i:^https:\/\/appwk\.baidu\.com\/activity\/interface\/wkapppopup\?)|(?i:^https:\/\/appwk\.baidu\.com\/appapi\/abg\/index\?)|(?i:^https:\/\/appwk\.baidu\.com\/naapi\/recommend\/recommenddoc\?)|(?i:^https:\/\/appwk\.baidu\.com\/naapi\/recommend\/vipdoccard\?)
  status_code: 200
  body: '{}'
