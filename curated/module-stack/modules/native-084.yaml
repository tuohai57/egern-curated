name: 淘宝闪购（奶思·适配）〔版本2〕
description: 保留奶思开屏规则并恢复原透明 GIF；补充 yfamilys 专用页面推广触发和弹窗规则。实际广告覆盖仍需设备确认。
author: 奶思
homepage: https://github.com/fmz200/wool_scripts
rules:
- domain_suffix:
    match: app-monitor.ele.me
    policy: REJECT
- domain_suffix:
    match: client-api.ele.me
    policy: REJECT
- domain_suffix:
    match: grand.ele.me
    policy: REJECT
- domain_suffix:
    match: mobile-pubt.ele.me
    policy: REJECT
- domain_suffix:
    match: newton-api.ele.me
    policy: REJECT
- url_regex:
    match: ^https?:\/\/elemecdn\.com\/.+\/sitemap
    policy: REJECT
- url_regex:
    match: ^https?:\/\/fuss10\.elemecdn\.com\/.+\/w\/640\/h\/\d{3,4}
    policy: REJECT
- url_regex:
    match: ^https?:\/\/fuss10\.elemecdn\.com\/.+\/w\/750\/h\/\d{3,4}
    policy: REJECT
- url_regex:
    match: ^https?:\/\/cube\.elemecdn\.com\/[\w\/]+\.jpeg\?x-oss-process=image\/resize,m_fill,w_1\d{3},h_2\d{3}\/format,webp\/
    policy: REJECT
- url_regex:
    match: ^https?:\/\/cube\.elemecdn\.com\/[\w\/]+\.jpeg\?x-oss-process=image\/resize,m_fill,w_6\d{2},h_8\d{2}\/format,webp\/
    policy: REJECT
- url_regex:
    match: ^https?:\/\/cube\.elemecdn\.com\/[\w\/]+\.jpeg\?x-oss-process=image\/resize,m_fill,w_\d{3},h_\d{4}\/format,webp\/
    policy: REJECT
- url_regex:
    match: ^https?:\/\/cube\.elemecdn\.com\/\w\/\w{2}\/\w+mp4\.mp4\?
    policy: REJECT
- url_regex:
    match: ^https?:\/\/www1\.elecfans\.com\/www\/delivery\/
    policy: REJECT
- url_regex:
    match: ^https?:\/\/(nr-op|cube)\.elemecdn\.com\/.+\.jpeg\?x-oss-process=image\/resize,m_fill,w_\d{4,},h_\d{4,}\/($|format,webp\/$)
    policy: REJECT
url_rewrites: []
map_locals:
- match: ^https?://waimai-guide\.ele\.me/\w+/mtop\.alsc\.eleme\.\w+\.trigger\.respond(?:/[0-9]+(?:\.[0-9]+)*/?)?(?:\?[^#]*)?$
  status_code: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body: '{}'
- match: ^https?://waimai-guide\.ele\.me/\w+/mtop\.alsc\.wamai\.store\.detail\.miniapp\.popup(?:/[0-9]+(?:\.[0-9]+)*/?)?(?:\?[^#]*)?$
  status_code: 404
  body: ''
mitm:
  hostnames:
  - elemecdn.com
  - fuss10.elemecdn.com
  - cube.elemecdn.com
  - www1.elecfans.com
  - nr-op.elemecdn.com
  - waimai-guide.ele.me
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/eleme.png
scriptings:
- http_request:
    name: 淘宝闪购 · 开屏视频透明素材
    match: ^https?:\/\/fuss10\.elemecdn\.com\/.+?\.mp4
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/static-tiny-gif-native.js
    body_required: false
