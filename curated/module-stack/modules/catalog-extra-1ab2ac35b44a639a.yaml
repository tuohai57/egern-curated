name: 下厨房
description: 移除开屏广告、页面推广及横幅，精简首页标签。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/XiaChuFang.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/api\.xiachufang\.com\/v2\/homepage\/paged_waterfall_recommendations\.json$
    filter: del(.multiplex_cells[] | select(.recommendation_cell.impression_sensor_events[]?.properties.target_type?
      == "ad"))
- response_jq:
    match: ^https:\/\/api\.xiachufang\.com\/v2\/config\/get\.json$
    filter: '(

      (

      (

      (

      (

      (

      (

      delpaths([["content","recipe_ad"]])

      ) | (

      delpaths([["content","splash_ad_req_time"]])

      )

      ) | (

      delpaths([["content","splash_sdk_ad_req_time"]])

      )

      ) | (

      delpaths([["content","splash_ad_lifecycle_interval"]])

      )

      ) | (

      delpaths([["content","waterfall_ad_feedback"]])

      )

      ) | (

      delpaths([["content","homepage_waterfall_test_ad_pos"]])

      )

      ) | (

      delpaths([["content","ad_app_look_around"]])

      )

      ) | (

      delpaths([["content","ad_sdk_text_removal_keywords"]])

      )'
- response_jq:
    match: ^https:\/\/api\.xiachufang\.com\/v2\/homepage\/ranking_list\/paged_homepage_ranking_list_section_v2\.json$
    filter: .cells |= map(del(.side_slip_activity_cell, .dish_square_cell))
map_locals:
- match: ^https:\/\/api\.xiachufang\.com\/v2\/ad\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/api\.xiachufang\.com\/v2\/account\/feeds_v7\.json
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/api\.xiachufang\.com\/v2\/homepage1810\/init_page\.json
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/api\.xiachufang\.com\/v2\/mark_mission\/get_sticker_info\.json
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - api.xiachufang.com
