name: 下厨房
description: 移除开屏广告、页面推广及横幅，精简首页标签。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/XiaChuFang.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/api\.xiachufang\.com\/v2\/homepage\/paged_waterfall_recommendations\.json$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.multiplex_cells[] | select(.recommendation_cell.impression_sensor_events[]?.properties.target_type?\
      \ == \"ad\"))\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/api\.xiachufang\.com\/v2\/config\/get\.json$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\n(\n(\n(\n(\n(\ndelpaths([[\"\
      content\",\"recipe_ad\"]])\n) | (\ndelpaths([[\"content\",\"splash_ad_req_time\"\
      ]])\n)\n) | (\ndelpaths([[\"content\",\"splash_sdk_ad_req_time\"]])\n)\n) |\
      \ (\ndelpaths([[\"content\",\"splash_ad_lifecycle_interval\"]])\n)\n) | (\n\
      delpaths([[\"content\",\"waterfall_ad_feedback\"]])\n)\n) | (\ndelpaths([[\"\
      content\",\"homepage_waterfall_test_ad_pos\"]])\n)\n) | (\ndelpaths([[\"content\"\
      ,\"ad_app_look_around\"]])\n)\n) | (\ndelpaths([[\"content\",\"ad_sdk_text_removal_keywords\"\
      ]])\n)\n) ]) as $__egern_results\n       | if ($__egern_results | length) ==\
      \ 1\n         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: ^https:\/\/api\.xiachufang\.com\/v2\/homepage\/ranking_list\/paged_homepage_ranking_list_section_v2\.json$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.cells |= map(del(.side_slip_activity_cell,\
      \ .dish_square_cell))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
map_locals:
- match: (?:^https:\/\/api\.xiachufang\.com\/v2\/ad\/)|(?:^https:\/\/api\.xiachufang\.com\/v2\/account\/feeds_v7\.json)|(?:^https:\/\/api\.xiachufang\.com\/v2\/homepage1810\/init_page\.json)|(?:^https:\/\/api\.xiachufang\.com\/v2\/mark_mission\/get_sticker_info\.json)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - api.xiachufang.com
