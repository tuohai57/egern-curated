name: 中国移动云盘
description: 移除中国移动云盘开屏广告及应用内广告，首页的多余卡片可滑到最底部自定义隐藏掉，插件对此不做处理。
author: RuCu6[https://github.com/RuCu6]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/mobileClouds.png
scriptings:
- http_response:
    name: 移除开屏广告
    match: (?i)^https:\/\/jzts\.cmpassport\.com\/personalized\/getPushContent
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/ec2ac94692a6d6ceee12251142ccf3e200a3a27f2335bd32fdc64239c395d798.js
    body_required: true
    update_interval: 86400
- http_response:
    name: 移除应用内广告
    match: (?i)^https:\/\/ad\.mcloud\.139\.com\/advertapi\/adv-filter\/
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/ec2ac94692a6d6ceee12251142ccf3e200a3a27f2335bd32fdc64239c395d798.js
    body_required: true
    update_interval: 86400
mitm:
  hostnames:
  - jzts.cmpassport.com
  - ad.mcloud.139.com
