name: Walmart
description: 移除操作引导、商品详情页用户调研、搜索填充词和搜索发现，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Walmart.png
map_locals:
- match: (?i)^https:\/\/api-hyper\.walmartmobile\.cn\/search\/ad\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api-hyper\.walmartmobile\.cn\/cms-web\/frontapi\/shadedWords\/list\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api-hyper\.walmartmobile\.cn\/search\/frontapi\/discovery-words\/list$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - api-hyper.walmartmobile.cn
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api-hyper\.walmartmobile\.cn\/cms-web\/frontapi\/common\/page\/get\?.*&type=26$
    filter: (.data |= (.moduleList | map(select(.templateCode == "nav-bar-title" or
      .templateCode == "member-info" or .templateCode == "distribution-center" or
      .templateCode == "wallet" or .templateCode == "swiper" or .templateCode == "my-order"))))
