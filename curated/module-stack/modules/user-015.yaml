name: 百度贴吧（墨鱼·适配）
author: '@app2smile, @ddgksf2013'
mitm:
  hostnames:
  - tieba.baidu.com
  - tiebac.baidu.com
rules:
- ip_cidr:
    match: 180.76.76.200/32
    policy: REJECT
body_rewrites:
- response_jq:
    match: ^https?:\/\/tieba(c)?\.baidu\.com\/c\/f\/search\/discover
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.discover_list = []\n) ]) as\
      \ $__egern_results\n       | if ($__egern_results | length) == 1\n         then\
      \ $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https?:\/\/tieba(c)?\.baidu\.com\/c\/f\/sidebar\/home
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.game_center, .tools, .vip_banner,\
      \ .task_list)\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
- response_jq:
    match: ^https?:\/\/tieba(c)?\.baidu\.com\/c\/u\/user\/profile
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.duxiaoman, .namoaixud, .namoaixud_entry,\
      \ .recom_naws_list, .duxiaoman_entry, .vip_banner) | .zone_info |= map(select(.type\
      \ == \"common_func\" or .type == \"auxiliary_func\"))\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https?:\/\/tieba(c)?\.baidu\.com\/c\/f\/forum\/forumGuide
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.hot_search = []\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https?:\/\/tieba(c)?\.baidu\.com\/mo\/q\/search\/startPage
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.data)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
map_locals:
- match: ^https?:\/\/tieba(c)?\.baidu\.com\/c\/f\/ad\/getFeedAd
  status_code: 200
  body: ''
scriptings:
- http_response:
    name: 百度贴吧 / 1
    match: ^http(s:\/\/tiebac|:\/\/c\.tieba)\.baidu\.com\/c\/f\/(frs\/(page|threadlist|generalTabList)|pb\/page|excellent\/personalized)\?cmd
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/2d57bf8c12013d35369cc406e9191dfafa9bb24aae2284d43b8ee2dc9bf69924.js
    body_required: true
    update_interval: 86400
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/BaiduTieba.png
