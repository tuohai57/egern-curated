icon: https://raw.githubusercontent.com/lige47/lige_icon/main/icon/03CNSoft/taobao.png
rules:
- domain:
    match: adashx.m.taobao.com
    policy: REJECT
- domain:
    match: ossgw.alicdn.com
    policy: REJECT
- domain:
    match: ems.youku.com
    policy: REJECT
- domain:
    match: hudong.alicdn.com
    policy: REJECT
- domain:
    match: h-adashx.ut.taobao.com
    policy: REJECT
- domain:
    match: ut.taobao.com
    policy: REJECT
map_locals:
- match: (?i:^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.fliggy\.crm\.screen\.(allresource|predict))|(?i:^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.alibaba\.advertisementservice\.getadv)|(?i:^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.alimama\.etao\.config\.query\/.+?etao_advertise)|(?i:^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.alimusic\.common\.mobileservice\.startinit)|(?i:^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.etao\.noah\.query\/.+tao_splash)|(?i:^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.film\.mtopadvertiseapi\.queryadvertise)|(?i:^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.o2o\.ad\.gateway\.get)|(?i:^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.taobao\.idle\.home\.welcome)|(?i:^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.trip\.activity\.querytmsresources)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/(?:gw|heic)\.alicdn\.com\/imgextra\/i\d\/\d*\/?[\w!]+-\d-(?:octopus|tps)-(?:1080|1125)-\d{4}\.(?:jpg|png)_(?:1\d{3}|9\d{2})x(?:\d|1\d{3}|9\d{2})q[59]0
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/guide-acs\.m\.taobao\.com\/gw\/mtop\.taobao\.(volvo\.secondfloor\.getconfig|wireless\.home\.newface\.awesome\.get)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
scriptings:
- http_response:
    name: 移除淘宝开屏广告
    match: (?i)^https:\/\/guide-acs\.m\.taobao\.com\/gw\/mtop\.taobao\.(cloudvideo\.video\.query|wireless\.home\.splash\.awesome\.get)
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/3ccb2093683d84a0085a24506fb04d3ac87713e8e1bade764711816e8908d903.js
    body_required: true
    update_interval: 86400
- http_response:
    name: 移除淘宝开屏广告
    match: (?i)^https:\/\/poplayer\.template\.alibaba\.com\/\w+\.json
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/3ccb2093683d84a0085a24506fb04d3ac87713e8e1bade764711816e8908d903.js
    body_required: true
    update_interval: 86400
mitm:
  hostnames:
  - acs.m.taobao.com
  - heic.alicdn.com
  - guide-acs.m.taobao.com
  - poplayer.template.alibaba.com
