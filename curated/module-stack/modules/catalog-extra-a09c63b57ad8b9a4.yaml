name: 中华万年历
description: 移除开屏广告、弹窗、信息流推广，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/EtouchEcalendar.png
homepage: https://hub.kelee.one
rules:
- domain:
    match: sdk.ad.sfys365.com
    policy: REJECT
body_rewrites:
- response_jq:
    match: ^https:\/\/v0-client-lz\.rili\.cn\/lizhi\/api\/zhwnl\/cal_module\/(datas|config)\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data |= map(select(.module_name as\
      \ $name | [\"实用工具\",\"会员下icon\",\"天气页面_右上角图标\",\"天气页面_24小时\",\"天气页面_15日\",\"\
      每日插屏\",\"下拉屏保\",\"星座Tab（黄历页）\"] | index($name) != null))\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^http:\/\/pc\.suishenyun\.net\/peacock\/api\/adspool\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data |= map((.layout |= map(select(.key_name\
      \ == \"实用工具\" or .key_name == \"会员下icon\" or .key_name == \"天气页面_右上角图标\" or\
      \ .key_name == \"天气页面_24小时\" or .key_name == \"天气页面_15日\" or .key_name == \"\
      每日插屏\" or .key_name == \"下拉屏保\" or .key_name == \"星座Tab（黄历页）\"))) | select(.layout\
      \ | length > 0))\n) ]) as $__egern_results\n       | if ($__egern_results |\
      \ length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
map_locals:
- match: (?:^https:\/\/client-lz\.rili\.cn\/lizhi\/api\/auth\/voice_room_entrance\/list\?)|(?:^https:\/\/client-lz\.rili\.cn\/lizhi\/api\/fortune\/question_spots\/panel\?)|(?:^https:\/\/client-lz\.rili\.cn\/lizhi\/api\/jujia\/flow\?)|(?:^https:\/\/client-lz\.rili\.cn\/lizhi\/api\/album\/hl_card\?)|(?:^https:\/\/client-lz\.rili\.cn\/lizhi\/api\/fortune\/overview\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - v0-client-lz.rili.cn
  - client-lz.rili.cn
