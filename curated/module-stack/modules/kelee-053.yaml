name: 腾讯视频
description: 过滤腾讯视频客户端广告，如遇失效，则需要重新安装腾讯视频客户端。由于此插件不再维护，客户端版本高于8.9.40可能会导致此插件失效，请勿升级客户端。
author: RuCu6[https://github.com/RuCu6]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/TencentVideo.png
rules:
- domain:
    match: adsmind.gdtimg.com
    policy: REJECT
- domain:
    match: info4.video.qq.com
    policy: REJECT
- domain:
    match: info6.video.qq.com
    policy: REJECT
- domain:
    match: ios.video.mpush.qq.com
    policy: REJECT
- domain:
    match: otheve.beacon.qq.com
    policy: REJECT
- domain:
    match: pgdt.gtimg.cn
    policy: REJECT
- domain:
    match: tpns.qq.com
    policy: REJECT
- domain:
    match: vv6.video.qq.com
    policy: REJECT
- domain_suffix:
    match: gdt.qq.com
    policy: REJECT
- domain_suffix:
    match: l.qq.com
    policy: REJECT
- domain_keyword:
    match: trace.qq.com
    policy: REJECT
- domain_keyword:
    match: trace.video.qq.com
    policy: REJECT
- ip_cidr:
    match: 47.110.187.87/32
    policy: REJECT
    no_resolve: true
- url_regex:
    match: ^http:\/\/[\d\.:]*\/?(defaultts\.tc|vmind\.qqvideo\.tc|finderpdd\.video)\.qq\.com\/\w+
    policy: REJECT
- url_regex:
    match: ^http:\/\/apd-vlive\.apdcdn\.tc\.qq\.com\/vmind\.qqvideo\.tc\.qq\.com\/\w+
    policy: REJECT
- url_regex:
    match: ^http:\/\/apd-\w+\.v\.smtcdns\.com\/(defaultts|omts|vmind\.qqvideo)\.tc\.qq\.com\/\w+
    policy: REJECT
map_locals:
- match: (?i)^https?:\/\/vv\.video\.qq\.com\/(diff|get)vmind
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
scriptings:
- http_request:
    name: 移除广告
    match: (?i)^https?:\/\/vv\.video\.qq\.com\/getvinfo
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/e2ff66894d546835f00f877534d99797a522912cc7dbf3e35e39f8f66c65129e.js
    body_required: true
    update_interval: 86400
mitm:
  hostnames:
  - vv.video.qq.com
