url_rewrites: []
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/api\/alexa\/homepage\/hub\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\ndel(.result.icon_set, .result.search_bar_hot_query,\
      \ .result.dy_module.irregular_banner_dy)\n) | (\n.result.bottom_tabs? |= map(select(.link\
      \ | IN(\"index.html\",\"chat_list.html\",\"personal.html\"))) | .result.buffer_bottom_tabs?\
      \ |= map(select(.link | IN(\"index.html\",\"chat_list.html\",\"personal.html\"\
      ))) | .result.all_top_opts = [] | .result.module_order? |= map(select(.module_name\
      \ | IN(\"irregular_banner\",\"ad_module\",\"timeline\") | not))\n)\n) ]) as\
      \ $__egern_results\n       | if ($__egern_results | length) == 1\n         then\
      \ $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/search\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.expansion)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/api\/philo\/personal\/hub\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.monthly_card_entrance, .personal_center_style_v2_vo,\
      \ .icon_set.icons, .icon_set.top_personal_icons, .title_bar_items, .personal_banner)\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/api\/oak\/integration\/render\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.bottom_section_list, .ui.bottom_section,\
      \ .ui.live_section.float_info)\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/order\/
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.marketing_banner_vo, .shipping.banner_above_recommend)\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/api\/aristotle\/order_list_v4\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.orders |= map(.order_buttons |= map(del(.order_growth_tip)))\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
