name: 华尔街见闻
description: 移除开屏广告、文末广告、信息流广告，精简底栏。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/FinanceNews.png
map_locals:
- match: (?i:^https:\/\/api-one-wscn\.awtmt\.com\/apiv1\/advertising\/)|(?i:^https:\/\/api-one-wscn\.awtmt\.com\/apiv1\/kvconfig\/items\/search_keywords_wscnvip$)|(?i:^https:\/\/api-one-wscn\.awtmt\.com\/apiv1\/search\/hotsearch\?)|(?i:^https:\/\/api-one-wscn\.awtmt\.com\/apiv1\/content\/articles\/hot\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/wallstreetcn\.com\/app-faas\/coupon\/user\/search\/popup$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i:^https:\/\/api-one-wscn\.awtmt\.com\/apiv1\/content\/lives\/relateddata\/)|(?i:^https:\/\/api-one-wscn\.awtmt\.com\/apiv1\/content\/articles\/relateddata\/)|(?i:^https:\/\/api-one-wscn\.awtmt\.com\/apiv1\/content\/carousel\/information-flow\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - api-one-wscn.awtmt.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api-one-wscn\.awtmt\.com\/apiv1\/kvconfig\/items\/tabbarconfig1$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data.items |= [.[] | select(.key\
      \ == \"news\" or .key == \"live\")])\n) ]) as $__egern_results\n       | if\
      \ ($__egern_results | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api-one-wscn\.awtmt\.com\/apiv1\/content\/articles\/
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"recommend_vip_img_uri\"\
      ]]))\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api-one-wscn\.awtmt\.com\/\/apiv1\/kvconfig\/items\/membersrights$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"vip_article\"\
      ]]))\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
