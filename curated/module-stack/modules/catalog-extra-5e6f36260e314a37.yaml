body_rewrites:
- response_jq:
    match: ^https:\/\/mcsp\.cloudpnr\.com\/api\/miniapp\/popular\/T_MINIAPP$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndelpaths([[\"data\"]])\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/saas-ad\.cloudpnr\.com\/huifuad-base-api\/api\/tactics\/ad$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\ndelpaths([[\"data\",0]])\n)\
      \ | (\ndelpaths([[\"data\",1]])\n)\n) | (\ndelpaths([[\"data\",2]])\n)\n) ])\
      \ as $__egern_results\n       | if ($__egern_results | length) == 1\n      \
      \   then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/rms\.meituan\.com\/api\/v1\/rmsmina\/c\/queryShopPortalInfo\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndelpaths([[\"data\",\"popUpWindows\"\
      ]])\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: ^https:\/\/chong\.qq\.com\/tws\/wxmobile\/GetProduct4App\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.respInfo.reserveProductList)\
      \ | .respInfo.shortcut |= map(select(.name != \"充流量\" and .name != \"领话费券\"\
      ))\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: ^https:\/\/chong\.qq\.com\/tws\/wxmobile4app\/GetSecondProduct\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.respInfo.productList) | .respInfo.shortcut\
      \ |= map(select(.name != \"充流量\" and .name != \"领话费券\"))\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/chong\.qq\.com\/tws\/usernumberinfo\/GetUserInfo\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\n(\ndelpaths([[\"data\",\"request\"\
      ,\"number\",\"markSeat\",\"servicehallOperList\"]])\n) | (\ndelpaths([[\"data\"\
      ,\"request\",\"number\",\"servicehallOperList\"]])\n)\n) | (\ndelpaths([[\"\
      data\",\"request\",\"number\",\"markSeat\",\"servicehallFuncList\"]])\n)\n)\
      \ | (\ndelpaths([[\"data\",\"request\",\"number\",\"servicehallFuncList\"]])\n\
      )\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
