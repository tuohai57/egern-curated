name: 天气预报
description: 移除开屏广告、弹窗广告、横幅广告、悬浮挂件，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/iReaderCityWeather.png
rules:
- domain:
    match: adsys.nineton.cn
    policy: REJECT
- domain:
    match: adcdn.ccqyj.com
    policy: REJECT
