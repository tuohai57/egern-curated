name: 转转
description: 移除开屏广告、应用内悬浮窗、信息流推广、商品推荐、首页弹窗，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/ZhuanZhuan.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/app\.zhuanzhuan\.com\/zz\/v2\/zzlogic\/mycontinenthomepage\?
    filter: '(

      (

      (

      delpaths([["respData","topOpera","leftOpera"]])

      ) | (

      delpaths([["respData","topOpera","rightOpera2"]])

      )

      ) | (

      delpaths([["respData","topActBanner"]])

      )

      ) | (

      delpaths([["respData","bmArea"]])

      )'
- response_jq:
    match: ^https:\/\/app\.zhuanzhuan\.com\/zzx\/transfer\/getConfigInfo\?
    filter: '(

      delpaths([["respData","freeMarketTabLeadPop"]])

      ) | (

      delpaths([["respData","topOperations"]])

      )'
- response_jq:
    match: ^https:\/\/app\.zhuanzhuan\.com\/zz\/v2\/zzinfoshow\/getfeedflowinfo\?
    filter: if .respData.userRed.campName == "OCD挂件" then del(.respData.userRed) else
      . end | .respData.infoData |= map(del(.rotateResource,.appRecommendResource,."cargoGroupCardV2"))
- response_jq:
    match: ^https:\/\/app\.zhuanzhuan\.com\/zz\/transfer\/getmymoretools$
    filter: walk(if type == "object" and .name == "免流量特权" then empty else . end) |
      del(.respData.groupList[] | select(.groupName == "活动参与" or .groupName == "金融工具"))
- response_jq:
    match: ^https:\/\/app\.zhuanzhuan\.com\/zz\/transfer\/getmyprofilev3$
    filter: '(

      delpaths([["respData","bmNewInfo"]])

      ) | (

      del(.respData.itemGroupList[].itemList[] | select(.name == "天天赚钱" or .name ==
      "借钱")) | del(.respData.itemGroupList[] | select(.groupType == 15))

      )'
map_locals:
- match: ^https:\/\/app\.zhuanzhuan\.com\/zz\/v2\/zzlogic\/getOpenScreen$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/app\.zhuanzhuan\.com\/zz\/v2\/zzinfoshow\/getwindvanecardv2$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/app\.zhuanzhuan\.com\/zzopen\/popwindow\/getallpopwin\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/app\.zhuanzhuan\.com\/zzopen\/zzbmlogic\/queryFrontPageWindowInfo\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/app\.zhuanzhuan\.com\/zzopen\/ptuserlogic\/subscribehotrecommend$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/app\.zhuanzhuan\.com\/zzopen\/ypmall\/listData$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/app\.zhuanzhuan\.com\/zz\/v2\/zzusercenter\/myprofilevariouscards$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/app\.zhuanzhuan\.com\/zzopen\/ptsimpleshow\/recommendbymyloveinfo\?
  status_code: 200
  body: '{"respCode":0,"errorMsg":"null","errMsg":""}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/app\.zhuanzhuan\.com\/zz\/v2\/zzinfoshow\/footprintsamerecommend\?
  status_code: 200
  body: '{"respCode":0,"errorMsg":"","errMsg":""}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/app\.zhuanzhuan\.com\/zz\/v2\/zzinfoshow\/getchoicegoodsinfos\?
  status_code: 200
  body: '{"respCode":0,"respData":{},"errorMsg":"","errMsg":""}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - app.zhuanzhuan.com
