name: 百度地图
description: 移除开屏广告、出行页面推广、周边页面推广、打车页面推广，精简我的页面。此插件需要IPA签名方可使用，App Store用户请勿使用此插件，务必点击下方主页链接查看详细教程。
author: 可莉🅥[https://getupnote.com/share/notes/zSn1ShBmzNYISKcTgjXE5oHMrNf2/34bf3aad-7872-497d-b239-198e27e8c84c]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/BaiduMap.png
homepage: https://getupnote.com/share/notes/zSn1ShBmzNYISKcTgjXE5oHMrNf2/34bf3aad-7872-497d-b239-198e27e8c84c
body_rewrites:
- response_jq:
    match: ^https:\/\/newclient\.map\.baidu\.com\/feed\/govui\/rich_content
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndelpaths([[\"data\"]])\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/newclient\.map\.baidu\.com\/client\/noticebar\/get\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndelpaths([[\"content\",\"multi_data\"\
      ]])\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: ^https:\/\/newclient\.map\.baidu\.com\/(client\/)?usersystem\/mine\/page\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\nif (getpath([]) | has(\"data\")) then\
      \ (setpath([\"data\"]; {})) else . end\n) ]) as $__egern_results\n       | if\
      \ ($__egern_results | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/newclient\.map\.baidu\.com\/client\/phpui2\/\?qt=ads&type=user_home_new_service
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndelpaths([[\"ads\"]])\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/newclient\.map\.baidu\.com\/living\/nearby\/api\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\n(\ndelpaths([[\"Result\",\"\
      cards\",1]])\n) | (\ndelpaths([[\"Result\",\"cards\",4]])\n)\n) | (\ndelpaths([[\"\
      Result\",\"cards\",5]])\n)\n) | (\ndelpaths([[\"Result\",\"cards\",9]])\n)\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
map_locals:
- match: ^https:\/\/afd\.baidu\.com\/afd\/entry\?action=(update|query)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: (?:^https:\/\/yongche\.baidu\.com\/gomarketing\/api\/popup\/getentrancecordovaurl$)|(?:^https:\/\/yongche\.baidu\.com\/goorder\/passenger\/cobuild\/pull\?)|(?:^https:\/\/yongche\.baidu\.com\/goorder\/passenger\/operationgirdle$)|(?:^https:\/\/yongche\.baidu\.com\/goorder\/passenger\/baseinfo$)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/ecom\.map\.baidu\.com\/ad-ops\/afd\/popup\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/maphotel\.baidu\.com\/hotel\/goextranet\/activity\/detail\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
