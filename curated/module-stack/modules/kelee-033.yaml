name: Auto_Join_TF.lpx
description: 自动监控TestFlight名额，一旦有新的名额即刻加入。
author: 奶思[https://github.com/fmz200], DecoAri[https://github.com/DecoAri], xream[https://github.com/xream]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/TestFlight.png
rules:
- domain:
    match: testflight.apple.com
    policy: 自动选择
scriptings:
- http_request:
    name: 获取账号令牌
    match: (?i)^https?:\/\/testflight\.apple\.com\/v3\/accounts\/.*\/apps$
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/91d510d7d283b3e55a7b8be3ec95433399f1c4f2802b25f4c066ae362f3032f5.js
    body_required: false
    update_interval: 86400
    disabled: true
