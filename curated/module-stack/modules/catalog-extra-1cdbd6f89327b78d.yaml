name: ZAKER
description: 移除开屏广告、置顶轮播图广告和文末广告。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/ZAKER.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/iphone\.myzaker\.com\/zaker\/article_mongo_sec\.php\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndelpaths([[\"data\",\"ad_url\"]])\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/ggs\.myzaker\.com\/zk_article_ad\.php\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\ndelpaths([[\"data\",\"article_bottom\"\
      ]])\n) | (\ndelpaths([[\"data\",\"recommend_ad\"]])\n)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/iphone\.myzaker\.com\/zaker\/follow_promote\.php\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.list |= map(select(.type !=\
      \ \"web\"))\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/iphone\.myzaker\.com\/zaker\/car_tab\/index\.php\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.gallery |= map(select(.type\
      \ != \"web\"))\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
map_locals:
- match: (?:^https:\/\/iphone\.myzaker\.com\/zaker\/cover\.php\?)|(?:^https:\/\/iphone\.myzaker\.com\/zaker\/block_top_ad\.php\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - iphone.myzaker.com
  - ggs.myzaker.com
