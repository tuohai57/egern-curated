name: SF-Express
description: 移除开屏广告、首页下拉抽屉、首页推广、应用内悬浮窗、横幅广告，移除主题，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/SF-Express.png
map_locals:
- match: (?i)^https:\/\/ccsp-egmas\.sf-express\.com\/cx-app-base\/base\/app\/ad\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/ucmp\.sf-express\.com\/proxy\/esgcempcore\/memberGoods\/pointMallService\/goodsList$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/ucmp(-static)?\.sf-express\.com\/proxy\/ccspBase\/module-config\/(login\/)?query\?
  status_code: 200
  body: '{"version":"2.0","success":true,"obj":[{"positionName":"APP2025","positionChannel":"app","sceneList":[{"urlType":"webview","sceneCode":"ddcb36295d5d2939ba4bbe2e5e02a4d8","extendField1":"{\"boundApp\":\"Android,iOS\"}","id":29130,"extendFieldOneDTO":{"boundApp":"Android,iOS"},"seq":0,"sceneName":"寄快递","updateTime":"2026-02-06
    18:55:15","url":"{ \"needLogin\": true, \"classify\": \"MY_SERVICE\", \"params\":
    { \"jumpName\": \"快速寄件\'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - ccsp-egmas.sf-express.com
  - ucmp.sf-express.com
  - ucmp-static.sf-express.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/ccsp-egmas\.sf-express\.com\/cx-app-base\/base\/app\/appHomeConfig\/query$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.obj |= map(select(.position != 2)))\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
