name: 直播吧
description: 移除信息流广告、横幅广告、弹窗广告、皮肤配置、悬浮挂件、热门搜索，移除青少年模式，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Zhibo8.png
map_locals:
- match: (?i)^https:\/\/rn\.qiumibao\.com\/news\/relation\.php$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/guess\.qiumibao\.com\/api\/c\/notice$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/guess\.qiumibao\.com\/api\/c\/pop$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/guess\.qiumibao\.com\/api\/ep\/pop$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/guess\.qiumibao\.com\/api\/c\/banner$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/search\.qiumibao\.com\/hot\/word_list$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - headline.qiumibao.com
  - a.qiumibao.com
  - rn.qiumibao.com
  - guess.qiumibao.com
  - s.qiumibao.com
  - pre-match.qiumibao.com
  - search.qiumibao.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/headline\.qiumibao\.com\/recommend\/list\?
    filter: (.news|=map(select(.model=="news" or .model=="video")))
- response_jq:
    match: (?i)^https:\/\/a\.qiumibao\.com\/found\/\?
    filter: (map(select(.is_game != true)))
- response_jq:
    match: (?i)^https:\/\/a\.qiumibao\.com\/ios\/config\/\?
    filter: (delpaths([["skin"], ["advert"], ["advert_config"], ["mall"], ["httpdns"],
      ["reward"], ["pgame"], ["corner_mark"], ["liveshop"], ["theme"], ["pop"], ["live_activity_push"]]))
      | (.all_sections.match_sections.labels |= (if . then (.blacks_disable |= if
      . then map(select(. != "游戏")) else . end) | (.show |= if . then map(select(.
      != "游戏")) else . end) else . end))
- response_jq:
    match: (?i)^https:\/\/guess\.qiumibao\.com\/api\/n\/rcd$
    filter: (delpaths([["data", "banner"]]))
- response_jq:
    match: (?i)^https:\/\/pre-match\.qiumibao\.com\/pre_match_data\/v\d\/\d+-\d+-\d+\/\d+_fund\.htm\?
    filter: (del(.data[] | select(.type == "guide")))
- response_jq:
    match: (?i)^https:\/\/guess\.qiumibao\.com\/api\/c\/menu$
    filter: (delpaths([["data", "banner"]]))
- response_jq:
    match: (?i)^https:\/\/s\.qiumibao\.com\/m\/ios\/json\/zhibo\/zuqiu\/\d+\/match\d+vl\.htm\?
    filter: (delpaths([["ep_v2"], ["ep_live"]]))
