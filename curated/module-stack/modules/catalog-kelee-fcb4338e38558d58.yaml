name: 闪动校园
description: 精简首页和底部导航
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/ShandongSchool.png
map_locals:
- match: (?i:^https:\/\/api\.huachenjie\.com\/run-front\/ad\/)|(?i:^https:\/\/api\.huachenjie\.com\/run-front\/api\/union\/ad\/)|(?i:^https:\/\/api\.huachenjie\.com\/run-front\/home\/getAdPopup$)|(?i:^https:\/\/api\.huachenjie\.com\/run-front\/street\/listRecommendBanner$)|(?i:^https:\/\/api\.huachenjie\.com\/run-front\/street\/listThemeBanner$)|(?i:^https:\/\/api\.huachenjie\.com\/run-front\/api\/home\/activityEntry$)|(?i:^https:\/\/api\.huachenjie\.com\/run-front\/home\/promoSlots\/config$)|(?i:^https:\/\/api\.huachenjie\.com\/run-front\/api\/channel\/subject\/hotspot\/rank$)|(?i:^https:\/\/api\.huachenjie\.com\/run-front\/api\/jackpot\/award\/home$)|(?i:^https:\/\/api\.huachenjie\.com\/run-front\/api\/jackpot\/award\/lotteryPage$)|(?i:^https:\/\/api\.huachenjie\.com\/run-front\/api\/jackpot\/award\/list$)|(?i:^https:\/\/api\.huachenjie\.com\/run-front\/api\/mall\/goods\/recommend\/pagePointsGoodsList$)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - api.huachenjie.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api\.huachenjie\.com\/run-front\/home\/homePage\/config$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data.functionEntries |= map(select(.name\
      \ == \"运动\" or .name == \"空间\")) | del(.data.seaview))\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.huachenjie\.com\/run-front\/api\/user\/cs\/index$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"bannerList\"\
      ]]))\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.huachenjie\.com\/run-front\/common\/bottom-bar\/redDot$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"inspiration\"\
      ]]))\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
