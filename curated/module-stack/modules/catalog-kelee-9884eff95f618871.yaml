name: 微脉圈
description: 移除开屏广告、聊天页横幅提示及发现页面的横幅广告。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Weimai.png
mitm:
  hostnames:
  - confssl*.iweimai.cn
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/confssl\d?\.iweimai\.cn\/wm_ios_update\.json\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(setpath([\"isShowCJAd\"]; 0)) | (delpaths([[\"\
      launchAd\"], [\"adBanners\"], [\"ad\"]]))\n) ]) as $__egern_results\n      \
      \ | if ($__egern_results | length) == 1\n         then $__egern_results[0] else\
      \ $__egern_original_json end)\n  catch $__egern_original_json"
