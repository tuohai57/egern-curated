name: 成分喵
description: 移除首页推广活动、广告组件请求、移除被查商品购买链接、搜索发现。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/ChengFenMiao.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/app\.chengfenmiao\.com\/helper\/setting\?
    filter: '(

      delpaths([["detail_buy_sites"]])

      ) | (

      delpaths([["bottom_sites"]])

      )'
map_locals:
- match: ^https:\/\/app\.chengfenmiao\.com\/Listing\/LiveHots\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/app\.chengfenmiao\.com\/helper\/VersionCheck\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/app\.chengfenmiao\.com\/item\/closet\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/app\.chengfenmiao\.com\/Helper\/HotWords\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - app.chengfenmiao.com
