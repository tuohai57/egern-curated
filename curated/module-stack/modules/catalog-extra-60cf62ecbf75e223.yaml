name: 成分喵
description: 移除首页推广活动、广告组件请求、移除被查商品购买链接、搜索发现。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/ChengFenMiao.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/app\.chengfenmiao\.com\/helper\/setting\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\ndelpaths([[\"detail_buy_sites\"\
      ]])\n) | (\ndelpaths([[\"bottom_sites\"]])\n)\n) ]) as $__egern_results\n  \
      \     | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
map_locals:
- match: (?:^https:\/\/app\.chengfenmiao\.com\/Listing\/LiveHots\?)|(?:^https:\/\/app\.chengfenmiao\.com\/helper\/VersionCheck\?)|(?:^https:\/\/app\.chengfenmiao\.com\/item\/closet\?)|(?:^https:\/\/app\.chengfenmiao\.com\/Helper\/HotWords\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - app.chengfenmiao.com
