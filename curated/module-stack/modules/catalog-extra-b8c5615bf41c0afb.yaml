name: IT之家
description: 过滤IT之家信息流广告和文末广告，自定义移除置顶和轮播图，自定义移除项需在插件配置。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/IThome.png
homepage: https://hub.kelee.one
compat_arguments:
  removePinnedArticles: false
  removeAllBanners: false
rules:
- url_regex:
    match: ^https?:\/\/dat\.ruanmei\.com\/ithome\/money\/acd\.json$
    policy: REJECT
mitm:
  hostnames:
  - napi.ithome.com
  - api.zuihuimai.com
  - dat.ruanmei.com
