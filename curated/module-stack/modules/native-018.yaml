name: 哔哩哔哩
description: 过滤哔哩哔哩广告
author: RuCu6[https://github.com/RuCu6], kokoryh[https://github.com/kokoryh], 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://loonlab.103516.xyz/Plugin/
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/BilibiliPink.png
open_url: https://apps.apple.com/app/id736536022
tag: 去广告
compat_arguments:
  displayUpList: auto
  purifyComment: 'true'
  sponsorBlock: 'true'
  logLevel: error
compat_arguments_desc: 'displayUpList: 可选 auto/show/hide

  purifyComment: [评论区]过滤置顶评论广告

  sponsorBlock: [空降助手]跳过视频内插播广告

  logLevel: 可选 error/warn/info/debug/off'
rules:
- domain:
    match: bsbsb.top
    policy: 自动选择
- domain:
    match: api.biliapi.com
    policy: REJECT
- domain:
    match: app.biliapi.com
    policy: REJECT
- domain:
    match: api.biliapi.net
    policy: REJECT
- domain:
    match: app.biliapi.net
    policy: REJECT
- and:
    match:
    - domain_suffix:
        match: chat.bilibili.com
    - or:
        match:
        - domain_keyword:
            match: stun
        - domain_keyword:
            match: tracker
        - domain_keyword:
            match: p2p
    policy: REJECT
- dest_port:
    match: '4480'
    policy: REJECT
- dest_port:
    match: '4483'
    policy: REJECT
- dest_port:
    match: '9102'
    policy: REJECT
- url_regex:
    match: ^http:\/\/upos-sz-static\.bilivideo\.com\/ssaxcode\/\w{2}\/\w{2}\/\w{32}-1-SPLASH
    policy: REJECT
- url_regex:
    match: ^http:\/\/[\d\.]+:8000\/v1\/resource\/\w{32}-1-SPLASH
    policy: REJECT
url_rewrites: []
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api\.live\.bilibili\.com\/xlive\/open-interface\/v2\/tracker\/conf\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.domains=[\"wss://tracker.chat.bilibili.com\"\
      ]\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.bilibili\.com\/x\/pd-proxy\/tracker\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data[][]?=\"stun.chat.bilibili.com:3478\"\
      \n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n \
      \        then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.bilibili\.com\/pgc\/view\/v2\/app\/season\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.data.payment)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.bilibili\.com\/pgc\/page\/channel\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.modules |= map(select(.type\
      \ != \"TIP\") | if .type == \"BANNER\" then .module_data.items |= map(select(.url\
      \ | startswith(\"https://www.bilibili.com/blackboard/era/\") | not)) else .\
      \ end)\n) ]) as $__egern_results\n       | if ($__egern_results | length) ==\
      \ 1\n         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/app\.bilibili\.com\/x\/resource\/show\/skin\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.data.common_equip)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/app\.bilibili\.com\/x\/v2\/splash\/(show|event\/list2)\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data |= with_entries(if .key | IN(\"\
      show\", \"event_list\") then .value = [] else . end)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/app\.bilibili\.com\/x\/v2\/feed\/index\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\nif .data.items then .data.items |=\
      \ map(select((.banner_item == null) and (.ad_info == null) and (.card_goto ==\
      \ \"av\") and (.card_type | IN(\"small_cover_v2\", \"large_cover_single_v9\"\
      , \"large_cover_v1\")))) end\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/app\.bilibili\.com\/x\/v2\/feed\/index\/story\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\nif .data.items then .data.items |=\
      \ map(select((.ad_info == null) and (.card_goto | IN(\"vertical_ad_av\", \"\
      vertical_ad_live\", \"vertical_ad_picture\") | not)) | del(.story_cart_icon,\
      \ .free_flow_toast, .image_infos, .course_info, .game_info)) end\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/app\.bilibili\.com\/x\/v2\/account\/myinfo\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.vip |= if . != null and .status\
      \ == 0 then . + { status: 1, type: 2, due_date: 9005270400000, role: 15 } else\
      \ . end\n) ]) as $__egern_results\n       | if ($__egern_results | length) ==\
      \ 1\n         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
scriptings:
- http_request:
    name: 哔哩哔哩-请求
    match: (?i:^https:\/\/(grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.community\.service\.dm\.v1\.DM\/DmSegMobile$)|(?i:^https:\/\/(grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.(app\.viewunite\.v1\.View\/View|main\.community\.reply\.v1\.Reply\/MainList)$)
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/61fc5eaded4cb28d2c21796d3fb92ae8b8c3896346bf16ad3f4f29f6e1db53d2.js
    body_required: true
- http_response:
    name: 哔哩哔哩-响应
    match: (?i)^https:\/\/(grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.(app\.(show\.v1\.Popular\/Index|dynamic\.v2\.Dynamic\/DynAll|view(unite)?\.v1\.View\/(View|ViewProgress|RelatesFeed|AIRelateAsync)|playurl\.v1\.PlayURL\/PlayView|playerunite\.v1\.Player\/PlayViewUnite)|polymer\.app\.search\.v1\.Search\/SearchAll|community\.service\.dm\.v1\.DM\/DmView|main\.community\.reply\.v1\.Reply\/MainList|pgc\.gateway\.player\.v2\.PlayURL\/PlayView)$
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/bfcc0970105056b51a02eb643931c8d4a8d9656f25a5c3f0d6fe9cf6b4d15f8e.js
    body_required: true
- http_response:
    name: 哔哩哔哩-响应
    match: (?i)^https:\/\/www\.bilibili\.com\/blackboard\/era\/.+\.html\?
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/51ac0153239c8ccfbcfa7207cdba4ad6affb6c95e4201f3d54754d17dfeb50c1.js
    body_required: true
- http_response:
    name: 哔哩哔哩-响应
    match: (?i)^https:\/\/api\.live\.bilibili\.com\/xlive\/(app-interface\/v2\/index\/feed|app-room\/v1\/index\/getInfoBy(Room|User))\?
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/09749a95e96d4b5847d5d6a07476b3ff70b3dc11d8cda2b00e80bd8681594c6e.js
    body_required: true
mitm:
  hostnames:
  - grpc.biliapi.net
  - app.bilibili.com
  - api.bilibili.com
  - api.live.bilibili.com
  - www.bilibili.com
  - line3-h5-mobile-api.biligame.com
map_locals:
