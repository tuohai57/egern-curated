name: 360智慧生活
description: 移除开屏广告、首页推广横幅、商城入口及我的页面推广。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/SafetyHome.png
homepage: https://hub.kelee.one
rules:
- domain:
    match: ad.iot.360.cn
    policy: REJECT
map_locals:
- match: ^https:\/\/app\.home\.360\.cn\/v1\/config\/custom_config
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - app.home.360.cn
