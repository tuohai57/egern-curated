name: 小红书
description: 过滤信息流推广，移除图片及视频水印，如有异常，请先清除缓存再尝试。
author: RuCu6[https://github.com/RuCu6], fmz200[https://github.com/fmz200]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/RedNote.png
rules:
- and:
    match:
    - protocol:
        match: quic
    - domain_suffix:
        match: xiaohongshu.com
    policy: REJECT
scriptings:
- http_request:
    name: 小红书 / 透明图片
    match: (?i)^https:\/\/ci\.xiaohongshu\.com\/system_config\/watermark
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/424a885351ce40e57339692918c71935232178c4cc8b178b67b37d03b08e2059.js
    body_required: false
- http_response:
    name: 移除图片和实况照片水印
    match: (?i:^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v1\/note\/(?:imagefeed|live_photo\/save))|(?i:^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v1\/system\/service\/ui\/config\?)|(?i:^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v1\/system_service\/config\?)|(?i:^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v2\/system_service\/splash_config)|(?i:^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v2\/(?:note\/widgets|user\/followings\/followfeed))|(?i:^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v4\/followfeed\?)|(?i:^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v5\/recommend\/user\/follow_recommend\?)|(?i:^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/(?:v1\/interaction\/comment\/video\/download|v5\/note\/comment\/list))|(?i:^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/(?:v2\/note\/feed|v3\/note\/videofeed))
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/f7b637c9c738b18f72dd61824e25b06dad7d55553de204daad0dddd675a74f0c.js
    body_required: true
    update_interval: 86400
- http_response:
    name: 移除信息流广告
    match: (?i)^https:\/\/(?:edith|rec)\.xiaohongshu\.com\/api\/sns\/v6\/homefeed\?
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/f7b637c9c738b18f72dd61824e25b06dad7d55553de204daad0dddd675a74f0c.js
    body_required: true
    update_interval: 86400
- http_response:
    name: 移除搜索页广告
    match: (?i)^https:\/\/(?:edith|so)\.xiaohongshu\.com\/api\/sns\/v10\/search\/notes\?
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/f7b637c9c738b18f72dd61824e25b06dad7d55553de204daad0dddd675a74f0c.js
    body_required: true
    update_interval: 86400
- http_response:
    name: 移除视频水印
    match: (?i)^https:\/\/(?:edith|rec|www)\.xiaohongshu\.com\/api\/sns\/(?:v4\/note\/videofeed|v10\/note\/video\/save)
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/f7b637c9c738b18f72dd61824e25b06dad7d55553de204daad0dddd675a74f0c.js
    body_required: true
    update_interval: 86400
map_locals:
- match: (?i)^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v1\/surprisebox\/(?:get_style|open|submit_action)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/www\.xiaohongshu\.com\/api\/marketing\/box\/trigger\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/(?:v2\/guide\/user_banner|v3\/note\/guide)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/www\.xiaohongshu\.com\/api\/sns\/(?:v1\/ads\/resource|v2\/hey\/\w+\/hey_gallery)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - ci.xiaohongshu.com
  - edith.xiaohongshu.com
  - rec.xiaohongshu.com
  - so.xiaohongshu.com
  - www.xiaohongshu.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v1\/search\/banner_list$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(setpath([\"data\"]; \"{}\"))\n) ])\
      \ as $__egern_results\n       | if ($__egern_results | length) == 1\n      \
      \   then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v1\/search\/hot_list$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(setpath([\"data\", \"items\"]; \"\
      []\"))\n) ]) as $__egern_results\n       | if ($__egern_results | length) ==\
      \ 1\n         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v4\/search\/hint
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(setpath([\"data\", \"hint_words\"\
      ]; \"[]\"))\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v4\/search\/trending\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(setpath([\"data\", \"queries\"];\
      \ \"[]\") | setpath([\"data\", \"hint_word\"]; \"{}\"))\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
