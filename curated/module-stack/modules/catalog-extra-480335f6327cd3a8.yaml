name: YouTube
mitm:
  hostnames:
  - '*.googlevideo.com'
  - www.youtube.com
  - s.youtube.com
  - youtubei.googleapis.com
url_rewrites:
- match: (^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+)
  location: $1$2$3
  status_code: 302
map_locals:
- match: ^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad
  status_code: 200
  body: ''
- match: (?:^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads)|(?:^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking))
  status_code: 200
  body: ''
- match: ^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext
  status_code: 200
  body: ''
