name: 前程无忧
description: 移除开屏广告、弹窗、信息流推广、职位页面推广和各类横幅推广。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/51Job.png
map_locals:
- match: (?i)^https:\/\/appapi\.51jobapp\.com\/api\/market\/get_launch\.php\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i:^https:\/\/cupid\.51jobapp\.com\/open\/operation\/get\/latest\/banner-list\?)|(?i:^https:\/\/cupid\.51jobapp\.com\/open\/51job-activities\/secJob\/queryHomeSecondConfigV2\?)|(?i:^https:\/\/cupid\.51jobapp\.com\/open\/noauth\/jobs\/detail\/sesame-competitive\/)|(?i:^https:\/\/cupid\.51jobapp\.com\/open\/noauth\/jobs\/job-detail\/user-rights\?)|(?i:^https:\/\/cupid\.51jobapp\.com\/open\/resume\/strategy\/resume-build\?)|(?i:^https:\/\/cupid\.51jobapp\.com\/launch-hub\/open\/noauth\/popUp\/)|(?i:^https:\/\/cupid\.51jobapp\.com\/launch-hub\/open\/noauth\/popUp\/getHomePagePopUp\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - appapi.51jobapp.com
  - cupid.51jobapp.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/cupid\.51jobapp\.com\/open\/noauth\/recommend\/job-tab-dynamic\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"resultbody\", \"adsTabFeeds\"\
      ]]))\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/cupid\.51jobapp\.com\/open\/user-task\/user\/task\/
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"resultbody\", \"availableTaskList\"\
      ]]))\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/cupid\.51jobapp\.com\/open\/tab\/good-job\/modules\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"resultbody\", \"bannerList\"\
      ]]))\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
