name: 酷安
description: 过滤酷安广告
author: RuCu6[https://github.com/RuCu6], ZenmoFeiShi[https://github.com/ZenmoFeiShi],
  VenenoSix24[https://github.com/VenenoSix24], 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://loonlab.103516.xyz/Plugin/
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/CoolApk.png
open_url: https://apps.apple.com/app/id1422581869
tag: 去广告
url_rewrites: []
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api\.coolapk\.com\/v6\/feed\/detail\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.hotReplyRows |= if . then map(select(.id?))\
      \ else . end | .data.topReplyRows |= if . then map(select(.id?)) else . end\
      \ | reduce (\"detailSponsorCard\", \"include_goods\", \"include_goods_ids\"\
      ) as $key (.; .data[$key] = [])\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.coolapk\.com\/v6\/feed\/replyList
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\nif .data? and ((.data | type) == \"\
      array\") and (.data | length > 0) then .data |= map(select(.id?)) else . end\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.coolapk\.com\/v6\/main\/dataList
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data |= (if (type==\"array\" and\
      \ length>0) then map(select((.entityTemplate!=\"sponsorCard\") and (.title!=\"\
      精选配件\"))) else . end)\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.coolapk\.com\/v6\/page\/dataList
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data |= map(select(.title != \"话题热议\"\
      \ and (.entityId != 36104 and .entityId != 24309 and .entityId != 12889 and\
      \ .entityId != 21063 and .entityId != 35730 and .entityId != 35846 and .entityId\
      \ != 28374 and .entityId != 28375 and .entityId != 27332 and .entityId != 20090\
      \ and .entityId != 28773 and .entityId != 29343 and .entityId != 21106)) | if\
      \ .entities then (.entities |= map(select(.title != \"睡个好觉需要什么？\"))) else .\
      \ end)\n) ]) as $__egern_results\n       | if ($__egern_results | length) ==\
      \ 1\n         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.coolapk\.com\/v6\/main\/indexV8
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data |= map(select((.entityId !=\
      \ 32557 and .entityId != 29349 and .entityId != 28621) and (.title | test(\"\
      值得买|红包\") | not)))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.coolapk\.com\/v6\/main\/init
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.data[]? | select(.entityId ==\
      \ 944 or .entityId == 945 or .entityId == 24455 or .entityId == 36839 or .entityId\
      \ == 1635 or .title == \"关注\")) | .data |= map(if .entities then .entities |=\
      \ map(select(.entityId != 1635 and .entityId != 2261 and .entityId != 1633 and\
      \ .entityId != 413 and .entityId != 417 and .entityId != 1754 and .entityId\
      \ != 1966 and .entityId != 2274 and .entityId != 1170 and .entityId != 1175\
      \ and .entityId != 1190 and .entityId != 2258 and .title != \"关注\")) else .\
      \ end)\n) ]) as $__egern_results\n       | if ($__egern_results | length) ==\
      \ 1\n         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.coolapk\.com\/v6\/account\/loadConfig\?key=my_page_card_config
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data |= map(select(.entityType !=\
      \ \"textLink\" and (.entityId != 1001 and .entityId != 1003 and .entityId !=\
      \ 1004 and .entityId != 1005)) | if .entities then .entities |= map(select(.entityType\
      \ != \"textLink\")) else . end)\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
scriptings:
- http_request:
    name: 酷安-请求
    match: (?i)^https:\/\/www\.coolapk\.com\/link.*
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/b4932011870422c8bc7b2d895ee3f6be44a87cbfd37b0ed2c60d8ba551523cae.js
    body_required: true
mitm:
  hostnames:
  - api.coolapk.com
  - www.coolapk.com
map_locals:
- match: (?i)^https:\/\/api\.coolapk\.com\/v6\/search\?.*type=hotSearch
  status_code: 200
  body: '{}'
