name: 网易新闻
description: 移除开屏广告、置顶新闻、热搜列表和搜索栏填充词。
author: RuCu6[https://github.com/RuCu6]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/NeteaseNews.png
homepage: https://hub.kelee.one
rules:
- domain:
    match: nex.163.com
    policy: DIRECT
- domain:
    match: gw.m.163.com
    policy: DIRECT
- url_regex:
    match: ^https?:\/\/interface\.music\.163\.com\/eapi\/ad
    policy: REJECT
- url_regex:
    match: ^https?:\/\/c\.m\.163\.com\/nc\/gl\/
    policy: REJECT
- url_regex:
    match: ^https?:\/\/client\.mail\.163\.com\/apptrack\/confinfo\/searchMultiAds
    policy: REJECT
- url_regex:
    match: ^https?:\/\/g1\.163\.com\/madfeedback
    policy: REJECT
- url_regex:
    match: ^https?:\/\/interface\.music\.163\.com\/eapi\/ad\/
    policy: REJECT
- url_regex:
    match: ^https?:\/\/support\.you\.163\.com\/xhr\/boot\/getBootMedia\.json
    policy: REJECT
- url_regex:
    match: ^https?:\/\/interface3?\.music\.163\.com/eapi/(ad|abtest|sp|hot|store|search/(specialkeyword|defaultkeyword|hot))
    policy: REJECT
mitm:
  hostnames:
  - nex.163.com
  - interface.music.163.com
  - c.m.163.com
  - client.mail.163.com
  - g1.163.com
  - support.you.163.com
  - interface3?.music.163.com
  - gw.m.163.com
