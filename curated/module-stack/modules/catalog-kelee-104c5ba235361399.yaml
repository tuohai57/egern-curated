name: 36氪
description: 移除开屏广告、首页右上角运营位、信息流广告、文末广告，移除相关文章推荐、大家都在看及皮肤配置，精简搜索页面、我的页面及底栏。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/36Kr.png
rules:
- domain:
    match: adx.36kr.com
    policy: REJECT
- domain:
    match: ad.jiemian.com
    policy: REJECT
map_locals:
- match: (?i:^https:\/\/gateway\.36kr\.com\/api\/mis\/nav\/me\/recom\?)|(?i:^https:\/\/gateway\.36kr\.com\/api\/mis\/nav\/search\/hotword\?)|(?i:^https:\/\/gateway\.36kr\.com\/api\/mis\/nav\/search\/topicListV2\?)|(?i:^https:\/\/gateway\.36kr\.com\/api\/adx\/)|(?i:^https:\/\/gateway\.36kr\.com\/api\/mis\/page\/article\/recom\?)|(?i:^https:\/\/gateway\.36kr\.com\/api\/mis\/page\/newsflash\/recom\?)|(?i:^https:\/\/gateway\.36kr\.com\/api\/mis\/sys\/skin\/)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - gateway.36kr.com
  - 36kr.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/gateway\.36kr\.com\/api\/mis\/sys\/config\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"contentConfig\"\
      ], [\"data\", \"positionConfigList\"], [\"data\", \"switchConfig\", \"ios\"\
      , \"sunrise_sign\"], [\"data\", \"switchConfig\", \"ios\", \"sunrise_sunit_task\"\
      ], [\"data\", \"switchConfig\", \"ios\", \"sunrise_sunit_mall\"], [\"data\"\
      , \"switchConfig\", \"ios\", \"sunrise_distribution_icon\"], [\"data\", \"secondFloorConfig\"\
      ]]))\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/36kr\.com\/global\/sensors\/config\/iOS\.conf\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(setpath([\"configs\", \"disableSDK\"\
      ]; true))\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/gateway\.36kr\.com\/api\/mis\/nav\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data.navList |= [ .[] | select(.navNick\
      \ == \"home\" or .navNick == \"newsflash\" or .navNick == \"me\") ])\n) ]) as\
      \ $__egern_results\n       | if ($__egern_results | length) == 1\n         then\
      \ $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/gateway\.36kr\.com\/api\/mis\/nav\/home\/subnav\/recom\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data.bannerList |= map(select(.itemType\
      \ != 0)))\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/gateway\.36kr\.com\/api\/mis\/nav\/home\/subnav\/flow\/
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"adItemList\"\
      ]]))\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
