name: 腾讯视频
description: 过滤腾讯视频客户端广告，如遇失效，则需要重新安装腾讯视频客户端。由于此插件不再维护，客户端版本高于8.9.40可能会导致此插件失效，请勿升级客户端。
author: RuCu6[https://github.com/RuCu6]
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/TencentVideo.png
homepage: https://hub.kelee.one
rules:
- domain:
    match: adsmind.gdtimg.com
    policy: REJECT
- domain:
    match: info4.video.qq.com
    policy: REJECT
- domain:
    match: info6.video.qq.com
    policy: REJECT
- domain:
    match: ios.video.mpush.qq.com
    policy: REJECT
- domain:
    match: otheve.beacon.qq.com
    policy: REJECT
- domain:
    match: pgdt.gtimg.cn
    policy: REJECT
- domain:
    match: tpns.qq.com
    policy: REJECT
- domain:
    match: vv6.video.qq.com
    policy: REJECT
- domain_suffix:
    match: gdt.qq.com
    policy: REJECT
- domain_suffix:
    match: l.qq.com
    policy: REJECT
- domain_keyword:
    match: trace.qq.com
    policy: REJECT
- domain_keyword:
    match: trace.video.qq.com
    policy: REJECT
- ip_cidr:
    match: 47.110.187.87/32
    policy: REJECT
    no_resolve: true
- url_regex:
    match: ^http:\/\/[\d\.:]*\/?(defaultts\.tc|vmind\.qqvideo\.tc|finderpdd\.video)\.qq\.com\/\w+
    policy: REJECT
- url_regex:
    match: ^http:\/\/apd-vlive\.apdcdn\.tc\.qq\.com\/vmind\.qqvideo\.tc\.qq\.com\/\w+
    policy: REJECT
- url_regex:
    match: ^http:\/\/apd-\w+\.v\.smtcdns\.com\/(defaultts|omts|vmind\.qqvideo)\.tc\.qq\.com\/\w+
    policy: REJECT
map_locals:
- match: ^https?:\/\/vv\.video\.qq\.com\/(diff|get)vmind
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
scriptings:
- http_request:
    name: 腾讯视频 / 1
    match: ^https?:\/\/vv\.video\.qq\.com\/getvinfo
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/baba46182ef0f3b8baac870f7c66469c39cb5844b5ae3c74fb72060a466b7ee6.js
    body_required: true
    update_interval: 86400
mitm:
  hostnames:
  - vv.video.qq.com
