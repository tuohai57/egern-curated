name: 航旅纵横（墨鱼·适配）
author: '@ddgksf2013'
mitm:
  hostnames:
  - sns.umetrip.com
  - appmsg.umetrip.com
  - home.umetrip.com
  - umehome.umetrip.com
  - opactivity.umetrip.com
  - activity.umetrip.com
  - umerp.umetrip.com
  - flightstatus.umetrip.com
  - umeflightstatus.umetrip.com
  - startup.umetrip.com
  - umestartup.umetrip.com
  - user.umetrip.com
  - umeuser.umetrip.com
  - event.umetrip.com
  - oss.umetrip.com
  - discardrp.umetrip.com
  - ume1.umetrip.com
scriptings:
- http_response:
    name: 航旅纵横 / 1
    match: ^https://(?:sns|appmsg|home|umehome|ume1|opactivity|activity|umerp|flightstatus|umeflightstatus|startup|umestartup|discardrp|user|umeuser|event)\.umetrip\.com/gateway/api/umetrip/native(?:\?[^#]*)?$
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/b69ecbab0d9b5384528cead14c35c66e0662ab26009b6e07e991424fcec97605.js
    body_required: true
    update_interval: 86400
    binary_body: true
- http_request:
    name: 航旅纵横 / tiny GIF
    match: ^https:\/\/oss\.umetrip\.com\/fs\/advert\/
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/static-tiny-gif-native.js
    body_required: false
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Umetrip.png
