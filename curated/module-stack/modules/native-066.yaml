name: 微信公众号去广告
description: 过滤微信公众号广告
author: RuCu6[https://github.com/RuCu6]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Weixin.png
open_url: https://apps.apple.com/app/id414478124
tag: 去广告
rules:
- domain_suffix:
    match: wxs.qq.com
    policy: REJECT
url_rewrites: []
mitm:
  hostnames:
  - mp.weixin.qq.com
map_locals:
- match: (?i)^(?!^https?:\/\/mp\.weixin\.qq\.com\/mp\/getappmsgad)(?:^https:\/\/mp\.weixin\.qq\.com\/mp\/(cps_product_info|getappmsgad|jsmonitor|masonryfeed|relatedarticle)\?)
  status_code: 200
  body: '{}'
- match: (?i)^https:\/\/mp\.weixin\.qq\.com\/mp\/relatedsearchword
  status_code: 200
  body: '{}'
