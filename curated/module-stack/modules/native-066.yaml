name: 微信公众号（独立原作者·适配）
description: 过滤微信公众号广告
author: RuCu6[https://github.com/RuCu6]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/WeChat.png
open_url: https://apps.apple.com/app/id414478124
tag: 去广告
rules:
- domain_suffix:
    match: wxs.qq.com
    policy: REJECT
url_rewrites: []
mitm:
  hostnames:
  - mp.weixin.qq.com
map_locals:
- match: (?i:^https:\/\/mp\.weixin\.qq\.com\/mp\/(cps_product_info|getappmsgad|jsmonitor|masonryfeed|relatedarticle)\?)|(?i:^https:\/\/mp\.weixin\.qq\.com\/mp\/relatedsearchword)
  status_code: 200
  body: '{}'
