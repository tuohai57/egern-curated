      "http://i0.hdslb.com/bfs/archive/a54a8009116cb896e64ef14dcf50e5cade401e00.png"     }
      ] '
- response_jq:
    match: ^https:\/\/app\.bilibili\.com\/x\/v2\/splash\/(list|show|event\/list2)\?
    filter: .data |= with_entries(if .key | IN("show", "event_list") then .value =
      [] else . end)
- response_jq:
    match: ^https:\/\/app\.bilibili\.com\/x\/v2\/feed\/index\?
    filter: if .data.items then .data.items |= map(select((.banner_item == null) and
      (.ad_info == null) and (.card_goto == "av") and (.card_type | IN("small_cover_v2",
      "large_cover_single_v9", "large_cover_v1")))) end
- response_jq:
    match: ^https:\/\/app\.bilibili\.com\/x\/v2\/feed\/index\/story\?
    filter: if .data.items then .data.items |= map(select((.ad_info == null) and (.card_goto
      | IN("vertical_ad_av", "vertical_ad_live", "vertical_ad_picture") | not)) |
      del(.story_cart_icon, .free_flow_toast, .image_infos, .course_info, .game_info))
      end
