      "\u76F4\u64ADtab",         uri: "bilibili://live/home"     },     {         pos:
      2,         id: 477,         name: "\u63A8\u8350",         tab_id: "\u63A8\u8350tab",         uri:
      "bilibili://pegasus/promo",         default_selected: 1     },     {         pos:
      3,         id: 478,         name: "\u70ED\u95E8",         tab_id: "\u70ED\u95E8tab",         uri:
      "bilibili://pegasus/hottopic"     },     {         pos: 4,         id: 3502,         name:
      "\u52A8\u753B",         tab_id: "bangumi",         uri: "bilibili://pgc/bangumi_v2"     },     {         pos:
      5,         id: 3503,         name: "\u5F71\u89C6",         tab_id: "film",         uri:
      "bilibili://pgc/cinema_v2"     } ] |  .data.top = [     {         pos: 1,         id:
      176,         name: "\u6D88\u606F",         tab_id: "\u6D88\u606FTop",         uri:
      "bilibili://link/im_home",         icon: "http://i0.hdslb.com/bfs/archive/d43047538e72c9ed8fd8e4e34415fbe3a4f632cb.png"     }
      ] |  .data.bottom = [     {         pos: 1,         id: 177,         name: "\u9996\u9875",         tab_id:
