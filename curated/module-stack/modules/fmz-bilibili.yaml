name: 哔哩哔哩
description: 某些APP要清除缓存或者重新安装拦截广告才会生效！
author: 奶思
homepage: https://github.com/fmz200/wool_scripts
compat_arguments:
  logLevel: error
  sponsorBlock: true
rules:
- domain:
    match: api.biliapi.com
    policy: REJECT
- domain:
    match: app.biliapi.com
    policy: REJECT
- domain:
    match: api.biliapi.net
    policy: REJECT
- domain:
    match: app.biliapi.net
    policy: REJECT
- and:
    match:
    - domain_suffix:
        match: chat.bilibili.com
    - or:
        match:
        - domain_keyword:
            match: stun
        - domain_keyword:
            match: tracker
    policy: REJECT
header_rewrites:
- add:
    match: ^https:\/\/grpc\.biliapi\.net\/bilibili\.app\.(interface\.v1\.(Teenagers\/ModeStatus|Search\/DefaultWords)|view\.v1\.View\/TFInfo|viewunite\.v1\.View\/ViewEndPage)$
    name: grpc-status
    value: '0'
    type: response
body_rewrites:
- response_jq:
    match: ^https:\/\/api\.bilibili\.com\/x\/pd-proxy\/tracker\?
    filter: .data[][]?="stun.chat.bilibili.com:3478"
- response_jq:
    match: ^https:\/\/api\.bilibili\.com\/pgc\/view\/v2\/app\/season\?
    filter: del(.data.payment)
- response_jq:
    match: ^https:\/\/api\.bilibili\.com\/pgc\/page\/channel\?
    filter: .data.modules |= map(select(.type != "TIP") | if .type == "BANNER" then
      .module_data.items |= map(select(.url | startswith("https://www.bilibili.com/blackboard/era/")
      | not)) else . end)
- response_jq:
    match: ^https:\/\/app\.bilibili\.com\/x\/resource\/show\/skin\?
    filter: delpaths([["data","common_equip"]])
- response_jq:
    match: ^https:\/\/app\.bilibili\.com\/x\/resource\/show\/tab\/v2\?
