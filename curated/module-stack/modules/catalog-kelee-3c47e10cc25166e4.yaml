name: 美丽修行
description: 移除开屏广告、首页广告、发现页广告、美修盒页面广告、下拉广告、弹窗广告、搜索推广、版本更新弹窗及我的页面广告。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Meizhixiuxing.png
map_locals:
- match: (?i)^https:\/\/api\.bevol\.com\/appmain\/app\/home\/launch$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api\.bevol\.com\/appmain\/app\/home\/popup$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api\.bevol\.com\/personal\/page$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api\.bevol\.com\/seach\/foundAndTopSearch$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - api.bevol.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api\.bevol\.com\/appmain\/app\/home\/page$
    filter: (delpaths([["result", "versionPopUp"], ["result", "isShowSearchLabel"],
      ["result", "isShowSearchFeedBack"], ["result", "centerBannerAdvert"], ["result",
      "programmaticAdvertising"], ["result", "mattsData"], ["result", "questionnaireMap"],
      ["result", "appPullDownAdvert"]]))
- response_jq:
    match: (?i)^https:\/\/api\.bevol\.com\/appmain\/app\/home\/feed$
    filter: (delpaths([["result", "banners"]])) | (. | .result.returnList |= (map(select(.tname
      == "userPart"))) | .result.returnList |= map(select(. | has("adId") | not)))
- response_jq:
    match: (?i)^https:\/\/api\.bevol\.com\/trialbox\/shop\/app\/homePage$
    filter: (delpaths([["result", "firstPersonActivity"], ["result", "mainActivity"],
      ["result", "brandZone"], ["result", "imageAD2"], ["result", "couponPopupInfo"]]))
