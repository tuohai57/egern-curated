name: 智联招聘
author: '@ddgksf2013'
mitm:
  hostnames:
  - cgate.zhaopin.com
rules:
- url_regex:
    match: ^https?:\/\/cgate\.zhaopin\.com\/behavior\/nps\/getNpsPopupList
    policy: REJECT
- url_regex:
    match: ^https?:\/\/cgate\.zhaopin\.com\/operation\/ad\/
    policy: REJECT
- url_regex:
    match: ^https?:\/\/cgate\.zhaopin\.com\/marketbusiness\/ad\/
    policy: REJECT
- url_regex:
    match: ^https?:\/\/223\.5\.5\.5\/resolve
    policy: REJECT
- url_regex:
    match: ^https?:\/\/cgate\.zhaopin\.com\/campusbusiness\/.*getAdvertisement
    policy: REJECT
- url_regex:
    match: ^https?:\/\/cgate\.zhaopin\.com\/bdp\/tips-calc\/getSchoolHomePageTips
    policy: REJECT
body_rewrites:
- response_jq:
    match: ^https?:\/\/cgate\.zhaopin\.com\/bdp\/my\/homepageMainModule
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.data.commercialModule, .data.commercialModuleV5,\
      \ .data.vipModule, .data.vipModuleCardNew)\n) ]) as $__egern_results\n     \
      \  | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/ZhiLianZhaoPin.png
