name: 汽水音乐
author: '@ddgksf2013'
mitm:
  hostnames:
  - beta-luna.douyin.com
  - api.qishui.com
  - tnc*-*.zijieapi.com
map_locals:
- match: ^https:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,3}\/luna\/media_ads
  status_code: 200
  body: ''
- match: ^https:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,3}\/luna\/ads
  status_code: 200
  body: ''
- match: ^https:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,3}\/location\/info
  status_code: 200
  body: ''
- match: ^https:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,3}\/luna\/commerce
  status_code: 200
  body: ''
- match: ^https:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,3}\/luna\/hashtag\/recommend
  status_code: 200
  body: ''
- match: ^https:\/\/tnc.*zijieapi\.com\/get_domains
  status_code: 200
  body: ''
body_rewrites:
- response_jq:
    match: ^https:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,3}\/luna\/me\?
    filter: del(.reward_ad_banner)
- response_jq:
    match: ^https:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,3}\/luna\/card
    filter: del(.preview_guide)
- response_jq:
    match: ^https:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,3}\/luna\/search-block
    filter: del(.search_chart_block)
- response_jq:
    match: ^https:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,3}\/luna\/activities
    filter: del(.activity_map)
- response_jq:
    match: ^https:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,3}\/luna\/feed\/song-tab
    filter: .items |= map(select(.type == "track"))
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/SodaMusic.png
