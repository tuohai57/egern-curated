name: 触站
description: 移除开屏广告、弹窗广告、各页面横幅推广，移除首页悬浮挂件。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Chuzhan.png
map_locals:
- match: (?i)^https:\/\/app\.huashi6\.com\/app\/index\/ad\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/app\.huashi6\.com\/app\/works\/relative$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/app\.huashi6\.com\/app\/index\/follow\/all_random\/list$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/app\.huashi6\.com\/app\/index\/csyxh\/icon$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - app.huashi6.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/app\.huashi6\.com\/app\/common\/config$
    filter: (setpath(["data", "disableAd"]; true) | setpath(["data", "showTopFloatAdvanceTips"];
      false)) | (delpaths([["data", "adsConfigIOS"], ["data", "adsConfigAndroid"],
      ["data", "url", "tabMarket"]]))
- response_jq:
    match: (?i)^https:\/\/app\.huashi6\.com\/app\/common\/layouts$
    filter: '(.data |= {CZ_MINE_MENUS: .CZ_MINE_MENUS})'
- response_jq:
    match: (?i)^https:\/\/app\.huashi6\.com\/app\/common\/themeConfig$
    filter: (.data.tabbars |= map(select(.title != "商城")))
