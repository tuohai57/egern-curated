name: 触站
description: 移除开屏广告、弹窗广告、各页面横幅推广，移除首页悬浮挂件。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Chuzhan.png
map_locals:
- match: (?i:^https:\/\/app\.huashi6\.com\/app\/index\/ad\/)|(?i:^https:\/\/app\.huashi6\.com\/app\/works\/relative$)|(?i:^https:\/\/app\.huashi6\.com\/app\/index\/follow\/all_random\/list$)|(?i:^https:\/\/app\.huashi6\.com\/app\/index\/csyxh\/icon$)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - app.huashi6.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/app\.huashi6\.com\/app\/common\/config$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(setpath([\"data\", \"disableAd\"\
      ]; true) | setpath([\"data\", \"showTopFloatAdvanceTips\"]; false)) | (delpaths([[\"\
      data\", \"adsConfigIOS\"], [\"data\", \"adsConfigAndroid\"], [\"data\", \"url\"\
      , \"tabMarket\"]]))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/app\.huashi6\.com\/app\/common\/layouts$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data |= {CZ_MINE_MENUS: .CZ_MINE_MENUS})\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/app\.huashi6\.com\/app\/common\/themeConfig$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data.tabbars |= map(select(.title\
      \ != \"商城\")))\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
