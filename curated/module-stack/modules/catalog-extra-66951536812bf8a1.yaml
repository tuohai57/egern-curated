name: 前程无忧
description: 移除开屏广告、弹窗、信息流推广、职位页面推广和各类横幅推广。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/51Job.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/cupid\.51jobapp\.com\/open\/noauth\/recommend\/job-tab-dynamic\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndelpaths([[\"resultbody\",\"adsTabFeeds\"\
      ]])\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: ^https:\/\/cupid\.51jobapp\.com\/open\/user-task\/user\/task\/
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndelpaths([[\"resultbody\",\"availableTaskList\"\
      ]])\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: ^https:\/\/cupid\.51jobapp\.com\/open\/tab\/good-job\/modules\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndelpaths([[\"resultbody\",\"bannerList\"\
      ]])\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
map_locals:
- match: ^https:\/\/appapi\.51jobapp\.com\/api\/market\/get_launch\.php\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: (?:^https:\/\/cupid\.51jobapp\.com\/open\/operation\/get\/latest\/banner-list\?)|(?:^https:\/\/cupid\.51jobapp\.com\/open\/51job-activities\/secJob\/queryHomeSecondConfigV2\?)|(?:^https:\/\/cupid\.51jobapp\.com\/open\/noauth\/jobs\/detail\/sesame-competitive\/)|(?:^https:\/\/cupid\.51jobapp\.com\/open\/noauth\/jobs\/job-detail\/user-rights\?)|(?:^https:\/\/cupid\.51jobapp\.com\/open\/resume\/strategy\/resume-build\?)|(?:^https:\/\/cupid\.51jobapp\.com\/launch-hub\/open\/noauth\/popUp\/)|(?:^https:\/\/cupid\.51jobapp\.com\/launch-hub\/open\/noauth\/popUp\/getHomePagePopUp\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - appapi.51jobapp.com
  - cupid.51jobapp.com
