name: 游民星空
description: 移除开屏广告、列表广告 by Sliverkiss
author: Sliverkiss
icon: https://raw.githubusercontent.com/sliverkiss/QuantumultX/main/icon/ymxk.png
body_rewrites:
- response_jq:
    match: http:\/\/.+\.gamersky.com/.+/lists/getListElements
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.listElements |= map(select(has(\"\
      adCategory\") | not))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
map_locals:
- match: ^http:\/\/.+\.gamersky\.com\/.+\/adSystem\/ad\/.+
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: https://.+\.gamersky.com/v1/statisticAd
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - '*.gamersky.com'
