name: 粉笔
description: 移除开屏广告、弹窗广告、悬浮广告、热门搜索，移除底栏皮肤，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/FenBi.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/hera-webapp\.fenbi\.com\/(iphone|ipad)\/recommend\/info\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndelpaths([[\"data\",\"rollingBanner\"\
      ]])\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: ^https:\/\/ke\.fenbi\.com\/(iphone|ipad)\/v3\/apps\/config\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\n(\ndelpaths([[\"data\",\"bottomIconInfos\"\
      ,\"position\",\"iconDefaultUrl\"]])\n) | (\ndelpaths([[\"data\",\"bottomIconInfos\"\
      ,\"position\",\"iconSelectedUrl\"]])\n)\n) | (\ndelpaths([[\"data\",\"bottomIconInfos\"\
      ,\"position\",\"nightModeIconDefaultUrl\"]])\n)\n) | (\ndelpaths([[\"data\"\
      ,\"bottomIconInfos\",\"position\",\"nightModeIconSelectedUrl\"]])\n)\n) ]) as\
      \ $__egern_results\n       | if ($__egern_results | length) == 1\n         then\
      \ $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
