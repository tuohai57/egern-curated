name: 波点音乐
description: 精简应用配置，禁用P2P传输。移除开屏广告、横幅推广、悬浮广告、歌曲广告、商城入口、搜索推广、评论区推广、试听语音提醒。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/BodianMusic.png
map_locals:
- match: (?i:^https:\/\/bd-api\.kuwo\.cn\/api\/(play|service|advert)\/advert\/)|(?i:^https:\/\/bd-api\.kuwo\.cn\/api\/service\/banner\/)|(?i:^https:\/\/bd-api\.kuwo\.cn\/api\/ucenter\/vip\/give\/config\?)|(?i:^https:\/\/bd-api\.kuwo\.cn\/api\/service\/home\/module\?.*&moduleId=6)|(?i:^https:\/\/bd-api\.kuwo\.cn\/api\/pay\/vip\/lowPriceText\?)|(?i:^https:\/\/bd-api\.kuwo\.cn\/api\/service\/global\/config\/vipEnter\?)|(?i:^https:\/\/bd-api\.kuwo\.cn\/api\/popup\/)|(?i:^https:\/\/bd-api\.kuwo\.cn\/api\/pay\/vip\/invitation\/swell\/popup\?)|(?i:^https:\/\/bd-api\.kuwo\.cn\/api\/service\/version\/popup\?)|(?i:^https:\/\/bd-api\.kuwo\.cn\/api\/pay\/vip\/invitation\/assist\/popup\?)|(?i:^https:\/\/bd-api\.kuwo\.cn\/api\/pay\/h5\/common\/popup\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - bd-api.kuwo.cn
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/bd-api\.kuwo\.cn\/api\/service\/conf\/all\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"groupSign\"\
      , \"adStartAppDialog\"], [\"data\", \"groupSign\", \"adGuideTest\"], [\"data\"\
      , \"groupSign\", \"playTips\"], [\"data\", \"groupSign\", \"adExitChange\"],\
      \ [\"data\", \"conf\", \"adGuidePopCount\"], [\"data\", \"conf\", \"adDownListOpen\"\
      ]])) | (setpath([\"data\", \"conf\", \"flowControlConfig\", \"uploadEnable\"\
      ]; false) | setpath([\"data\", \"conf\", \"flowControlConfig\", \"p2pEnable\"\
      ]; false))\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/ab-bodian\.kuwo\.cn\/abtest\/ui\/info\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"mapTestInfo\"\
      , \"CommentADPosition\"], [\"data\", \"mapTestInfo\", \"DiscoverADPosition\"\
      ], [\"data\", \"mapTestInfo\", \"DownloadAd\"], [\"data\", \"mapTestInfo\",\
      \ \"FreeModVoiceReminder\"], [\"data\", \"mapTestInfo\", \"GamesTrans\"], [\"\
      data\", \"mapTestInfo\", \"bodianmvdialog\"], [\"data\", \"mapTestInfo\", \"\
      MvTryShowAds\"], [\"data\", \"mapTestInfo\", \"insert\"]]))\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/bd-api\.kuwo\.cn\/api\/service\/global\/config\/scene\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"iosP2PCacheEnable\"\
      ], [\"data\", \"warmStartDialog\"], [\"data\", \"adsNotFinishVipPop4DayInterval\"\
      ]])) | (setpath([\"data\", \"showShopEntry\"]; false) | setpath([\"data\", \"\
      iosP2pEnableSendDataLimit\"]; 1))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/bd-api\.kuwo\.cn\/api\/search\/topic\/word\/list\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"hotTopic\"\
      ], [\"data\", \"searchFind\"], [\"data\", \"globalJumpInfo\"], [\"data\", \"\
      hotWord\"]]))\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/bd-api\.kuwo\.cn\/api\/service\/home\/index\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data.moduleList |= map(select(.type\
      \ | tostring | (. != \"8\" and . != \"1\"))))\n) ]) as $__egern_results\n  \
      \     | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/bd-api\.kuwo\.cn\/api\/service\/music\/recommendList\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data.musicList[] |= del(.showAd))\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/bd-api\.kuwo\.cn\/api\/comments\/v3\/topInfo\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"putao\"],\
      \ [\"data\", \"bannerVos\"]]))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
