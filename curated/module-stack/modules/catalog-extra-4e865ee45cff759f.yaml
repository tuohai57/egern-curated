name: 阅友
description: 移除开屏广告、弹窗广告和阅读页面广告，移除底栏福利按钮。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Yueyou.png
homepage: https://hub.kelee.one
rules:
- domain:
    match: ads.reader.yueyouxs.com
    policy: REJECT
body_rewrites:
- response_jq:
    match: ^https:\/\/goway\.reader\.yueyouxs\.com\/assemble\/app\/basic\/getAppInfo\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\n(\n(\n(\n(\n(\n(\n(\n(\n(\n\
      (\n(\n(\n(\n(\n(\n(\n(\n(\n(\n(\ndelpaths([[\"data\",\"isShowDLPopup\"]])\n\
      ) | (\ndelpaths([[\"data\",\"isShowGame\"]])\n)\n) | (\ndelpaths([[\"data\"\
      ,\"touTiaoShowDlPopup\"]])\n)\n) | (\ndelpaths([[\"data\",\"offLineDownload\"\
      ,\"WatchVideoBtnDesc\"]])\n)\n) | (\ndelpaths([[\"data\",\"readVipFirstCfg\"\
      ]])\n)\n) | (\ndelpaths([[\"data\",\"readVipNormalCfg\"]])\n)\n) | (\ndelpaths([[\"\
      data\",\"notifyAd\"]])\n)\n) | (\ndelpaths([[\"data\",\"hotStartSplashTime\"\
      ]])\n)\n) | (\ndelpaths([[\"data\",\"hotStartReqSwitch\"]])\n)\n) | (\ndelpaths([[\"\
      data\",\"isShowBFTab\"]])\n)\n) | (\ndelpaths([[\"data\",\"popReqDelayTime\"\
      ]])\n)\n) | (\ndelpaths([[\"data\",\"benefitCfg\"]])\n)\n) | (\ndelpaths([[\"\
      data\",\"chestTask\"]])\n)\n) | (\ndelpaths([[\"data\",\"hotStartAd\"]])\n)\n\
      ) | (\ndelpaths([[\"data\",\"activeTagList\"]])\n)\n) | (\ndelpaths([[\"data\"\
      ,\"secondOrderCfg\"]])\n)\n) | (\ndelpaths([[\"data\",\"secondOrderList\"]])\n\
      )\n) | (\ndelpaths([[\"data\",\"blockedWordsCfg\"]])\n)\n) | (\ndelpaths([[\"\
      data\",\"aaReportListCfg\"]])\n)\n) | (\ndelpaths([[\"data\",\"pddAdSwitch\"\
      ]])\n)\n) | (\ndelpaths([[\"data\",\"isShowShelfAuthPopup\"]])\n)\n) | (\ndelpaths([[\"\
      data\",\"firstPopUpAmount\"]])\n)\n) | (\nif (getpath([\"data\"]) | has(\"isAdClosed\"\
      )) then (setpath([\"data\",\"isAdClosed\"]; true)) else . end\n)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
mitm:
  hostnames:
  - goway.reader.yueyouxs.com
