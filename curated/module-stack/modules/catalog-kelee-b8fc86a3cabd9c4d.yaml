body_rewrites:
- response_jq:
    match: (?i)^https:\/\/gw-cn\.jiaoliuqu\.com\/mp-dolphin\/v\d\/rec\/recByPositions\?
    filter: (.info.data |= map(if .materials and (.materials | type) == "array" then
      .materials |= map(select(has("adPosition") | not)) else . end)) | (.info.data
      |= map(if .materials and (.materials | type) == "array" then .materials |= map(select((keys
      | length) != 2 or (keys | sort) != ["link", "pic"])) else . end))
- response_jq:
    match: (?i)^https:\/\/gw-cn\.jiaoliuqu\.com\/bbs\/v5\/Home\/getHomePageModulesBySortV\d\?
    filter: ((.info.data.modules_list // []) |= [.[] | [.[] | del(.relaction_title,
