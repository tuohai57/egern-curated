body_rewrites:
- response_jq:
    match: (?i)^https:\/\/gw-cn\.jiaoliuqu\.com\/mp-dolphin\/v\d\/rec\/recByPositions\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.info.data |= map(if .materials and\
      \ (.materials | type) == \"array\" then .materials |= map(select(has(\"adPosition\"\
      ) | not)) else . end)) | (.info.data |= map(if .materials and (.materials |\
      \ type) == \"array\" then .materials |= map(select((keys | length) != 2 or (keys\
      \ | sort) != [\"link\", \"pic\"])) else . end))\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/gw-cn\.jiaoliuqu\.com\/bbs\/v5\/Home\/getHomePageModulesBySortV\d\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n((.info.data.modules_list // []) |=\
      \ [.[] | [.[] | del(.relaction_title, .scrollow_contents)]] | (.info.data.top_fix_list\
      \ // []) |= [.[] | del(.subtitle_list)])\n) ]) as $__egern_results\n       |\
      \ if ($__egern_results | length) == 1\n         then $__egern_results[0] else\
      \ $__egern_original_json end)\n  catch $__egern_original_json"
