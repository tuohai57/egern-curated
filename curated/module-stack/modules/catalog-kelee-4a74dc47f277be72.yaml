mitm:
  hostnames:
  - m.pvp.xoyo.com
body_rewrites:
- response_jq:
    match: (?i)^https?:\/\/m\.pvp\.xoyo\.com\/conf\/server-mapping$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"splashConf\"\
      ], [\"data\", \"splashConfNew\"]]))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
