name: 酷狗概念版
description: 移除广告服务模块、播放器广告，精简乐库及搜索页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/KuGouYouth.png
map_locals:
- match: (?i)^https:\/\/gateway\.kugou\.com\/ads\.service\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/gateway\.kugou\.com\/youth\/v1\/start_img\/last\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/gateway\.kugou\.com\/ads\.gateway\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^http:\/\/mobilelog\.kugou\.com\/adtrackconfig\.json$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/gateway\.kugou\.com\/youth\/v1\/experiment\/get_params\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/gateway\.kugou\.com\/youth\/api\/user\/v1\/init\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/gateway\.kugou\.com\/youth\/v2\/activity\/task_list\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/gateway\.kugou\.com\/youth\/v1\/channel\/tab_list\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/gateway\.kugou\.com\/goddess\/v1\/content\/biz_list\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - gateway.kugou.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/gateway\.kugou\.com\/youth\/v1\/yueku\/tab\?
    filter: (.data.responses |= map(select(.module == "new_song_publish" or .module
      == "song_rank")))
