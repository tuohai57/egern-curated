name: 360摄像机
description: 移除开屏广告、首页推广、底栏商城入口及我的页面推广。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/360SmartCamera.png
homepage: https://hub.kelee.one
rules:
- domain:
    match: ad.jia.360.cn
    policy: REJECT
- domain:
    match: ad.iot.360.cn
    policy: REJECT
body_rewrites:
- response_jq:
    match: ^https:\/\/jia\.360\.cn\/conf\/v1\.json
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\ndelpaths([[\"tab_conf\"]])\n\
      ) | (\ndelpaths([[\"ad_conf\"]])\n)\n) | (\ndelpaths([[\"activity\"]])\n)\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
mitm:
  hostnames:
  - jia.360.cn
