name: 芒果TV
description: 移除开屏广告、信息流广告、播放页广告，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md], RuCu6[https://github.com/RuCu6]
icon: https://raw.githubusercontent.com/lige47/lige_icon/main/icon/03CNSoft/mangguotv.png
homepage: https://hub.kelee.one
rules:
- domain:
    match: credits.bz.mgtv.com
    policy: REJECT
- domain:
    match: credits2.bz.mgtv.com
    policy: REJECT
- domain:
    match: credits3.bz.mgtv.com
    policy: REJECT
- domain:
    match: dflow.bz.mgtv.com
    policy: REJECT
- domain:
    match: encounter.bz.mgtv.com
    policy: REJECT
- domain:
    match: floor.bz.mgtv.com
    policy: REJECT
- domain:
    match: layer.bz.mgtv.com
    policy: REJECT
- domain:
    match: mob.bz.mgtv.com
    policy: REJECT
- domain:
    match: rc-topic-api.bz.mgtv.com
    policy: REJECT
- domain:
    match: rprain.bz.mgtv.com
    policy: REJECT
- domain:
    match: rprain.log.mgtv.com
    policy: REJECT
- domain:
    match: vip.bz.mgtv.com
    policy: REJECT
- domain_suffix:
    match: da.mgtv.com
    policy: REJECT
body_rewrites:
- response_jq:
    match: ^https?:\/\/mobile\.api\.(mgtv|hunantv)\.com\/mobile\/config\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\n(\n(\n(\n(\n(\n(\n(\n(\n(\n\
      (\nif (getpath([\"data\"]) | has(\"dc_adConfig\")) then (setpath([\"data\",\"\
      dc_adConfig\"]; 0)) else . end\n) | (\nif (getpath([\"data\"]) | has(\"XmsellSwitch\"\
      )) then (setpath([\"data\",\"XmsellSwitch\"]; 0)) else . end\n)\n) | (\nif (getpath([\"\
      data\"]) | has(\"screenshot_share_switch\")) then (setpath([\"data\",\"screenshot_share_switch\"\
      ]; 0)) else . end\n)\n) | (\nif (getpath([\"data\"]) | has(\"playerUseHttpDNS\"\
      )) then (setpath([\"data\",\"playerUseHttpDNS\"]; 0)) else . end\n)\n) | (\n\
      if (getpath([\"data\"]) | has(\"damang_tab\")) then (setpath([\"data\",\"damang_tab\"\
      ]; 0)) else . end\n)\n) | (\nif (getpath([\"data\"]) | has(\"relative_ads\"\
      )) then (setpath([\"data\",\"relative_ads\"]; 0)) else . end\n)\n) | (\nif (getpath([\"\
      data\"]) | has(\"second_floor_guide_switch\")) then (setpath([\"data\",\"second_floor_guide_switch\"\
      ]; 0)) else . end\n)\n) | (\nif (getpath([\"data\"]) | has(\"progress_bar_ad_switch\"\
      )) then (setpath([\"data\",\"progress_bar_ad_switch\"]; 0)) else . end\n)\n\
      ) | (\nif (getpath([\"data\"]) | has(\"XmVideoB\")) then (setpath([\"data\"\
      ,\"XmVideoB\"]; 0)) else . end\n)\n) | (\nif (getpath([\"data\"]) | has(\"damang_duanju_tab\"\
      )) then (setpath([\"data\",\"damang_duanju_tab\"]; 0)) else . end\n)\n) | (\n\
      if (getpath([\"data\"]) | has(\"playview_box_ad_switch\")) then (setpath([\"\
      data\",\"playview_box_ad_switch\"]; 0)) else . end\n)\n) | (\nif (getpath([\"\
      data\"]) | has(\"topBarSwitch\")) then (setpath([\"data\",\"topBarSwitch\"];\
      \ 0)) else . end\n)\n) | (\nif (getpath([\"data\"]) | has(\"VIPSDKB2\")) then\
      \ (setpath([\"data\",\"VIPSDKB2\"]; 0)) else . end\n)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/me\.bz\.mgtv\.com\/v3\/module\/list\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.list |= map(select(.id | IN(1,\
      \ 2, 4, 7))) | .data.list |= map(if .moduleType == 2 then .data |= map(select(.moduleType\
      \ == 11)) elif .moduleType == 4 then .data |= map(select(.moduleType == 14 or\
      \ .moduleType == 23)) elif .moduleType == 7 then .data |= map(select(.moduleType\
      \ == 16 and .title != \"音乐广场\")) else . end)\n) ]) as $__egern_results\n   \
      \    | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/me\.bz\.mgtv\.com\/v4\/module\/list\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.list |= (map(select(.id != 3\
      \ and .id != 7))|map(if .id==2 then .data|=map(select(.id!=65))elif .id==4 then\
      \ .data|=map(select(.title!=\"追更banner\" and .id!=57))elif .id==5 then .data|=(map(select(.id==9\
      \ or .id==13))|map(if .id==9 then .list|=map(select(.id==20 or .id==60 or .id==18))\
      \ else . end))elif .id==6 then .data|=map(select(.id==15)) else . end))\n) ])\
      \ as $__egern_results\n       | if ($__egern_results | length) == 1\n      \
      \   then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https?:\/\/dc\d?\.bz\.mgtv\.com\/dynamic\/v\d\/channel\/index\/\w
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\ndelpaths([[\"adInfo\"]])\n) | (\n\
      .data |= map(select(.moduleEntityId != \"10579\" and .moduleEntityId != \"9686\"\
      )) | .moduleIDS |= map(select(.moduleEntityId != \"10579\" and .moduleEntityId\
      \ != \"9686\"))\n)\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/mobile-thor\.api\.mgtv\.com\/v\d+\/vod\/info\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\n(\n(\ndelpaths([[\"data\",\"\
      config\",\"ad\"]])\n) | (\ndelpaths([[\"data\",\"config\",\"vipNav\"]])\n)\n\
      ) | (\ndelpaths([[\"data\",\"template\",\"skinList\"]])\n)\n) | (\ndelpaths([[\"\
      data\",\"template\",\"theme\"]])\n)\n) | (\n.data.tabs |= map(select(.name ==\
      \ \"视频\" or .name == \"讨论\")) | .data.template.modules |= map(if .clipInfo.ext?.ipPublishEntrance\
      \ then .clipInfo |= del(.ext) else . end) | .data.template.modules |= map(select(.dataType\
      \ == 101 or .dataType == 201)) | .data.template.modules |= map(.media.list |=\
      \ (if type == \"array\" then map(select(.type != 0)) else . end))\n)\n) ]) as\
      \ $__egern_results\n       | if ($__egern_results | length) == 1\n         then\
      \ $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/comment\.mgtv\.com\/v\d\/comment\/getCommentList\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.list |= map(select(.type ==\
      \ 0))\n) ]) as $__egern_results\n       | if ($__egern_results | length) ==\
      \ 1\n         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
map_locals:
- match: (?:^https:\/\/dc\.bz\.mgtv\.com\/dynamic\/v\d\/skin\/config\?)|(?:^https:\/\/dc\.bz\.mgtv\.com\/dynamic\/v\d\/channel\/ads\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^http:\/\/mobileso\.bz\.mgtv\.com\/spotlight\/search\/v\d\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/damang\.api\.mgtv\.com\/station\/album\/red\/dot\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/hb-boom\.api\.mgtv\.com\/release\/pullReleaseInfo$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/mobile\.api\.mgtv\.com\/v\d\/mobile\/checkUpdate\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https?:\/\/mobileso\.bz\.mgtv\.com\/mobile\/recommend\/v\d\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
