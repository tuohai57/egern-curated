name: Sub-Store
description: '同步配置的定时 cronexp: 55 23 * * *'
icon: https://raw.githubusercontent.com/cc63/ICON/main/Sub-Store.png
compat_arguments:
  cronexp: 55 23 * * *
  sync: Sub-Store Sync
  sync_disabled: false
  produce: Sub-Store Produce
  produce_disabled: true
  produce_cronexp: 50 */6 * * *
  sync_success_notify: true
  produce_sub: sub1,sub2
  produce_col: col1,col2
  cors: https://sub-store.vercel.app,http://substore.stash,https://substore.stash
compat_arguments_desc: '脚本超时(Egern 有问题, 不支持自定义, 本文件中固定为 900 秒)


  1️⃣ cors


  允许浏览器跨域访问 Sub-Store 后端的 origin.

  默认为 https://sub-store.vercel.app,http://substore.stash,https://substore.stash.

  多个用 , 连接.


  设为 * 可恢复旧的任意来源访问行为, 存在钓鱼网站读取配置的风险


  2️⃣ cronexp


  同步配置定时任务

  默认为每天 23 点 55 分


  定时任务指定时将订阅/文件上传到私有 Gist. 在前端, 叫做 "同步" 或 "同步配置"


  3️⃣ sync / sync_disabled


  自定义定时任务名

  便于在脚本编辑器中选择

  sync 仅设置任务名, 设为 # 不会禁用任务

  sync_disabled 默认为 false; 设为 true 可禁用同步配置定时任务


  4️⃣ produce / produce_disabled


  自定义处理订阅的定时任务名

  一般用于定时处理耗时较长的订阅, 以更新缓存

  这样客户端拉取的时候就能用到缓存, 不至于总是超时

  produce 仅设置任务名, 设为 # 不会禁用任务

  produce_disabled 默认为 true (禁用); 设为 false 可开启此定时任务


  5️⃣ produce_cronexp


  配置处理订阅的定时任务


  默认为每 6 小时


  6️⃣ sync_success_notify


  同步配置全部成功时是否发送完成通知

  默认为 true, 填 false/0/no/off 可关闭


  7️⃣ produce_sub


  自定义需定时处理的单条订阅名

  多个用 , 连接


  8️⃣ produce_col


  自定义需定时处理的组合订阅名

  多个用 , 连接


  ⚠️ 注意: 是 名称(name) 不是 显示名称(displayName)


  如果名称需要编码, 请编码后再用 , 连接


  顺序: 并发执行单条订阅, 然后并发执行组合订阅

  '
scriptings:
- http_request:
    name: Sub-Store Core
    match: ^https?:\/\/sub\.store\/((download)|api\/(preview|sync|(utils\/node-info)))
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/faf83904fb9b0544b716e848faee8f9123457ea3dad88cc8c36fd0fe975d6ce4.js
    body_required: true
    max_size: 999999999
    timeout: 600
    arguments:
      _compat.$argument: cors=https://sub-store.vercel.app,http://substore.stash,https://substore.stash
- http_request:
    name: Sub-Store Simple
    match: ^https?:\/\/sub\.store
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/2dc821683247738106e464394b2ee30065b34a29ae180913f615a8601cd40289.js
    body_required: true
    max_size: 999999999
    timeout: 600
    arguments:
      _compat.$argument: cors=https://sub-store.vercel.app,http://substore.stash,https://substore.stash
- schedule:
    name: Sub-Store Sync
    disabled: false
    cron: 55 23 * * *
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/0b6781c3b4d2ae7e621ed40db932ae86914e938e95e561dec9b7481df921ffac.js
    timeout: 600
    arguments:
      _compat.$argument: sync_success_notify=true
- schedule:
    name: Sub-Store Produce
    disabled: true
    cron: 50 */6 * * *
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/0b6781c3b4d2ae7e621ed40db932ae86914e938e95e561dec9b7481df921ffac.js
    timeout: 600
    arguments:
      _compat.$argument: sub=sub1,sub2&col=https://sub-store.vercel.app,http://substore.stash,https://substore.stash0
mitm:
  hostnames:
  - sub.store
