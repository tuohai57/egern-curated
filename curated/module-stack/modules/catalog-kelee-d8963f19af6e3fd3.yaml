name: 得间小说
description: 移除开屏广告、章末广告，移除扉页广告提示、听书界面广告提示、搜索栏填充词。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/iReaderDejian.png
rules:
- domain:
    match: smad.ms.zhangyue.net
    policy: REJECT
- domain:
    match: saad.ms.zhangyue.net
    policy: REJECT
map_locals:
- match: (?i:^https:\/\/dj\.palmestore\.com\/djad\/)|(?i:^https:\/\/dj\.palmestore\.com\/zybk\/api\/ad\/)|(?i:^https:\/\/dj\.palmestore\.com\/zyapi\/bookstore\/ad\/)|(?i:^https:\/\/dj\.palmestore\.com\/zybk\/api\/bookshelf\/index\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - dj.palmestore.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/dj\.palmestore\.com\/zybk\/api\/powerup\/userGroup\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"body\", \"sevenDaysAd\"\
      ], [\"body\", \"shortPlayShow\"], [\"body\", \"sdkShortPlayAB\"]]))\n) ]) as\
      \ $__egern_results\n       | if ($__egern_results | length) == 1\n         then\
      \ $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/dj\.palmestore\.com\/zybk\/api\/search\/index\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"body\", \"keywords\"\
      ]]))\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
