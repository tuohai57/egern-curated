name: 网易邮箱大师
description: 移除网易邮箱大师开屏广告、签到任务提醒，精简侧拉抽屉和我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/MailMaster.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/appconf\.mail\.163\.com\/mailmaster\/api\/page\/v2\/conf\.do$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\ndelpaths([[\"data\",\"functionOperatorInfoList\"\
      ]])\n) | (\ndelpaths([[\"data\",\"memberOperator\"]])\n)\n) | (\ndelpaths([[\"\
      data\",\"activityTabInfoList\"]])\n)\n) ]) as $__egern_results\n       | if\
      \ ($__egern_results | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/appconf\.mail\.163\.com\/mailmaster\/api\/config\/function\.do$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.config[] |= if .result.tools\
      \ then .result.tools |= map(select(.name == \"邮件追踪\" or .name == \"替身邮箱\"))\
      \ else . end | del(.data.config[] | select(.functionName == \"Function-AD\"\
      ))\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
map_locals:
- match: ^https:\/\/appconf\.mail\.163\.com\/mailmaster\/api\/http\/urlConfig\.do$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/dashi\.163\.com\/task-center-api\/fapi\/task\/list$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/appconf\.mail\.163\.com\/mailoperating\/mailmaster\/api\/operator\/get$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - appconf.mail.163.com
  - dashi.163.com
