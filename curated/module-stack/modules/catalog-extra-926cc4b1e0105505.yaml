name: 京东外卖
description: 移除首页推广、点评页面非美食内容、购物车及我的页面推荐、搜索发现、搜索榜单，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/JDWaimai.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/color\.jddj\.com\/client\.action\?functionId=hours_home$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.result.config.searchFloor.data[].searchWords)\
      \ | .result.data |= map(if .tnConfigVO?.businessCode == \"nearby_HourlyGo_Operation_Tags\"\
      \ then empty else . end)\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/color\.jddj\.com\/client\.action\?functionId=wmHome$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.floors |= map(del(.data.tnData.newsInfo?)))\
      \ | .floors |= (map(select(.mId != \"newWalletIdFloor\" and .mId != \"recommendfloor\"\
      ))) | .floors |= (map(.data |= (if .tnData? then del(.tnData.cardList, .tnData.cardListStatic,\
      \ .tnData.walletList) else . end)))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/api\.m\.jd\.com\/client\.action$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\ndelpaths([[\"data\",\"searchDTO\"\
      ,\"searchWords\"]])\n) | (\ndelpaths([[\"data\",\"wishlistDTO\",\"bubbleTip\"\
      ]])\n)\n) | (\n.data.tabList |= (map(select(.code == \"recommendation\" or .code\
      \ == \"find_food\")) | map(if .code == \"recommendation\" then .dpHomeFeedTabResultDTOList\
      \ = .dpHomeFeedTabResultDTOList[0:2] else . end | .dpHomeBannerResultDTOList\
      \ = []))\n)\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
map_locals:
- match: (?:^https:\/\/color\.jddj\.com\/client\.action\?functionId=uniformRecommend)|(?:^https:\/\/color\.jddj\.com\/client\.action\?functionId=search_recommendRanking$)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - color.jddj.com
  - api.m.jd.com
