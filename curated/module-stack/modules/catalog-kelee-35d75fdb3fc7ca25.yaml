name: 一甜相机
description: 移除开屏广告、悬浮广告及图片选择器横幅广告。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Yitian.png
map_locals:
- match: (?i:^https:\/\/(m2u-api\.getkwai|api-m2u\.kuaishou)\.com\/api-server\/api\/v1\/ad\/)|(?i:^https:\/\/(m2u-api\.getkwai|api-m2u\.kuaishou)\.com\/api-server\/api\/v4\/op\/actPositions\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - m2u-api.getkwai.com
  - api-m2u.kuaishou.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/(m2u-api\.getkwai|api-m2u\.kuaishou)\.com\/api-server\/api\/v1\/system\/configs\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"shouldUseLMAdFirst\"\
      ], [\"data\", \"incentiveCfgList\"]]))\n) ]) as $__egern_results\n       | if\
      \ ($__egern_results | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
