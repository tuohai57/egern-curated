name: 米游社
description: 移除开屏广告、搜索栏热搜及资讯、青少年模式弹窗。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/miHoYoBBS.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/bbs-api(-ab)?\.miyoushe\.com\/apihub\/api\/getAppStartupData$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\ndelpaths([[\"data\",\"resp_map\"\
      ,\"/teenager/api/info\"]])\n) | (\ndelpaths([[\"data\",\"resp_map\",\"/apihub/api/getAppConfig\"\
      ,\"data\",\"get_app_config_response\",\"config\",\"is_show_teenager_mode_btn\"\
      ]])\n)\n) | (\ndelpaths([[\"data\",\"resp_map\",\"/apihub/api/getAppConfig\"\
      ,\"data\",\"get_app_config_response\",\"config\",\"teenager_popup_freq_type\"\
      ]])\n)\n) ]) as $__egern_results\n       | if ($__egern_results | length) ==\
      \ 1\n         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
- response_jq:
    match: ^https:\/\/bbs-api(-ab)?\.miyoushe\.com\/apihub\/api\/getAppConfig$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\nif (getpath([\"data\",\"config\"\
      ]) | has(\"teenager_popup_freq_type\")) then (setpath([\"data\",\"config\",\"\
      teenager_popup_freq_type\"]; 0)) else . end\n) | (\nif (getpath([\"data\",\"\
      config\"]) | has(\"is_show_teenager_mode_btn\")) then (setpath([\"data\",\"\
      config\",\"is_show_teenager_mode_btn\"]; 0)) else . end\n)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/bbs-api-ab\.miyoushe\.com\/teenager\/api\/info$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\nif (getpath([\"data\"]) | has(\"\
      is_enabled\")) then (setpath([\"data\",\"is_enabled\"]; false)) else . end\n\
      ) | (\nif (getpath([\"data\"]) | has(\"is_teenager\")) then (setpath([\"data\"\
      ,\"is_teenager\"]; false)) else . end\n)\n) | (\nif (getpath([\"data\"]) | has(\"\
      is_force\")) then (setpath([\"data\",\"is_force\"]; false)) else . end\n)\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
map_locals:
- match: (?:^https:\/\/bbs-api(-ab)?\.miyoushe\.com\/apihub\/api\/getAppSplash$)|(?:^https:\/\/bbs-api(-ab)?\.miyoushe\.com\/apihub\/api\/getHotKeywordAndEvent$)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/bbs-api-static\.miyoushe\.com\/search\/api\/search\/pre_keyword\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - bbs-api.miyoushe.com
  - bbs-api-ab.miyoushe.com
