name: 米游社
description: 移除开屏广告、搜索栏热搜及资讯、青少年模式弹窗。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/miHoYoBBS.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/bbs-api(-ab)?\.miyoushe\.com\/apihub\/api\/getAppStartupData$
    filter: '(

      (

      delpaths([["data","resp_map","/teenager/api/info"]])

      ) | (

      delpaths([["data","resp_map","/apihub/api/getAppConfig","data","get_app_config_response","config","is_show_teenager_mode_btn"]])

      )

      ) | (

      delpaths([["data","resp_map","/apihub/api/getAppConfig","data","get_app_config_response","config","teenager_popup_freq_type"]])

      )'
- response_jq:
    match: ^https:\/\/bbs-api(-ab)?\.miyoushe\.com\/apihub\/api\/getAppConfig$
    filter: '(

      if (getpath(["data","config"]) | has("teenager_popup_freq_type")) then (setpath(["data","config","teenager_popup_freq_type"];
      0)) else . end

      ) | (

      if (getpath(["data","config"]) | has("is_show_teenager_mode_btn")) then (setpath(["data","config","is_show_teenager_mode_btn"];
      0)) else . end

      )'
- response_jq:
    match: ^https:\/\/bbs-api-ab\.miyoushe\.com\/teenager\/api\/info$
    filter: '(

      (

      if (getpath(["data"]) | has("is_enabled")) then (setpath(["data","is_enabled"];
      false)) else . end

      ) | (

      if (getpath(["data"]) | has("is_teenager")) then (setpath(["data","is_teenager"];
      false)) else . end

      )

      ) | (

      if (getpath(["data"]) | has("is_force")) then (setpath(["data","is_force"];
      false)) else . end

      )'
map_locals:
- match: ^https:\/\/bbs-api(-ab)?\.miyoushe\.com\/apihub\/api\/getAppSplash$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/bbs-api(-ab)?\.miyoushe\.com\/apihub\/api\/getHotKeywordAndEvent$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/bbs-api-static\.miyoushe\.com\/search\/api\/search\/pre_keyword\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - bbs-api.miyoushe.com
  - bbs-api-ab.miyoushe.com
