name: TubeMax
description: 过滤TubeMax广告
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/TubeMax.png
rules:
- domain:
    match: app.tubemaxapp.com
    policy: 自动选择
- domain_suffix:
    match: adjust.com
    policy: REJECT
- domain_suffix:
    match: applvn.com
    policy: REJECT
- domain_suffix:
    match: app-measurement.com
    policy: REJECT
- domain_suffix:
    match: pangle.io
    policy: REJECT
- domain_suffix:
    match: applovin.com
    policy: REJECT
- domain_suffix:
    match: appier.net
    policy: REJECT
- domain_suffix:
    match: adsmoloco.com
    policy: REJECT
- domain_suffix:
    match: adcanvas.com
    policy: REJECT
map_locals:
- match: (?i)^https:\/\/.*\.i18n-pglstatp\.com\/obj\/ad-pattern-sg
  status_code: 404
  body: ''
  headers:
    Content-Type: text/plain; charset=utf-8
mitm:
  hostnames:
  - '*.i18n-pglstatp.com'
