body_rewrites:
- response_jq:
    match: (?i)^https:\/\/soapi\.91160\.com\/homepage-recommendation\/recommendation\/medical\/complex\?
    filter: (delpaths([["data", "checkupList"]]))
- response_jq:
    match: (?i)^https:\/\/soapi\.91160\.com\/homepage-recommendation\/homepage\/flow\?
    filter: (.data.rows |= map(select(.type as $type | ["GOOD", "ARTICLE"] | index($type)
      | not)))
- response_jq:
    match: (?i)^https:\/\/patientgate\.91160\.com\/cube\/v1\/unit_page\/page_data\?
    filter: (.data.modules |= map(select(.name == "announcement" or .name == "guide"
      or .name == "expert" or .name == "featuredDepartments" or .name == "featureDevice"
      or .name == "featureTech" or .name == "familyDoctor" or .name == "introduction"
      or .name == "bus" or .name == "classicCase" or .name == "askEveryone" or .name
      == "reviews" or .name == "notes")))
