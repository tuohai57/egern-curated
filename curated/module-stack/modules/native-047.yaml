name: 马蜂窝（可莉·适配）
description: 移除首页信息流广告、商城横幅推广、我的页面弹窗。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/MaFengWo.png
open_url: https://apps.apple.com/app/id406596432
tag: 去广告
rules:
- domain:
    match: advert.mafengwo.cn
    policy: REJECT
url_rewrites: []
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/mapi\.mafengwo\.cn\/discovery\/get_index\/v7\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.list |= map(select(.data.business_type\
      \ != \"gdcpm\"))\n) ]) as $__egern_results\n       | if ($__egern_results |\
      \ length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/mapi\.mafengwo\.cn\/sales\/home\/get_header\/v3\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data.list[] |= ( .data |= del(.banners)\
      \ )\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
mitm:
  hostnames:
  - mapi.mafengwo.cn
map_locals:
- match: (?i)^https:\/\/mapi\.mafengwo\.cn\/user\/growth\/get_growth_tip\/v1\?
  status_code: 200
  body: '{}'
