name: Soul
description: 移除开屏广告、移除话题页面热Soul话题、移除评论区礼物榜、移除更新提示、移除青少年弹窗、移除我的页面推广、移除悬浮部件。
author: ZenmoFeiShi[https://github.com/ZenmoFeiShi], RuCu6[https://github.com/RuCu6],
  可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Soul.png
rules:
- domain_suffix:
    match: soulapp.cn
    policy: DIRECT
- ip_cidr:
    match: 8.210.3.170/32
    policy: DIRECT
    no_resolve: true
- ip_cidr:
    match: 47.75.72.47/32
    policy: DIRECT
    no_resolve: true
- domain:
    match: ad-h5-cdn.soulapp.cn
    policy: REJECT
- domain:
    match: ad-h5-station-cdn.soulapp.cn
    policy: REJECT
- domain:
    match: ad-r.soulapp.cn
    policy: REJECT
- domain:
    match: soul-ad.soulapp.cn
    policy: REJECT
- ip_cidr:
    match: 47.56.131.76/32
    policy: REJECT
    no_resolve: true
- ip_cidr:
    match: 47.97.215.55/32
    policy: REJECT
    no_resolve: true
- ip_cidr:
    match: 47.99.42.29/32
    policy: REJECT
    no_resolve: true
- ip_cidr:
    match: 47.110.187.87/32
    policy: REJECT
    no_resolve: true
- ip_cidr:
    match: 47.243.147.125/32
    policy: REJECT
    no_resolve: true
- ip_cidr:
    match: 120.27.235.201/32
    policy: REJECT
    no_resolve: true
- ip_cidr:
    match: 121.196.197.147/32
    policy: REJECT
    no_resolve: true
map_locals:
- match: (?i)^https:\/\/ssp\.soulapp\.cn\/api\/q
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/chat-live\.soulapp\.cn\/live\/planet\/recListV2
  status_code: 200
  body: ''
  headers:
    Content-Type: text/plain; charset=utf-8
scriptings:
- http_response:
    name: 移除Soul广告
    match: (?i)^https:\/\/(?:api-\w+|chat-live|post)\.soulapp\.cn\/(?:chat\/limitInfo|chatroom\/chatClassifyRoomList|homepage\/diamond\/position\/info|v2\/post\/recSquare\/subTabs|v6\/planet\/config)
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/5a9a02b54668a58dbe2942d39eca12612b2f4669a6cd4fe2847032cbea753d0a.js
    body_required: true
    update_interval: 86400
mitm:
  hostnames:
  - api*.soulapp.cn
  - gateway-mobile-gray.soulapp.cn
  - post.soulapp.cn
  - ssp.soulapp.cn
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/(?:api-\w+|gateway-mobile-gray|post)\.soulapp\.cn\/(?:furion\/position\/content|hot\/soul\/rank|mobile\/app\/version\/queryIos|official\/scene\/module|teenager\/config|v2\/post\/gift\/list|v\d\/post\/homepage\/guide\/card)
    filter: (delpaths([["data"]]))
