name: ScriptHub（脚本转换团队·适配）
description: https://script.hub
author: '@小白脸 @xream @keywos @ckyb'
compat_arguments:
  Notify: 开启通知
scriptings:
- http_request:
    name: script-hub.surge.sgmodule / 1
    match: ^https?:\/\/script\.hub\/($|edit\/|reload)
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/f99b893402fe30b783a10faf22a8f18c0fb86d30618f6e057545e04982e9ce7c.js
    body_required: true
    update_interval: 86400
    timeout: 300
- http_request:
    name: script-hub.surge.sgmodule / 2
    match: ^https?:\/\/script\.hub\/file\/_start_\/.+type=(?:qx-rewrite|surge-module|shadowrocket-module|loon-plugin|all-module)
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/4fa1ee27a082d08e25cbc1d2bf0ae9ba4e5d7c2f64192ecdf23977c163282d10.js
    body_required: true
    update_interval: 86400
    timeout: 300
- http_request:
    name: script-hub.surge.sgmodule / 3
    match: ^https?:\/\/script\.hub\/file\/_start_\/.+type=rule-set
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/ba7b3e86bde6d4a9a395780cea4cbadbdb3c19e1b9992d8008888aed216b79ee.js
    body_required: true
    update_interval: 86400
    timeout: 300
- http_request:
    name: script-hub.surge.sgmodule / 4
    match: ^https?:\/\/script\.hub\/convert\/
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/27fc22ac5a40364fbe0728d7264e163431656e7b142cde6337ecad11e5d60b78.js
    body_required: true
    update_interval: 86400
    timeout: 300
mitm:
  hostnames:
  - script.hub
  - '*.script.hub'
icon: https://raw.githubusercontent.com/lige47/lige_icon/main/icon/05icon/ad.png
