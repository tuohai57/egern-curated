name: CC直播
description: 移除信息流推广和横幅，精简顶部标签。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/CCLive.png
map_locals:
- match: (?i)^https:\/\/cc\.163\.com\/act\/m\/daily\/ad_
  status_code: 404
  body: ''
  headers:
    Content-Type: text/plain; charset=utf-8
- match: (?i)^http:\/\/mshare\.cc\.163\.com\/mshare\/startadv_mobile_v\d\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/appapi\.cc\.163\.com\/v\d\/mixfloatingwindow\/floating_windows\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^http:\/\/api\.cc\.163\.com\/v1\/mpopuprecommend\/exit_room_conf$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - api.cc.163.com
  - cc.163.com
  - mshare.cc.163.com
  - appapi.cc.163.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api\.cc\.163\.com\/v\d\/mgamenavigation\/navigation_list\?
    filter: (.data.info_list |= map(select(.name == "关注" or .name == "推荐" or .name
      == "视频" or .name == "全部")))
- response_jq:
    match: (?i)^https:\/\/api\.cc\.163\.com\/v\d\/mgamerecpage\/recommend_page\?
    filter: (.data.plugins|=map(select(.module_type!="banner"))|.data.plugins|=map(select(.module_type!="show_list"))|.data.plugins|=map(select(.title!="推荐品类")))
- response_jq:
    match: (?i)^https:\/\/api\.cc\.163\.com\/v\d\/entpage\/live_navbar_mobile\/ios\?
    filter: (.data.top_nav |= map(select(.cn_name == "推荐" or .cn_name == "星秀" or .cn_name
      == "心动交友")))
