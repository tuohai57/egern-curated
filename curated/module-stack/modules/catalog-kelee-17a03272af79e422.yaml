mitm:
  hostnames:
  - keapi.fenbi.com
  - market-api.fenbi.com
  - ke.fenbi.com
  - hera-webapp.fenbi.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/hera-webapp\.fenbi\.com\/(iphone|ipad)\/recommend\/info\?
    filter: (delpaths([["data", "rollingBanner"]]))
- response_jq:
    match: (?i)^https:\/\/ke\.fenbi\.com\/(iphone|ipad)\/v3\/apps\/config\?
    filter: (delpaths([["data", "bottomIconInfos", "position", "iconDefaultUrl"],
      ["data", "bottomIconInfos", "position", "iconSelectedUrl"], ["data", "bottomIconInfos",
      "position", "nightModeIconDefaultUrl"], ["data", "bottomIconInfos", "position",
      "nightModeIconSelectedUrl"]]))
