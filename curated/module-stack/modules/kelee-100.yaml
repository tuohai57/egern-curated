name: Keep
description: 移除开屏广告、搜索推荐和弹窗广告，精简底栏和首页标签。移除关注推荐、文章相关推荐和信息流中的课程推广。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Keep.png
rules:
- domain:
    match: kad.gotokeep.com
    policy: REJECT
map_locals:
- match: (?i:^https:\/\/api\.gotokeep\.com\/op-engine-webapp\/v1\/ad\/)|(?i:^https:\/\/api\.gotokeep\.com\/search\/v6\/default\/keyword\/list\?)|(?i:^https:\/\/api\.gotokeep\.com\/twins\/v4\/feed\/followPage\?)|(?i:^https:\/\/api\.gotokeep\.com\/twins\/union\/feed\/function\?)|(?i:^https:\/\/api\.gotokeep\.com\/guide-webapp\/v1\/popup\/getPopUp\?)|(?i:^https:\/\/api\.gotokeep\.com\/search\/v5\/hotCourse\/list$)|(?i:^https:\/\/api\.gotokeep\.com\/search\/v4\/hotHashtag\/list$)|(?i:^https:\/\/api\.gotokeep\.com\/search\/v4\/hotword\/list\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - api.gotokeep.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api\.gotokeep\.com\/op-engine-webapp\/v1\/configs$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(delpaths([[\"data\", \"adTimeoutReport\"\
      ], [\"data\", \"spotShowReport\"], [\"data\", \"adSupplementIntervalMinutes\"\
      ], [\"data\", \"adSupplementSwitch\"], [\"data\", \"hotFeedSpotAdRequestMoment\"\
      ], [\"data\", \"activityBrandFeedSpotAdRequestMoment\"], [\"data\", \"searchFeedSpotAdRequestMoment\"\
      ], [\"data\", \"feedDetailSpotAdRequestMoment\"], [\"data\", \"homePageFeedSpotAdRequestMoment\"\
      ], [\"data\", \"followFeedSpotAdRequestMoment\"], [\"data\", \"hotFeedRecommendSpotAdRequestMoment\"\
      ], [\"data\", \"activityFeedSpotAdRequestMoment\"], [\"data\", \"hotFeedFindSpotAdRequestMoment\"\
      ], [\"data\", \"hotFeedSpotFixedPositionSecond\"], [\"data\", \"searchFeedSpotFixedPositionSecond\"\
      ], [\"data\", \"followFeedSpotFixedPositionSecond\"], [\"data\", \"activityFeedSpotFixedPositionSecond\"\
      ], [\"data\", \"searchFeedSpotFixedPositionThird\"], [\"data\", \"hotFeedFindSpotFixedPositionSecond\"\
      ], [\"data\", \"hotFeedFindSpotFixedPositionThird\"], [\"data\", \"activityFeedSpotFixedPositionInitial\"\
      ], [\"data\", \"activityFeedSpotFixedPositionThird\"], [\"data\", \"hotFeedDynamicSpotPosition\"\
      ], [\"data\", \"feedDetailDynamicSpotPosition\"], [\"data\", \"hotFeedRecommendDynamicSpotPosition\"\
      ], [\"data\", \"hotFeedFindDynamicSpotPosition\"], [\"data\", \"homePageFeedDynamicSpotPosition\"\
      ], [\"data\", \"followFeedDynamicSpotPosition\"], [\"data\", \"searchFeedSpotPositionDynamic\"\
      ], [\"data\", \"activityFeedSpotPositionDynamic\"], [\"data\", \"activityBrandFeedSpotPositionDynamic\"\
      ], [\"data\", \"splashAdLoadTimeLimit\"], [\"data\", \"courseAdLoadTimeLimit\"\
      ], [\"data\", \"feedAdLoadTimeLimit\"], [\"data\", \"aliHCSpotConfig\"], [\"\
      data\", \"gdtSpotConfig\"], [\"data\", \"pugcThresholdPercent\"], [\"data\"\
      , \"pugcStepMinSeconds\"], [\"data\", \"pugcStepMaxSeconds\"], [\"data\", \"\
      pugcPreLoadEarlySeconds\"], [\"data\", \"pugcLoadPostPreRolls\"], [\"data\"\
      , \"closeConfirmButtonText\"]]))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.gotokeep\.com\/twins\/union\/feed\/union_feed_all$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data.modules |= map(select(.code\
      \ == \"unionFeedEntry\")))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.gotokeep\.com\/twins\/v4\/feed\/entryDetail\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(setpath([\"data\"]; \"{}\"))\n) ])\
      \ as $__egern_results\n       | if ($__egern_results | length) == 1\n      \
      \   then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.gotokeep\.com\/config\/v3\/basic\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data.bottomBarControl.tabs |= map(select(.tabType\
      \ | . == \"home\" or . == \"schedule\" or . == \"dynamic_sports\" or . == \"\
      personal\")) | .data.homeTabs |= map(select(.type | . == \"socialTab\" or .\
      \ == \"union_feed_all\" or . == \"homeRecommend\" or . == \"suitTab\" or . ==\
      \ \"union_feed_route\")))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.gotokeep\.com\/pencil-webapp\/play\/v1\/games\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.data.games[].microGames[] |= if\
      \ .leftIcon? and .leftIcon.type == \"aiMode\" then del(.leftIcon) else . end)\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
