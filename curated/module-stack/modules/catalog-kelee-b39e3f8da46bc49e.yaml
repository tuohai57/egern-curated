name: 收银通商户端
description: 移除开屏广告和首页推广
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/ShouYinTongMerchant.png
map_locals:
- match: (?i)^https:\/\/syt\.leshuazf\.com\/merchant\/merchant\/showOpenScreenAd$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/m\.fqfin\.cn\/cls\/leshuapay\/preCredit\.json$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i:^https:\/\/syt\.leshuazf\.com\/merchant\/messageCenter\/stationLetterList$)|(?i:^https:\/\/syt\.leshuazf\.com\/merchant\/merchant\/getBannerConfig$)|(?i:^https:\/\/syt\.leshuazf\.com\/merchant\/popup\/getPopupInfo$)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - syt.leshuazf.com
  - m.fqfin.cn
