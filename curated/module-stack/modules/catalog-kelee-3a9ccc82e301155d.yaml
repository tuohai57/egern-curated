name: 胖乖生活
description: 移除开屏广告、横幅轮播图、网格广告、信息流广告、浮窗广告，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/PangguaiLife.png
map_locals:
- match: (?i:^https:\/\/userapi\.qiekj\.com\/slot\/get$)|(?i:^https:\/\/userapi\.qiekj\.com\/appTitle\/get$)|(?i:^https:\/\/userapi\.qiekj\.com\/integralRecord\/integralDailStatistics$)|(?i:^https:\/\/userapi\.qiekj\.com\/local-life\/category$)|(?i:^https:\/\/userapi\.qiekj\.com\/integralGoods\/queryIntegralGoodsPage$)|(?i:^https:\/\/userapi\.qiekj\.com\/task\/list$)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - userapi.qiekj.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/userapi\.qiekj\.com\/local-life\/tab-order$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(setpath([\"data\"]; \"[]\"))\n) ])\
      \ as $__egern_results\n       | if ($__egern_results | length) == 1\n      \
      \   then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/userapi\.qiekj\.com\/integralGoods\/queryIntegralGoodsCategoryList$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(setpath([\"data\"]; \"[]\"))\n) ])\
      \ as $__egern_results\n       | if ($__egern_results | length) == 1\n      \
      \   then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
