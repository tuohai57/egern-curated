name: 美颜相机
description: 移除开屏广告、应用内弹窗，精简首页和我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/MeituMYXJ.png
rules:
- domain:
    match: adui.tg.meitu.com
    policy: REJECT
map_locals:
- match: (?i)^https:\/\/api\.meiyan\.com\/operation\/home_banner\.json\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api\.meiyan\.com\/vip\/permission_update_popup\.json\?
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
scriptings:
- http_response:
    name: 精简首页功能栏目并移除美颜推荐
    match: (?i)^https:\/\/api\.meiyan\.com\/operation\/home\.json\?
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/9a50669b814eedd82eb9b73518089547bc7b9c5388dc4e441dfc9f155c55fc61.js
    body_required: true
    update_interval: 86400
mitm:
  hostnames:
  - api.meiyan.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api\.meiyan\.com\/operation\/get_config\.json\?
    filter: (delpaths([["response", "time_limit"], ["response", "bubble"], ["response",
      "person_center"]])) | (setpath(["response", "function_pop", "meiyan_style",
      "is_pop"]; false) | setpath(["response", "onoff", "vip_half_window_exit_remain_popup",
      "open"]; 0) | setpath(["response", "onoff", "vip_home_exit_remain_popup"]; 0))
