name: 网易有道词典
description: 移除开屏广告、弹窗广告、横幅广告、信息流广告、旧版翻译页面广告及搜索填充词。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/YoudaoDict.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/dict\.youdao\.com\/homepage\/toolbar\/get\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndelpaths([[\"data\",\"vipTag\"]])\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/dict\.youdao\.com\/course\/tab\/translateTab\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndelpaths([[\"data\"]])\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/dict\.youdao\.com\/course\/tab\/home\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\n(\n(\n(\n(\n(\ndelpaths([[\"\
      data\",\"popup\"]])\n) | (\ndelpaths([[\"data\",\"tab\"]])\n)\n) | (\ndelpaths([[\"\
      data\",\"searchSuggestList\"]])\n)\n) | (\ndelpaths([[\"data\",\"newBanner\"\
      ]])\n)\n) | (\ndelpaths([[\"data\",\"icon\",\"promotionList\"]])\n)\n) | (\n\
      delpaths([[\"data\",\"icon\",\"iconList\",1,\"bubble\"]])\n)\n) | (\ndelpaths([[\"\
      data\",\"icon\",\"iconList\",2,\"bubble\"]])\n)\n) | (\ndelpaths([[\"data\"\
      ,\"icon\",\"iconList\",8,\"bubble\"]])\n)\n) ]) as $__egern_results\n      \
      \ | if ($__egern_results | length) == 1\n         then $__egern_results[0] else\
      \ $__egern_original_json end)\n  catch $__egern_original_json"
map_locals:
- match: (?:^https:\/\/gorgon\.youdao\.com\/gorgon\/brand\/prefetch\.s\?)|(?:^https:\/\/gorgon\.youdao\.com\/gorgon\/request\.s\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - gorgon.youdao.com
  - dict.youdao.com
