name: 知乎
description: 过滤知乎广告
author: RuCu6[https://github.com/RuCu6], blackmatrix7[https://github.com/blackmatrix7],
  可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://loonlab.103516.xyz/Plugin/
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/ZhiHu.png
open_url: https://apps.apple.com/app/id432274380
tag: 去广告
rules:
- domain:
    match: appcloud.zhihu.com
    policy: REJECT
- domain:
    match: appcloud2.in.zhihu.com
    policy: REJECT
- domain:
    match: crash2.zhihu.com
    policy: REJECT
- domain:
    match: lens.zhihu.com
    policy: REJECT
- domain:
    match: mqtt.zhihu.com
    policy: REJECT
- domain:
    match: sugar.zhihu.com
    policy: REJECT
- domain:
    match: zxid-m.mobileservice.cn
    policy: REJECT
- ip_cidr:
    match: 103.41.167.237/32
    policy: REJECT
    no_resolve: true
- ip_cidr:
    match: 118.89.204.198/32
    policy: REJECT
    no_resolve: true
- ip_cidr:
    match: 182.61.194.7/32
    policy: REJECT
    no_resolve: true
- ip_cidr6:
    match: 2402:4e00:1200:ed00:0:9089:6dac:96b6/128
    policy: REJECT
    no_resolve: true
- url_regex:
    match: (?i)^https:\/\/api\.zhihu\.com\/unlimited\/go\/my_card
    policy: REJECT
- url_regex:
    match: (?i)^https:\/\/www\.zhihu\.com\/appview\/v3\/zhmore
    policy: REJECT
url_rewrites:
- match: (?i)^https:\/\/link\.zhihu\.com\/\?target=(?:https?)?(?:%3A|:)?(?:\/\/|%2F%2F)?(.*)
  location: http://$1
  status_code: 302
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/m-cloud\.zhihu\.com\/api\/cloud\/zhihu\/config\/all\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndef drop_keys: {\"km_httpdns_new_config_tars\"\
      :true,\"preFetchHttpDns\":true,\"httpdns_detector_use_concurrent\":true,\"httpdns_use_memory_cache\"\
      :true,\"httpdns_new_config_tars\":true,\"coreNetworkConf_useTars\":true,\"km_coreNetworkConf_useTars\"\
      :true,\"sugarQuicConfig\":true,\"quic_dns_detect_enable\":true,\"quicMixAB\"\
      :true,\"quic_downgrade_enable\":true,\"quic_priority_strategy\":true,\"quic_check_health_enable\"\
      :true,\"tquic_configuration\":true,\"networkExprimentList\":true,\"tars_ab_list\"\
      :true,\"zaSetExtraRequestHeader\":true}; .data.configs |= map(select((drop_keys[.configKey]\
      \ // false) | not) | if (.configValue | type) == \"object\" then del(.configValue.delayHttpdns,\
      \ .configValue.dnsParser, .configValue.HTTPDNS) else . end)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/root\/tab\/v\d(?:\?.+)?$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.tab_list |= map(select(.tab_type\
      \ == \"follow\" or .tab_type == \"recommend\" or .tab_type == \"hot\" or .tab_type\
      \ == \"ring_tab\"))\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/topstory\/recommend\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n.data |= map(select(.type == \"\
      ComponentCard\"))\n) | (\n.data[]?.children |= (if type == \"array\" then map(select(.id\
      \ != \"ring\")) else . end)\n)\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/questions\/\d+\/feeds\?
    filter: "(\n# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.ad_info)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json\n) | (\n\
      # Egern: preserve input on failed, empty or multi-result transform\n. as $__egern_original_json\n\
      | try (([ (\ndel(.ad_info, .data.ad_info?, .query_info) | if (.data | type)\
      \ == \"array\" then .data |= map(select(.target?.answer_type? // \"\" | tostring\
      \ | contains(\"paid\") | not)) else . end\n) ]) as $__egern_results\n      \
      \ | if ($__egern_results | length) == 1\n         then $__egern_results[0] else\
      \ $__egern_original_json end)\n  catch $__egern_original_json\n)"
- response_jq:
    match: (?i)^https:\/\/(api|page-info)(?:\.zhihu)?\.com\/answers\/v\d\/\d+(?:\?.*)?$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\ndel(.third_business, .float_search_word)\n\
      ) | (\n.structured_content.segments |= map(select(.type != \"card\"))\n)\n)\
      \ ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/(articles|answers|pins)\/v\d\/\d+\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.third_business, .ring_info, .interaction_bar_plugins)\n\
      ) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/podcasts\/hub\/v\d$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.banners)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/search_v\d\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.pendant)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/search\/tabs\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.data |= map(select(.t | IN(\"general\"\
      , \"ai_zhida\", \"recent\", \"people\", \"zvideo\", \"ring\", \"topic\", \"\
      podcast\", \"column\", \"pin\", \"favlist\")))\n) ]) as $__egern_results\n \
      \      | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/people\/self$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.vip_info.entrance_new.right_button,\
      \ .vip_info.entrance_v2)\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/bazaar\/vip_tab\/header\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.activity_banner, .activity_window,\
      \ .vip_tip)\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/comment_v5\/(answers|pins)\/\d+\/root_comment\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.atmosphere_voting_config)\n)\
      \ ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^(?!https:\/\/api\.zhihu\.com\/questions\/\d+\/feeds\?)(?:https:\/\/api\.zhihu\.com\/questions\/\d+(?:\/answers|\/feeds|\?include=))
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndel(.ad_info, .data.ad_info?, .query_info)\
      \ | if (.data | type) == \"array\" then .data |= map(select(.target?.answer_type?\
      \ // \"\" | tostring | contains(\"paid\") | not)) else . end\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_regex:
    match: (?i)^https:\/\/api\.zhihu\.com\/search\/recommend_query\/v2\?
    find: recommend_queries:\{.+\}
    replace: recommend_queries:{}
