name: 汉庭酒店（可莉·适配）
description: 移除弹窗、横幅，精简首页。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/HantingHotels.png
map_locals:
- match: (?i)^https:\/\/hweb-manager\.huazhu\.com\/notice\/getAppPopupNotifyAlert$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i:^https:\/\/hweb-hotel\.huazhu\.com\/home\/getHomeLoinBanner$)|(?i:^https:\/\/hweb-hotel\.huazhu\.com\/\/home\/querySelectHotel$)|(?i:^https:\/\/hweb-hotel\.huazhu\.com\/home\/queryHotelBrand$)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/hweb-manager\.huazhu\.com\/hotels\/ad\/getHotelListNoticeMerge$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - hweb-manager.huazhu.com
  - hweb-hotel.huazhu.com
  - res-pub.huazhu.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/res-pub\.huazhu\.com\/frontconf\/homeconfig_45\/\w+\.json$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(if has(\"content\") and (.content\
      \ | type) == \"object\" then .content |= with_entries(select(.key == \"topBanner\"\
      \ or .key == \"topBannerImages\")) else . end)\n) ]) as $__egern_results\n \
      \      | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: (?i)^https:\/\/res-pub\.huazhu\.com\/frontconf\/tabbarconfig_45\/\w+\.json$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(.content.tabbar |= map(select(.attributes.tabName\
      \ == \"首页\" or .attributes.tabName == \"服务\" or .attributes.tabName == \"我的\"\
      )))\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
