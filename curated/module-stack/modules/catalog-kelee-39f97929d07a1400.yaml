name: 酷狗音乐
description: 移除开屏广告、应用各类弹窗、各类横幅广告、评论区广告和播放器界面广告。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/KuGou.png
rules:
- domain:
    match: ads.service.kugou.com
    policy: REJECT
- domain:
    match: adstats.tencentmusic.com
    policy: REJECT
- domain:
    match: adsmind.gdtimg.com
    policy: REJECT
- domain:
    match: adserviceretry.kugou.com
    policy: REJECT
- domain:
    match: adserviceretry.kglink.cn
    policy: REJECT
- domain:
    match: ad.tencentmusic.com
    policy: REJECT
- domain:
    match: adservice.kugou.com
    policy: REJECT
- domain:
    match: splashimgretrybssdl.cloud.kugou.com
    policy: REJECT
- url_regex:
    match: ^http:\/\/log\.stat\.kugou\.com\/mobile\/ad\.html
    policy: REJECT
