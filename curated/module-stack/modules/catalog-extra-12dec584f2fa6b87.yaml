name: 七猫小说
description: 移除大部分七猫小说广告，但受限于七猫小说自身对MitM和VPN状态的检测，部分页面广告无法移除。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/SevenCat.png
homepage: https://hub.kelee.one
rules:
- domain:
    match: cdn-ad.wtzw.com
    policy: REJECT
- domain:
    match: cdn-new-ad.wtzw.com
    policy: REJECT
- domain_suffix:
    match: gdt.qq.com
    policy: REJECT
- url_regex:
    match: ^https:\/\/sf3-fe-tos\.pglstatp-toutiao\.com\/obj\/ad-pattern\/
    policy: REJECT
- url_regex:
    match: ^https:\/\/api-cfg\.wtzw\.com\/v\d\/reward\/
    policy: REJECT
- url_regex:
    match: ^https:\/\/api-cfg\.wtzw\.com\/v\d\/adv\/
    policy: REJECT
body_rewrites:
- response_jq:
    match: ^https:\/\/xiaoshuo\.wtzw\.com\/api\/v\d\/user\/my-center\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\ndelpaths([[\"data\",\"func_area\"\
      ,1]])\n) | (\ndelpaths([[\"data\",\"func_area\",2]])\n)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
map_locals:
- match: ^https:\/\/api-cfg\.wtzw\.com\/v\d\/splash\/
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: (?:^https:\/\/api-bc\.wtzw\.com\/api\/v4\/search\/dispose)|(?:^https:\/\/api-bc\.wtzw\.com\/api\/v\d\/book-store\/config)|(?:^https:\/\/api-bc\.wtzw\.com\/api\/v\d\/book-store\/push-book)|(?:^https:\/\/api-bc\.wtzw\.com\/api\/v\d\/operation)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/api-gw\.wtzw\.com\/welf\/app\/v\d\/task\/red-packet
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/cdn\.wtzw\.com\/bookimg\/free\/api\/v\d\/reader\/reader-copy-paragraph-all\.json
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: (?:^https:\/\/api-cfg\.wtzw\.com\/v\d\/offline-adv\/index)|(?:^https:\/\/api-cfg\.wtzw\.com\/v\d\/operation\/index\?ad_personal_switch)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/xiaoshuo\.wtzw\.com\/api\/v\d\/withdraw\/init
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - api-cfg.wtzw.com
  - sf3-fe-tos.pglstatp-toutiao.com
  - api-bc.wtzw.com
  - api-gw.wtzw.com
  - cdn.wtzw.com
