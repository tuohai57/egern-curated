name: 淘宝
description: 过滤淘宝开屏广告
author: RuCu6[https://github.com/RuCu6]
icon: https://raw.githubusercontent.com/lige47/lige_icon/main/icon/03CNSoft/taobao.png
homepage: https://hub.kelee.one
rules:
- domain:
    match: adashx.m.taobao.com
    policy: REJECT
- domain:
    match: ossgw.alicdn.com
    policy: REJECT
- domain:
    match: ems.youku.com
    policy: REJECT
- domain:
    match: hudong.alicdn.com
    policy: REJECT
- domain:
    match: h-adashx.ut.taobao.com
    policy: REJECT
- domain:
    match: ut.taobao.com
    policy: REJECT
map_locals:
- match: ^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.fliggy\.crm\.screen\.(allresource|predict)
