name: 阅友
description: 移除开屏广告、弹窗广告和阅读页面广告，移除底栏福利按钮。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Yueyou.png
rules:
- domain:
    match: ads.reader.yueyouxs.com
    policy: REJECT
mitm:
  hostnames:
  - goway.reader.yueyouxs.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/goway\.reader\.yueyouxs\.com\/assemble\/app\/basic\/getAppInfo\?
    filter: (delpaths([["data", "isShowDLPopup"], ["data", "isShowGame"], ["data",
      "touTiaoShowDlPopup"], ["data", "offLineDownload", "WatchVideoBtnDesc"], ["data",
      "readVipFirstCfg"], ["data", "readVipNormalCfg"], ["data", "notifyAd"], ["data",
      "hotStartSplashTime"], ["data", "hotStartReqSwitch"], ["data", "isShowBFTab"],
      ["data", "popReqDelayTime"], ["data", "benefitCfg"], ["data", "chestTask"],
      ["data", "hotStartAd"], ["data", "activeTagList"], ["data", "secondOrderCfg"],
      ["data", "secondOrderList"], ["data", "blockedWordsCfg"], ["data", "aaReportListCfg"],
      ["data", "pddAdSwitch"], ["data", "isShowShelfAuthPopup"], ["data", "firstPopUpAmount"]]))
      | (setpath(["data", "isAdClosed"]; true))
