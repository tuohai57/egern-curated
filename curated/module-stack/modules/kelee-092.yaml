name: TestFlight 地区解锁（可莉·适配）
description: 解除TestFlight的区域限制，支持tvOS。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/TestFlight.png
rules:
- domain:
    match: testflight.apple.com
    policy: 自动选择
body_rewrites:
- request_regex:
    match: (?i)^https?:\/\/testflight\.apple\.com\/v\d\/accounts\/.+?\/install$
    find: '"storefrontId"\x20:\x20"\d{6}-\d{2},\d{2}",'
    replace: '"storefrontId":"143441-19,29",'
mitm:
  hostnames:
  - testflight.apple.com
