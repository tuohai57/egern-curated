name: 智联招聘
description: 移除开屏广告、弹窗、职位页面推广和各类横幅推广。此插件需要IPA签名方可使用，App Store用户请勿使用此插件，务必点击下方主页链接查看详细教程。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/ZhiLianZhaoPin.png
homepage: https://getupnote.com/share/notes/zSn1ShBmzNYISKcTgjXE5oHMrNf2/34bf3aad-7872-497d-b239-198e27e8c84c
rules:
- url_regex:
    match: ^https:\/\/(ask|cgate)\.zhaopin\.com\/operation\/ad\/
    policy: REJECT
- url_regex:
    match: ^https:\/\/cgate\.zhaopin\.com\/bdp\/commercial\/queryLinkData$
    policy: REJECT
body_rewrites:
- response_jq:
    match: ^https:\/\/ask\.zhaopin\.com\/plat-zqa-server\/home\/\d\.\d\.\d\/getHomeContents\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndelpaths([[\"data\",\"templates\"\
      ,0,\"data\",\"banner\"]])\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
map_locals:
- match: ^https:\/\/cgate\.zhaopin\.com\/resumeapi\/resumeCheck\/positionDetailBottomTipCheck$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - ask.zhaopin.com
  - cgate.zhaopin.com
