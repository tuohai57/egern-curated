name: 京东
description: 移除京东开屏广告，精简我的页面产品推广。
author: RuCu6[https://github.com/RuCu6], Maasea[https://github.com/Maasea]
icon: https://raw.githubusercontent.com/lige47/lige_icon/main/icon/03CNSoft/jingdong.png
homepage: https://hub.kelee.one
rules:
- url_regex:
    match: ^http:\/\/\w{32}\.jddebug\.com\/diagnose\?
    policy: REJECT
body_rewrites:
- response_jq:
    match: ^https:\/\/api\.m\.jd\.com\/client\.action\?functionId=basicConfig
    filter: '(

      (

      if (getpath(["data","JDMessage","socketmonitor"]) | has("isSocketEstablishedAhead"))
      then (setpath(["data","JDMessage","socketmonitor","isSocketEstablishedAhead"];
      0)) else . end

      ) | (

      if (getpath(["data","JDMessage","socketmonitor"]) | has("isSocketReport")) then
      (setpath(["data","JDMessage","socketmonitor","isSocketReport"]; 0)) else . end

      )

      ) | (

      if (getpath(["data","JDHttpToolKit","httpdns"]) | has("httpdns")) then (setpath(["data","JDHttpToolKit","httpdns","httpdns"];
      0)) else . end

      )'
map_locals:
- match: ^https:\/\/api\.m\.jd\.com\/client\.action\?functionId=(searchBoxWord|stationPullService|uniformRecommend[06])
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - api.m.jd.com
