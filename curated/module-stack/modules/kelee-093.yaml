name: Telegram 链接跳转（可莉·适配）
description: 适用于安装了多个不同Telegram客户端的用户，用于在指定客户端中打开公开或私有群组及频道的Telegram短链。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Telegram.png
url_rewrites:
- match: ^https:\/\/t\.me\/([A-Za-z][A-Za-z0-9_]{3,30}[A-Za-z0-9])\/?$
  location: tg://resolve?domain=$1
  status_code: 307
- match: ^https:\/\/t\.me\/\+([A-Za-z0-9_-]+)\/?$
  location: tg://join?invite=$1
  status_code: 307
mitm:
  hostnames:
  - t.me
