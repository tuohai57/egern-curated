name: 网易邮箱大师
description: 移除网易邮箱大师开屏广告、签到任务提醒，精简侧拉抽屉和我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/MailMaster.png
map_locals:
- match: (?i)^https:\/\/appconf\.mail\.163\.com\/mailmaster\/api\/http\/urlConfig\.do$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/dashi\.163\.com\/task-center-api\/fapi\/task\/list$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/appconf\.mail\.163\.com\/mailoperating\/mailmaster\/api\/operator\/get$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
mitm:
  hostnames:
  - appconf.mail.163.com
  - dashi.163.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/appconf\.mail\.163\.com\/mailmaster\/api\/page\/v2\/conf\.do$
    filter: (delpaths([["data", "functionOperatorInfoList"], ["data", "memberOperator"],
      ["data", "activityTabInfoList"]]))
- response_jq:
    match: (?i)^https:\/\/appconf\.mail\.163\.com\/mailmaster\/api\/config\/function\.do$
    filter: (.data.config[] |= if .result.tools then .result.tools |= map(select(.name
      == "邮件追踪" or .name == "替身邮箱")) else . end | del(.data.config[] | select(.functionName
      == "Function-AD")))
