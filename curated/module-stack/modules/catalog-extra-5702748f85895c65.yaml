name: 猫耳FM
description: 移除开屏广告、青少年模式弹窗、首页顶部入口，替换底栏的直播入口为发现入口。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/CatEarFM.png
homepage: https://hub.kelee.one
body_rewrites:
- response_jq:
    match: ^https:\/\/app\.missevan\.com\/site\/launch\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\ndelpaths([[\"info\",\"splash\"\
      ]])\n) | (\ndelpaths([[\"info\",\"splash_ready\"]])\n)\n) ]) as $__egern_results\n\
      \       | if ($__egern_results | length) == 1\n         then $__egern_results[0]\
      \ else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/app\.missevan\.com\/site\/config$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n(\n(\n(\n(\n(\n(\n(\n(\ndelpaths([[\"\
      info\",\"tab_bar_live\"]])\n) | (\ndelpaths([[\"0\"]])\n)\n) | (\ndelpaths([[\"\
      info\",\"enable_tab_bar_live_notice\"]])\n)\n) | (\ndelpaths([[\"false\"]])\n\
      )\n) | (\ndelpaths([[\"info\",\"teenager_popup_mode\"]])\n)\n) | (\ndelpaths([[\"\
      0\"]])\n)\n) | (\ndelpaths([[\"info\",\"httpdns\"]])\n)\n) | (\ndelpaths([[\"\
      info\",\"homepage_top_task_button\"]])\n)\n) | (\n.info.cronet |= (fromjson\
      \ | .quic=false | tojson)\n)\n) ]) as $__egern_results\n       | if ($__egern_results\
      \ | length) == 1\n         then $__egern_results[0] else $__egern_original_json\
      \ end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/app\.missevan\.com\/site\/tabs\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.info.tabs |= map(select(.title as\
      \ $t | [\"直播\", \"发现\", \"广播剧\", \"听书\", \"分类\"] | index($t) != null))\n) ])\
      \ as $__egern_results\n       | if ($__egern_results | length) == 1\n      \
      \   then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/app\.missevan\.com\/site\/icons\?
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.info.icons |= map(select(.title as\
      \ $t | $t == \"直播\" or $t == \"必听剧\" or $t == \"免费榜\" or $t == \"夜猫子\" or $t\
      \ == \"启动音\"))\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/app\.missevan\.com\/discovery\/list$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\n.info |= map(map(select(.title !=\
      \ \"免流服务\")))\n) ]) as $__egern_results\n       | if ($__egern_results | length)\
      \ == 1\n         then $__egern_results[0] else $__egern_original_json end)\n\
      \  catch $__egern_original_json"
- response_jq:
    match: ^https:\/\/app\.missevan\.com\/site\/get-top$
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndelpaths([[\"info\",\"search_words\"\
      ]])\n) ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n\
      \         then $__egern_results[0] else $__egern_original_json end)\n  catch\
      \ $__egern_original_json"
map_locals:
- match: ^https:\/\/data\.missevan\.com\/site\/ad-track$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: ^https:\/\/app\.missevan\.com\/x\/recommend\/get-popup$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
- match: (?:^https:\/\/fm\.missevan\.com\/api\/v2\/meta\/banner$)|(?:^https:\/\/fm\.missevan\.com\/api\/v2\/recommended\/top\?)|(?:^https:\/\/fm\.missevan\.com\/api\/v2\/chatroom\/sound\/recommend\?)
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json
mitm:
  hostnames:
  - app.missevan.com
  - data.missevan.com
  - fm.missevan.com
