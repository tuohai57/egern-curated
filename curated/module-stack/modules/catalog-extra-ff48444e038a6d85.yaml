name: 美图秀秀
description: 移除开屏广告、横幅推广，精简我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/MeiTu.png
homepage: https://hub.kelee.one
rules:
- domain:
    match: adui.tg.meitu.com
    policy: REJECT
body_rewrites:
- response_jq:
    match: ^https:\/\/api\.posters\.meitu\.com\/common\/init\.json
    filter: "# Egern: preserve input on failed, empty or multi-result transform\n\
      . as $__egern_original_json\n| try (([ (\ndelpaths([[\"data\",\"vip\"]])\n)\
      \ ]) as $__egern_results\n       | if ($__egern_results | length) == 1\n   \
      \      then $__egern_results[0] else $__egern_original_json end)\n  catch $__egern_original_json"
mitm:
  hostnames:
  - api.posters.meitu.com
