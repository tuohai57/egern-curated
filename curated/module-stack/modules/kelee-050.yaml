name: 网易云音乐
description: 过滤网易云音乐广告，并允许自定义界面。
author: RuCu6[https://github.com/RuCu6], Keywos[https://github.com/Keywos]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/NeteaseMusic.png
rules:
- domain:
    match: iadmat.nosdn.127.net
    policy: REJECT
- domain:
    match: iadmatapk.nosdn.127.net
    policy: REJECT
- domain:
    match: iadmusicmat.music.126.net
    policy: REJECT
- domain:
    match: iadmusicmatvideo.music.126.net
    policy: REJECT
- domain:
    match: ipv4.music.163.com
    policy: REJECT
- domain:
    match: ipv6.music.163.com
    policy: REJECT
map_locals:
- match: (?i)^https?:\/\/interface\d?\.music\.163\.com\/e?api\/(ocpc\/)?ad\/
  status_code: 200
  body: ''
  headers:
    Content-Type: text/plain
- match: (?i:^https?:\/\/interface\d?\.music\.163\.com\/eapi\/(?:delivery\/(batch-)?deliver|moment\/tab\/info\/|side-bar\/mini-program\/music-service\/account|yunbei\/account\/entrance\/))|(?i:^https?:\/\/interface\d?\.music\.163\.com\/eapi\/(?:community\/friends\/fans-group\/artist\/group\/|mine\/applet\/redpoint|music\/songshare\/text\/recommend\/|resniche\/position\/play\/new\/|resniche\/tspopup\/show|resource\/comments?\/musiciansaid\/|user\/sub\/artist))|(?i:^https?:\/\/interface\d?\.music\.163\.com\/eapi\/(?:ios\/version|mlivestream\/entrance\/playpage\/|link\/position\/show\/strategy|link\/scene\/show\/resource|v1\/content\/exposure\/comment\/banner\/))
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https?:\/\/interface\d?\.music\.163.com\/w?e?api\/search\/default
  status_code: 200
  body: ''
  headers:
    Content-Type: text/plain
- match: (?i)^https?:\/\/interface\d?\.music\.163\.com\/w?eapi\/(?:activity\/bonus\/playpage\/time\/query|resource-exposure\/|search\/(?:chart\/|rcmd\/keyword\/|specialkeyword\/))
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/interface\d\.music\.163\.com\/eapi\/my\/podcast\/tab\/recommend
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
scriptings:
- http_response:
    name: 评论区、热推、有话想说、分享一下、歌曲下的祝福等小提示
    match: (?i)^https?:\/\/interface\d?\.music\.163\.com\/eapi\/(?:batch|v2\/resource\/comment\/floor\/get)
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/20c13c7c598b8e59058493e2143d5c62d27ce6ac2917d04c400fa16caa092528.js
    body_required: true
    update_interval: 86400
    timeout: 20
    binary_body: true
    max_size: 16777216
- http_response:
    name: 推荐、home、主页
    match: (?i)^https?:\/\/interface\d?\.music\.163\.com\/eapi\/(?:homepage\/block\/page|link\/page\/rcmd\/(?:block\/resource\/multi\/refresh|resource\/show))
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/427d0aa9451cb37c599e815ff767083d6aeae70bfa4541d3fcc129def7dcf10c.js
    body_required: true
    update_interval: 86400
    timeout: 20
    binary_body: true
    max_size: 16777216
- http_response:
    name: 底部选项卡
    match: (?i)^https?:\/\/interface\d?\.music\.163\.com\/eapi\/link\/home\/framework\/tab
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/de2938f0fd6e8f56b62a952cc3051acc902d942153bf5dcdf18b0cd0e6deeaea.js
    body_required: true
    update_interval: 86400
    timeout: 20
    binary_body: true
    max_size: 16777216
- http_response:
    name: 发现页
    match: (?i:^https?:\/\/interface\d?\.music\.163\.com\/eapi\/link\/page\/discovery\/resource\/show)|(?i:^https?:\/\/interface\d?\.music\.163\.com\/eapi\/link\/position\/show\/resource)|(?i:^https?:\/\/interface\d?\.music\.163\.com\/eapi\/user\/follow\/users\/mixed\/get)
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/20c13c7c598b8e59058493e2143d5c62d27ce6ac2917d04c400fa16caa092528.js
    body_required: true
    update_interval: 86400
    timeout: 20
    binary_body: true
    max_size: 16777216
mitm:
  hostnames:
  - interface*.music.163.com
