name: 比心
description: 移除弹窗广告、悬浮广告、横幅广告、轮播图广告，精简搜索页及我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Bixin.png
map_locals:
- match: (?i)^https:\/\/web\.hibixin\.com\/user-recall\/signModal$
  status_code: 404
  body: ''
  headers:
    Content-Type: text/plain; charset=utf-8
- match: (?i)^https:\/\/api\.hibixin\.com\/config\/v\d\/common\/popup$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/gateway\.hibixin\.com\/resource\/v\d\/rec\/card\/query$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api\.hibixin\.com\/msg\/user\/friends\/trends\/top$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/gateway\.xxqapp\.cn\/live\/pendant\/index\/items$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api\.xxqapp\.cn\/banner\/list\/\d$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/api\.hibixin\.com\/content\/v\d\/home\/page\/list$
  status_code: 200
  body: '{"code":"8000","msg":"SUCCESS","success":true}'
  headers:
    Content-Type: application/json
- match: (?i)^https:\/\/api\.hibixin\.com\/resource\/v\d\/discovery\/entrance\/activity$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/gateway\.hibixin\.com\/config\/search\/qryConfigPart$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/gateway\.xxqapp\.cn\/live\/flow\/pendant\/meta$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/web-bxyuer\.bixin\.cn\/yuer-ads\?
  status_code: 404
  body: ''
  headers:
    Content-Type: text/plain; charset=utf-8
- match: (?i)^https:\/\/gateway\.bxyuer\.com\/official\/room\/tab\/pop$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
- match: (?i)^https:\/\/gateway\.xxqapp\.cn\/living\/room\/fetch\/recommend-follow-list$
  status_code: 200
  body: '{"code":"8000","msg":"SUCCESS","success":true}'
  headers:
    Content-Type: application/json
- match: (?i)^https:\/\/api\.hibixin\.com\/biggie\/query\/skill\/detail\/relateRecommendBiggieV\d$
  status_code: 200
  body: '{}'
  headers:
    Content-Type: application/json; charset=utf-8
scriptings:
- http_response:
    name: 精简首页标签
    match: (?i)^https:\/\/gateway\.hibixin\.com\/resource\/v\d\/common\/tab\/query$
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/779cce9e7ca26323f8965b07412056e3f6d825b7a0e99e5d5707ebf24d6b898c.js
    body_required: true
    update_interval: 86400
- http_response:
    name: 精简我的页面
    match: (?i)^https:\/\/gateway\.hibixin\.com\/resource\/v\d\/my\/page$
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/module-stack/scripts/06eb371ea79bae01f6f0bcced91af0cd534312e5266586f17aa94bd69958f7ee.js
    body_required: true
    update_interval: 86400
mitm:
  hostnames:
  - web.hibixin.com
  - api.hibixin.com
  - gateway.hibixin.com
  - gateway.xxqapp.cn
  - api.xxqapp.cn
  - web-bxyuer.bixin.cn
  - gateway.bxyuer.com
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api\.hibixin\.com\/biggie\/home\/v\d\/query\/biggie$
    filter: (.result.list |= map(select(has("bannerList") and .bannerList == null)))
- response_jq:
    match: (?i)^https:\/\/api\.hibixin\.com\/resource\/v\d\/common\/tab$
    filter: (.result |= map(select(.type != "activityCenter")))
