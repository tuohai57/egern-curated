    policy: REJECT
- domain:
    match: wallpaper-1258344696.file.myqcloud.com
    policy: REJECT
- domain:
    match: xs.gdt.qq.com
    policy: REJECT
- ip_cidr:
    match: 120.222.240.171/32
    policy: REJECT
    no_resolve: true
- url_regex:
    match: ^https?:\/\/us\.l\.qq\.com\/exapp
    policy: REJECT
- url_regex:
    match: ^https?:\/\/y\.gtimg\.cn\/music\/common\/upload\/t_splash_info\/
    policy: REJECT
- url_regex:
    match: ^https?:\/\/.+?\/music\/common\/upload\/t_splash_info\/
    policy: REJECT
- url_regex:
    match: ^https?:\/\/((25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)\.){3}(25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)\/music\/common\/upload\/t_splash_info\/
    policy: REJECT
- url_regex:
    match: ^https:\/\/music\.y\.qq\.com\/maproxy\/getPbCompressAd
    policy: REJECT
url_rewrites: []
map_locals:
- match: ^https?:\/\/y\.gtimg\.cn\/music\/common\/\/upload\/kg_ad/.*?\d{4}\.jpg
  status_code: 200
  body: ''
- match: ^https?:\/\/y\.gtimg\.cn\/music\/common\/upload\/targeted_ads
  status_code: 200
  body: ''
mitm:
  hostnames:
  - us.l.qq.com
  - y.gtimg.cn
  - music.y.qq.com
icon: https://raw.githubusercontent.com/lige47/lige_icon/main/icon/05icon/wangluo.png
