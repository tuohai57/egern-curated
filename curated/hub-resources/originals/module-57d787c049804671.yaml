name: IPPure - 节点 IP 纯净度检测
scriptings:
- generic:
    name: ip
    script_url: https://raw.githubusercontent.com/Aswoth/Keek/main/IP
widgets:
- name: ip
  script_name: ip
env_schema:
  LABEL:
    name: LABEL
    description: 自定义标题
    default_value: IP PURITY
  MARK_IP:
    name: MARK_IP
    description: 是否打码 IP，默认 true
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  REFRESH_MINUTES:
    name: REFRESH_MINUTES
    description: 刷新间隔，默认 10 分钟
    default_value: '10'
author: 'Aswoth · Egern adaptation: ErrBin'
description: Egern Widget 版本；env 参数：
