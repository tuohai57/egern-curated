widgets:
- name: dingyue
  script_name: dingyue
env_schema:
  PLAN_TOTAL_GB:
    name: PLAN_TOTAL_GB
    description: 可选。
    default_value: '100'
  REFRESH_HOURS:
    name: REFRESH_HOURS
    description: 可选。
    default_value: '2'
  SUBSCRIPTION_NAME:
    name: SUBSCRIPTION_NAME
    description: 可选。
    default_value: My Subscription
  SUBSCRIPTION_URL:
    name: SUBSCRIPTION_URL
    description: 必填。
  SUBSCRIPTION_USER_AGENT:
    name: SUBSCRIPTION_USER_AGENT
    description: 可选。
    default_value: clash.meta
