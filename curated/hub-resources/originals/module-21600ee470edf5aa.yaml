name: Egern 油价小组件（Canvas 绘制）
scriptings:
- generic:
    name: youjia-widget-canvas
    script_url: https://raw.githubusercontent.com/Revicess/Egern/master/widget/youjia-widget-canvas.js
widgets:
- name: youjia-widget-canvas
  script_name: youjia-widget-canvas
env_schema:
  CITY:
    name: CITY
    description: 省份名称，如 "北京"、"福建"、"广东"（默认：北京）
    default_value: 北京
  TYPE:
    name: TYPE
    description: 油种代号，直接填数字；89 / 92 / 95 / 98 / 0（0=柴油）；（默认：95）
    default_value: '95'
    options:
    - '89'
    - '92'
    - '95'
    - '98'
    - '0'
author: 'Revicess · Egern adaptation: ErrBin'
description: 配置 1 个小组件，通过通用脚本生成界面。
