# Reviewed upstream refresh 2026-11-26; curated names and user selection retained.
name: 小组件·订阅流量·双环版（适配）
scriptings:
- generic:
    update_interval: 86400
    name: 订阅流量·双环版·脚本1
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/hub-resources/scripts/8e729cf221561ebf6d4327c2569ee2c33b754c3419c41d5f061e02d0b022099d.js
widgets:
- name: 订阅流量·双环版
  script_name: 订阅流量·双环版·脚本1
env_schema:
  PLAN_TOTAL_GB:
    name: PLAN_TOTAL_GB
    description: 可选。
    default_value: '100'
  SUBSCRIPTION_NAME:
    name: SUBSCRIPTION_NAME
    description: 可选。
    default_value: My Subscription
  SUBSCRIPTION_URL:
    name: SUBSCRIPTION_URL
    description: 必填。
  SUBSCRIPTION_USER_AGENT:
    name: SUBSCRIPTION_USER_AGENT
    description: 可选。
    default_value: clash.meta
  WIDGET_STYLE:
    name: WIDGET_STYLE
    description: 可选。glass：根容器不设置背景色，桌面壁纸直接透出来；classic：保留原来的浅色/深色纯色背景
    default_value: glass
    options:
    - glass
    - classic
  REFRESH_HOURS:
    name: REFRESH_HOURS
    description: 可选。
    default_value: '2'
author: 'pronounAI · Egern adaptation: ErrBin'
description: 配置 1 个小组件，通过通用脚本生成界面。
icon: https://egern.pages.dev/assets/icons/pronounAI/Egern/Subscription-Widget.webp
