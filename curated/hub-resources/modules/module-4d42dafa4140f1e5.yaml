# Egern Hub reviewed resource. Original author and script bytes retained.
# Source: https://egern.pages.dev/modules/moyuzaime/egern/ChinaUnicom/ChinaUnicom.yaml
name: 中国联通·多端版
description: 打开中国联通 App 余量页或微信「余量查询」页查询一次即可自动读取｜更新时间：2026-11-04 21:15（北京时间）
author: iBL3ND
homepage: https://github.com/moyuzaime/egern/tree/main/ChinaUnicom
icon: https://iili.io/nEuB6Jt.png
compat_arguments:
  cuCapture: 'true'
  cuCaptureNotice: 'true'
  cuPlanNotice: 'true'
  cuMiniCapture: 'true'
  cuGeneralFlow: 'true'
  cuDirectionalFlow: 'true'
  cuUiStyle: classic
  cuDebug: 'false'
compat_arguments_schema:
  cuCapture:
    name: 中国联通数据抓取
    description: 监听联通 App 请求（m.client.10010.com）；关闭后 App 侧不写入任何数据
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  cuMiniCapture:
    name: 微信小程序数据抓取
    description: 监听微信「中国联通」小程序的首页接口与「余量查询」页（mina / mxx），解析通用流量、其他流量、语音及账户余额/本月消费/结转/欠费。关闭后不解析小程序响应
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  cuUiStyle:
    name: 显示样式
    description: classic = 当前样式；dash = 仪表盘版（四宫格卡片）；ios = iOS 风格（圆环 + 列表）
    default_value: classic
    options:
    - classic
    - dash
    - ios
  cuGeneralFlow:
    name: 显示通用流量
    description: 流量统计包含通用流量（关闭则只统计定向流量）
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  cuDirectionalFlow:
    name: 显示定向流量
    description: 流量统计包含定向流量，并单独显示一行定向余量（关闭则只统计通用流量）
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  cuDebug:
    name: 调试日志
    description: 打开后会在脚本日志里打印接口响应结构与关键字段（不含手机号/票据），用于排查字段变化；平时保持关闭
    default_value: 'false'
    options:
    - 'true'
    - 'false'
  cuCaptureNotice:
    name: 数据捕获成功通知
    description: 捕获到 App 登录信息或小程序套餐数据时发送通知
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  cuPlanNotice:
    name: 套餐查询成功通知
    description: 联通接口成功返回后通知当前话费、流量和语音余量
    default_value: 'true'
    options:
    - 'true'
    - 'false'
scriptings:
- generic:
    name: 中国联通·多端版·脚本1
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/hub-resources/scripts/eaf7d37ae3e324a942889e94a3bbde9c7ea2c62d7ecd59fcc01814aa95399f1d.js
    update_interval: 21600
    timeout: 20
    env:
      cuCapture: '{{{cuCapture}}}'
      cuCaptureNotice: '{{{cuCaptureNotice}}}'
      cuDebug: '{{{cuDebug}}}'
      cuPlanNotice: '{{{cuPlanNotice}}}'
      cuMiniCapture: '{{{cuMiniCapture}}}'
      cuGeneralFlow: '{{{cuGeneralFlow}}}'
      cuUiStyle: '{{{cuUiStyle}}}'
      cuDirectionalFlow: '{{{cuDirectionalFlow}}}'
- http_request:
    name: 中国联通·多端版·脚本2
    match: ^https://m\.client\.10010\.com/
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/hub-resources/scripts/eaf7d37ae3e324a942889e94a3bbde9c7ea2c62d7ecd59fcc01814aa95399f1d.js
    body_required: false
    max_size: 1048576
    timeout: 10
    env:
      cuCapture: '{{{cuCapture}}}'
      cuCaptureNotice: '{{{cuCaptureNotice}}}'
      cuDebug: '{{{cuDebug}}}'
      cuPlanNotice: '{{{cuPlanNotice}}}'
    update_interval: 86400
- http_response:
    name: 中国联通·多端版·脚本3
    match: ^https://(mina\.10010\.com/wxapplet/weixinNew/|mxx\.client\.10010\.com/(?:servicequerybusiness|servicebusiness)/)
    script_url: https://raw.githubusercontent.com/tuohai57/egern-curated/main/curated/hub-resources/scripts/eaf7d37ae3e324a942889e94a3bbde9c7ea2c62d7ecd59fcc01814aa95399f1d.js
    body_required: true
    max_size: 1048576
    timeout: 10
    env:
      cuMiniCapture: '{{{cuMiniCapture}}}'
      cuCaptureNotice: '{{{cuCaptureNotice}}}'
    update_interval: 86400
mitm:
  hostnames:
    includes:
    - m.client.10010.com
    - mina.10010.com
    - mxx.client.10010.com
widgets:
- name: 中国联通·多端版
  script_name: 中国联通·多端版·脚本1
