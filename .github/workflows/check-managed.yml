name: Check maintained Egern resources
on:
  push:
    paths:
      - 'curated/modules/managed/**'
      - 'curated/scripts/managed/**'
      - 'curated/scripts/source/**'
      - 'curated/rules/managed/**'
      - 'curated/managed-*.json'
      - 'curated/tools/check_managed.py'
      - 'curated/tools/test_scripts.cjs'
      - 'curated/native-full/**'
      - 'curated/module-stack/**'
      - 'curated/tools/check_native_full.py'
      - 'curated/tools/test_native_full.cjs'
      - 'curated/tools/adblock_model.py'
      - 'curated/tools/test_adblock_coverage.py'
      - 'curated/tools/test_app_ad_paths.py'
      - 'curated/routing/**'
      - 'curated/tools/test_service_routing.py'
      - '.github/workflows/check-managed.yml'
  pull_request:
    paths:
      - 'curated/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install PyYAML==6.0.2
      - run: python curated/tools/check_managed.py
      - run: node curated/tools/test_scripts.cjs
      - run: sudo apt-get update -qq && sudo apt-get install -y jq
      - run: python curated/tools/check_native_full.py
      - run: node curated/tools/test_native_full.cjs
      - run: python curated/tools/test_adblock_coverage.py
      - run: python curated/tools/test_app_ad_paths.py
      - run: python curated/tools/test_service_routing.py
      - run: python curated/tools/check_module_stack.py
